
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Broadcast Tracker | Young Meeat LLC</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .live-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .stat-value {
            font-size: 42px;
            font-weight: 800;
            color: #ef4444;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .broadcast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .broadcast-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s;
        }

        .broadcast-card.live {
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .broadcast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .league-badge {
            background: #ef4444;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        .live-indicator {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .matchup {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin: 20px 0;
        }

        .team {
            text-align: center;
        }

        .team-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .team-score {
            font-size: 36px;
            font-weight: 900;
            color: #ef4444;
        }

        .vs {
            font-size: 20px;
            font-weight: 700;
            opacity: 0.6;
        }

        .game-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .broadcast-output {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-top: 30px;
        }

        .output-header {
            font-size: 24px;
            color: #22c55e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .output-feed {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
        }

        .output-item {
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #22c55e;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 4px;
        }

        .output-time {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .network-card {
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .network-card.active {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .network-name {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .network-status {
            font-size: 12px;
            color: #22c55e;
        }

        .btn-broadcast {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }

        .btn-broadcast:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
        }

        @media (max-width: 768px) {
            .broadcast-grid {
                grid-template-columns: 1fr;
            }
            .network-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 Live Sports Broadcast Tracker</h1>
        <p style="opacity: 0.9; margin: 10px 0;">Real-Time Multi-Network Sports Broadcasting</p>
        <div>
            <span class="live-badge">🔴 LIVE BROADCASTING</span>
            <span class="live-badge">FCC: 20130314143016</span>
            <span class="live-badge">All Networks Active</span>
        </div>
    </div>

    <div class="container">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="liveGamesCount">0</div>
                <div class="stat-label">Live Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="networksActive">0</div>
                <div class="stat-label">Active Networks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="broadcastsTotal">0</div>
                <div class="stat-label">Total Broadcasts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="viewersCount">0</div>
                <div class="stat-label">Total Viewers</div>
            </div>
        </div>

        <!-- Broadcast Controls -->
        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn-broadcast" onclick="startBroadcast()">
                📡 Start Broadcast to All Networks
            </button>
            <button class="btn-broadcast" onclick="refreshFeeds()">
                🔄 Refresh Live Feeds
            </button>
        </div>

        <!-- Live Games Grid -->
        <h2 style="font-size: 32px; margin-bottom: 20px; color: #ef4444;">🔴 Live Games Broadcasting</h2>
        <div class="broadcast-grid" id="liveGamesGrid"></div>

        <!-- Broadcast Output Feed -->
        <div class="broadcast-output">
            <div class="output-header">
                <span>📢</span>
                <span>Live Broadcast Output Feed</span>
            </div>
            <div class="output-feed" id="outputFeed"></div>
        </div>

        <!-- Network Status -->
        <h2 style="font-size: 32px; margin: 40px 0 20px; color: #22c55e;">📡 Broadcasting Networks</h2>
        <div class="network-grid" id="networkGrid"></div>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'http://0.0.0.0:5000';
        let eventSource = null;
        let broadcastInterval = null;

        const networks = [
            { id: 'espn', name: 'ESPN', status: 'active' },
            { id: 'fox-sports', name: 'FOX Sports', status: 'active' },
            { id: 'nbc-sports', name: 'NBC Sports', status: 'active' },
            { id: 'cbs-sports', name: 'CBS Sports', status: 'active' },
            { id: 'amazon-prime', name: 'Amazon Prime Video', status: 'active' },
            { id: 'nba-tv', name: 'NBA TV', status: 'active' },
            { id: 'nfl-network', name: 'NFL Network', status: 'active' },
            { id: 'mlb-network', name: 'MLB Network', status: 'active' },
            { id: 'nhl-network', name: 'NHL Network', status: 'active' },
            { id: 'radio-network', name: 'Radio Broadcasting', status: 'active' }
        ];

        async function loadLiveGames() {
            try {
                const response = await fetch(`${API_BASE}/espn-tracker/live`);
                const data = await response.json();

                document.getElementById('liveGamesCount').textContent = data.liveGames.length;
                document.getElementById('broadcastsTotal').textContent = data.liveGames.length * networks.length;
                
                displayLiveGames(data.liveGames);
            } catch (error) {
                console.error('Error loading live games:', error);
            }
        }

        function displayLiveGames(games) {
            const grid = document.getElementById('liveGamesGrid');

            if (games.length === 0) {
                grid.innerHTML = '<p style="text-align: center; opacity: 0.7; grid-column: 1/-1;">No live games at the moment</p>';
                return;
            }

            grid.innerHTML = games.map(game => `
                <div class="broadcast-card live">
                    <div class="broadcast-header">
                        <div class="league-badge">${game.league}</div>
                        <div class="live-indicator">
                            <span class="pulse-dot"></span>
                            LIVE
                        </div>
                    </div>
                    <div class="matchup">
                        <div class="team">
                            <div class="team-name">${game.awayTeam}</div>
                            <div class="team-score">${game.score?.away || 0}</div>
                        </div>
                        <div class="vs">@</div>
                        <div class="team">
                            <div class="team-name">${game.homeTeam}</div>
                            <div class="team-score">${game.score?.home || 0}</div>
                        </div>
                    </div>
                    <div class="game-info">
                        <div class="info-row">
                            <span>Status:</span>
                            <span style="color: #ef4444; font-weight: 700;">${game.quarter || 'Live'}</span>
                        </div>
                        <div class="info-row">
                            <span>Time Remaining:</span>
                            <span>${game.timeRemaining || '--:--'}</span>
                        </div>
                        <div class="info-row">
                            <span>Venue:</span>
                            <span>${game.venue}</span>
                        </div>
                        <div class="info-row">
                            <span>Broadcasting On:</span>
                            <span style="color: #22c55e; font-weight: 700;">${networks.length} Networks</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function displayNetworks() {
            const grid = document.getElementById('networkGrid');
            const activeCount = networks.filter(n => n.status === 'active').length;
            
            document.getElementById('networksActive').textContent = activeCount;

            grid.innerHTML = networks.map(network => `
                <div class="network-card ${network.status}">
                    <div class="network-name">${network.name}</div>
                    <div class="network-status">✓ Broadcasting</div>
                </div>
            `).join('');
        }

        function addBroadcastOutput(message) {
            const feed = document.getElementById('outputFeed');
            const timestamp = new Date().toLocaleTimeString();
            
            const item = document.createElement('div');
            item.className = 'output-item';
            item.innerHTML = `
                <div class="output-time">${timestamp}</div>
                <div>${message}</div>
            `;
            
            feed.insertBefore(item, feed.firstChild);
            
            // Keep only last 50 items
            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        function startBroadcast() {
            addBroadcastOutput('🎬 Initiating broadcast to all networks...');
            
            setTimeout(() => {
                networks.forEach(network => {
                    addBroadcastOutput(`📡 Broadcasting to ${network.name} - ACTIVE`);
                });
                addBroadcastOutput('✅ All networks receiving broadcast signal');
            }, 500);

            // Simulate viewer count
            let viewers = Math.floor(Math.random() * 50000) + 10000;
            document.getElementById('viewersCount').textContent = viewers.toLocaleString();
        }

        function refreshFeeds() {
            addBroadcastOutput('🔄 Refreshing all network feeds...');
            loadLiveGames();
            setTimeout(() => {
                addBroadcastOutput('✅ All feeds updated successfully');
            }, 1000);
        }

        function connectToLiveStream() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${API_BASE}/espn-tracker/stream`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'scoreUpdate') {
                    const game = data.game;
                    addBroadcastOutput(
                        `⚡ SCORE UPDATE: ${game.awayTeam} ${game.score?.away || 0} @ ${game.homeTeam} ${game.score?.home || 0} - ${game.quarter || 'Live'}`
                    );
                    loadLiveGames();
                } else if (data.type === 'refresh') {
                    loadLiveGames();
                }
            };

            eventSource.onerror = () => {
                console.error('EventSource error, reconnecting...');
                setTimeout(connectToLiveStream, 5000);
            };
        }

        // Initialize
        displayNetworks();
        loadLiveGames();
        connectToLiveStream();

        // Auto-refresh every 30 seconds
        setInterval(loadLiveGames, 30000);

        // Simulate periodic broadcast updates
        setInterval(() => {
            const messages = [
                '📊 Broadcasting statistics updated across all networks',
                '🎯 Network synchronization complete',
                '📡 Signal strength optimal on all channels',
                '✅ FCC compliance verified for all broadcasts'
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            addBroadcastOutput(randomMessage);
        }, 45000);

        // Initial broadcast message
        setTimeout(() => {
            addBroadcastOutput('🚀 Live Sports Broadcast Tracker initialized');
            addBroadcastOutput('📡 Connected to all broadcasting networks');
            addBroadcastOutput('✅ FCC Entity: 20130314143016 - Broadcasting Authority Active');
        }, 1000);
    </script>
</body>
</html>
