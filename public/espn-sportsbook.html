<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Young Meeat LLC Sports Book Enterprise Hub - ESPN Live Sportsbook</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #c8102e 0%, #13274f 100%);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .espn-badge {
            background: rgba(200, 16, 46, 0.2);
            border: 2px solid #c8102e;
            color: #c8102e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin: 5px;
            font-weight: 700;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin: 5px;
            font-weight: 700;
        }

        .live-pulse {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin: 5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(200, 16, 46, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: #c8102e;
            transform: translateY(-3px);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #c8102e;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .news-ticker {
            background: rgba(19, 39, 79, 0.8);
            border: 2px solid rgba(200, 16, 46, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .ticker-content {
            display: flex;
            animation: scroll 30s linear infinite;
        }

        .ticker-item {
            flex-shrink: 0;
            padding: 0 40px;
            border-right: 2px solid rgba(200, 16, 46, 0.3);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            color: #c8102e;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-tab {
            background: rgba(200, 16, 46, 0.2);
            border: 2px solid rgba(200, 16, 46, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-tab:hover, .filter-tab.active {
            background: #c8102e;
            border-color: #c8102e;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .game-card {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(200, 16, 46, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-card.live {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .game-card:hover {
            border-color: #c8102e;
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(200, 16, 46, 0.4);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .league-badge {
            background: #c8102e;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-live {
            background: #ef4444;
            animation: pulse 2s infinite;
        }

        .status-scheduled {
            background: #3b82f6;
        }

        .game-time {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 32px;
            font-weight: 700;
            color: #c8102e;
        }

        .vs {
            font-size: 20px;
            font-weight: 700;
            opacity: 0.6;
            padding: 0 15px;
        }

        .game-details {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 13px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .odds-section {
            margin-top: 20px;
        }

        .odds-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .odds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .odds-btn {
            background: rgba(200, 16, 46, 0.2);
            border: 2px solid rgba(200, 16, 46, 0.4);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .odds-btn:hover {
            background: rgba(200, 16, 46, 0.4);
            border-color: #c8102e;
        }

        .odds-btn.selected {
            background: #22c55e;
            border-color: #22c55e;
        }

        .odds-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .odds-value {
            font-size: 18px;
            font-weight: 700;
        }

        .bet-controls {
            margin-top: 12px;
            display: none;
        }

        .bet-controls.active {
            display: block;
        }

        .bet-input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(200, 16, 46, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn-place-bet {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-place-bet:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .parlay-builder {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(200, 16, 46, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-top: 30px;
        }

        .parlay-selections {
            margin: 20px 0;
        }

        .parlay-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .parlay-summary {
            background: linear-gradient(135deg, #c8102e 0%, #13274f 100%);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #c8102e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📺 ESPN Sportsbook</h1>
        <p style="font-size: 18px; margin: 10px 0;">All Sports • Live Data • Real-Time Betting</p>
        <div>
            <span class="espn-badge">ESPN POWERED</span>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
            <span class="live-pulse">
                <span class="pulse-dot"></span>
                LIVE
            </span>
        </div>
    </div>

    <div class="container">
        <!-- Statistics Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">Total Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="liveGames">0</div>
                <div class="stat-label">Live Now</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="upcomingGames">0</div>
                <div class="stat-label">Upcoming</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeBets">0</div>
                <div class="stat-label">Active Bets</div>
            </div>
        </div>

        <!-- ESPN News Ticker -->
        <div class="news-ticker">
            <div class="ticker-content" id="newsTicker">
                <div class="ticker-item">Loading ESPN news...</div>
            </div>
        </div>

        <!-- Sport Filter Tabs -->
        <div class="section-header">
            <h2 class="section-title">🏆 Live & Upcoming Games</h2>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterSport('all')">All Sports</button>
                <button class="filter-tab" onclick="filterSport('NFL')">🏈 NFL</button>
                <button class="filter-tab" onclick="filterSport('NBA')">🏀 NBA</button>
                <button class="filter-tab" onclick="filterSport('MLB')">⚾ MLB</button>
                <button class="filter-tab" onclick="filterSport('NHL')">🏒 NHL</button>
                <button class="filter-tab" onclick="filterSport('Soccer')">⚽ Soccer</button>
            </div>
        </div>

        <!-- Games Grid -->
        <div class="games-grid" id="gamesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading ESPN data...</p>
            </div>
        </div>

        <!-- Parlay Builder -->
        <div class="parlay-builder" id="parlayBuilder" style="display: none;">
            <h2 class="section-title">🔗 Parlay Builder</h2>
            <div class="parlay-selections" id="parlaySelections"></div>
            <div class="parlay-summary" id="parlaySummary"></div>
            <button class="btn-place-bet" onclick="placeParlayBet()" style="margin-top: 15px;">
                💰 Place Parlay Bet
            </button>
        </div>
    </div>

    <script>
        let allGames = [];
        let liveGames = [];
        let upcomingGames = [];
        let selectedBets = new Map();
        let parlayPicks = [];
        let currentSportFilter = 'all';
        let eventSource = null;

        // Load ESPN Games
        async function loadESPNGames() {
            try {
                const response = await fetch(`${API_BASE}/espn-tracker/games`);
                const data = await response.json();

                if (data.games) {
                    allGames = data.games;
                    liveGames = allGames.filter(g => g.status === 'live');
                    upcomingGames = allGames.filter(g => g.status === 'scheduled');

                    displayGames();
                    updateStats();
                }
            } catch (error) {
                console.error('Error loading ESPN games:', error);
                document.getElementById('gamesGrid').innerHTML = `
                    <div class="loading">
                        <p style="color: #ef4444;">Failed to load ESPN data</p>
                        <button onclick="loadESPNGames()" class="btn-place-bet" style="max-width: 200px; margin-top: 15px;">Retry</button>
                    </div>
                `;
            }
        }

        // Load ESPN News
        async function loadESPNNews() {
            try {
                const response = await fetch(`${API_BASE}/espn-tracker/news?limit=20`);
                const data = await response.json();

                if (data.news && data.news.length > 0) {
                    const ticker = document.getElementById('newsTicker');
                    ticker.innerHTML = data.news.map(item => `
                        <div class="ticker-item">
                            <strong>${item.league}</strong>: ${item.headline}
                        </div>
                    `).join('') + data.news.map(item => `
                        <div class="ticker-item">
                            <strong>${item.league}</strong>: ${item.headline}
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading ESPN news:', error);
            }
        }

        function displayGames() {
            const grid = document.getElementById('gamesGrid');

            const filtered = currentSportFilter === 'all' 
                ? allGames 
                : allGames.filter(g => g.league === currentSportFilter);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading"><p style="opacity: 0.7;">No games available</p></div>';
                return;
            }

            grid.innerHTML = filtered.map((game, idx) => {
                const isLive = game.status === 'live';
                const homeOdds = Math.floor(Math.random() * 200) - 150;
                const awayOdds = Math.floor(Math.random() * 200) - 150;

                return `
                    <div class="game-card ${isLive ? 'live' : ''}" id="game-${idx}">
                        <div class="game-header">
                            <span class="league-badge">${game.league}</span>
                            <span class="status-badge ${isLive ? 'status-live' : 'status-scheduled'}">
                                ${isLive ? '🔴 LIVE' : 'UPCOMING'}
                            </span>
                        </div>

                        <div class="game-time">
                            ${isLive ? 'In Progress' : new Date(game.scheduledStartTime).toLocaleString()}
                        </div>

                        <div class="matchup">
                            <div class="team">
                                <div class="team-name">${game.awayTeam}</div>
                                ${game.score ? `<div class="team-score">${game.score.away}</div>` : ''}
                            </div>
                            <div class="vs">${isLive ? '@' : 'VS'}</div>
                            <div class="team">
                                <div class="team-name">${game.homeTeam}</div>
                                ${game.score ? `<div class="team-score">${game.score.home}</div>` : ''}
                            </div>
                        </div>

                        ${isLive && game.quarter && game.timeRemaining ? `
                            <div class="game-details">
                                <div class="detail-row">
                                    <span>Quarter:</span>
                                    <strong>${game.quarter}</strong>
                                </div>
                                <div class="detail-row">
                                    <span>Time Remaining:</span>
                                    <strong>${game.timeRemaining}</strong>
                                </div>
                            </div>
                        ` : ''}

                        ${game.venue ? `
                            <div class="game-details">
                                <div class="detail-row">
                                    <span>Venue:</span>
                                    <strong>${game.venue}</strong>
                                </div>
                            </div>
                        ` : ''}

                        <div class="odds-section">
                            <div class="odds-title">Money Line Odds</div>
                            <div class="odds-grid">
                                <div class="odds-btn" onclick="selectOdds('${game.gameId}', '${idx}', 'away', ${awayOdds}, '${game.awayTeam}')">
                                    <div class="odds-label">${game.awayTeam}</div>
                                    <div class="odds-value">${awayOdds > 0 ? '+' : ''}${awayOdds}</div>
                                </div>
                                <div class="odds-btn" onclick="selectOdds('${game.gameId}', '${idx}', 'home', ${homeOdds}, '${game.homeTeam}')">
                                    <div class="odds-label">${game.homeTeam}</div>
                                    <div class="odds-value">${homeOdds > 0 ? '+' : ''}${homeOdds}</div>
                                </div>
                            </div>
                        </div>

                        <div class="bet-controls" id="bet-${idx}">
                            <input type="number" class="bet-input" id="amount-${idx}" 
                                   placeholder="Enter bet amount ($)" min="1">
                            <button class="btn-place-bet" onclick="placeBet('${game.gameId}', '${idx}')">
                                💰 Place Bet
                            </button>
                        </div>

                        <button class="btn-place-bet" onclick="addToParlay('${game.gameId}', '${idx}')" 
                                style="margin-top: 8px; background: linear-gradient(135deg, #c8102e 0%, #13274f 100%);">
                            🔗 Add to Parlay
                        </button>

                        <button class="btn-place-bet" onclick="openESPNRadio('${game.gameId}')" 
                                style="margin-top: 8px; background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);">
                            📻 Listen Live Radio
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function openESPNRadio(gameId) {
            try {
                const response = await fetch(\`\${API_BASE}/espn-tracker/radio-stream/\${gameId}\`);
                const data = await response.json();

                if (data.success && data.radioStream) {
                    const confirmMsg = \`🎧 ESPN Radio Stream\\n\\nGame: \${data.game.matchup}\\nListeners: \${data.radioStream.listeners.toLocaleString()}\\nQuality: \${data.radioStream.quality.toUpperCase()}\\n\\nOpen stream?\`;

                    if (confirm(confirmMsg)) {
                        window.open(data.radioStream.streamUrl, '_blank');
                    }
                } else {
                    alert('❌ No radio stream available for this game');
                }
            } catch (error) {
                console.error('Radio stream error:', error);
                alert('❌ Failed to load radio stream');
            }
        }

        function selectOdds(gameId, gameIdx, team, odds, teamName) {
            const card = event.target.closest('.game-card');
            card.querySelectorAll('.odds-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.odds-btn').classList.add('selected');

            selectedBets.set(gameIdx, { gameId, team, odds, teamName });
            document.getElementById(`bet-${gameIdx}`).classList.add('active');
        }

        async function placeBet(gameId, gameIdx) {
            const betInfo = selectedBets.get(gameIdx);
            if (!betInfo) {
                alert('Please select odds first');
                return;
            }

            const amount = parseFloat(document.getElementById(`amount-${gameIdx}`).value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/espn-betting/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'espn-user',
                        gameId,
                        betType: 'moneyline',
                        selection: betInfo.team,
                        amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ ESPN Bet placed!\nTeam: ${betInfo.teamName}\nAmount: $${amount}\nPotential Win: $${data.bet.potentialPayout.toFixed(2)}`);
                    document.getElementById(`amount-${gameIdx}`).value = '';
                    document.getElementById(`bet-${gameIdx}`).classList.remove('active');
                    selectedBets.delete(gameIdx);
                    updateActiveBets();
                } else {
                    alert('❌ ' + (data.error || 'Failed to place bet'));
                }
            } catch (error) {
                console.error('Bet error:', error);
                alert('❌ Failed to place bet');
            }
        }

        function addToParlay(gameId, gameIdx) {
            const betInfo = selectedBets.get(gameIdx);
            if (!betInfo) {
                alert('Please select odds first');
                return;
            }

            const game = allGames.find(g => g.gameId === gameId);
            if (!game) return;

            parlayPicks.push({
                gameId,
                league: game.league,
                matchup: `${game.awayTeam} @ ${game.homeTeam}`,
                selection: betInfo.teamName,
                odds: betInfo.odds
            });

            updateParlayBuilder();
            alert(`Added ${betInfo.teamName} to parlay!`);
        }

        function updateParlayBuilder() {
            const builder = document.getElementById('parlayBuilder');
            const selections = document.getElementById('parlaySelections');
            const summary = document.getElementById('parlaySummary');

            if (parlayPicks.length === 0) {
                builder.style.display = 'none';
                return;
            }

            builder.style.display = 'block';

            selections.innerHTML = parlayPicks.map((pick, idx) => `
                <div class="parlay-item">
                    <div>
                        <strong>${pick.league}</strong>: ${pick.selection}<br>
                        <small style="opacity: 0.7;">${pick.matchup}</small>
                    </div>
                    <div>
                        <strong>${pick.odds > 0 ? '+' : ''}${pick.odds}</strong>
                        <button onclick="removeFromParlay(${idx})" style="margin-left: 10px; background: #ef4444; border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;">×</button>
                    </div>
                </div>
            `).join('');

            let combinedOdds = 1;
            parlayPicks.forEach(pick => {
                const decimalOdds = pick.odds > 0 ? (pick.odds / 100 + 1) : (100 / Math.abs(pick.odds) + 1);
                combinedOdds *= decimalOdds;
            });

            const americanOdds = combinedOdds > 2 ? Math.round((combinedOdds - 1) * 100) : Math.round(-100 / (combinedOdds - 1));

            summary.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center;">
                    <div>
                        <div style="font-size: 12px; opacity: 0.8;">Legs</div>
                        <div style="font-size: 28px; font-weight: 700;">${parlayPicks.length}</div>
                    </div>
                    <div>
                        <div style="font-size: 12px; opacity: 0.8;">Combined Odds</div>
                        <div style="font-size: 28px; font-weight: 700;">${americanOdds > 0 ? '+' : ''}${americanOdds}</div>
                    </div>
                </div>
            `;
        }

        function removeFromParlay(idx) {
            parlayPicks.splice(idx, 1);
            updateParlayBuilder();
        }

        async function placeParlayBet() {
            if (parlayPicks.length < 2) {
                alert('Parlay requires at least 2 picks');
                return;
            }

            const amount = parseFloat(prompt('Enter parlay bet amount ($):'));
            if (!amount || amount <= 0) return;

            try {
                const response = await fetch(`${API_BASE}/espn-betting/parlay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'espn-user',
                        selections: parlayPicks,
                        amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Parlay placed!\nLegs: ${data.parlayBet.legs}\nOdds: ${data.parlayBet.totalOdds}\nPotential Win: $${data.parlayBet.potentialPayout}`);
                    parlayPicks = [];
                    updateParlayBuilder();
                    updateActiveBets();
                } else {
                    alert('❌ Failed to place parlay');
                }
            } catch (error) {
                console.error('Parlay error:', error);
                alert('❌ Failed to place parlay');
            }
        }

        function filterSport(sport) {
            currentSportFilter = sport;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            displayGames();
        }

        function updateStats() {
            document.getElementById('totalGames').textContent = allGames.length;
            document.getElementById('liveGames').textContent = liveGames.length;
            document.getElementById('upcomingGames').textContent = upcomingGames.length;
        }

        function updateActiveBets() {
            const current = parseInt(document.getElementById('activeBets').textContent);
            document.getElementById('activeBets').textContent = current + 1;
        }

        function connectLiveUpdates() {
            if (eventSource) eventSource.close();

            eventSource = new EventSource(`${API_BASE}/espn-tracker/stream`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Live update:', data);
                loadESPNGames();
            };

            eventSource.onerror = () => {
                console.error('EventSource error, reconnecting...');
                setTimeout(connectLiveUpdates, 5000);
            };
        }

        // Initialize
        window.addEventListener('load', () => {
            loadESPNGames();
            loadESPNNews();
            connectLiveUpdates();

            setInterval(() => {
                loadESPNGames();
                loadESPNNews();
            }, 30000);
        });

        window.addEventListener('beforeunload', () => {
            if (eventSource) eventSource.close();
        });
    </script>
</body>
</html>
