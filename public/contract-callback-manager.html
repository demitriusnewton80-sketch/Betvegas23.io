
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Callback Manager | FCC: 20130314143016</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        .stat-value {
            font-size: 42px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }
        .section h2 {
            color: #fbbf24;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .contract-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #22c55e;
        }
        .contract-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .contract-name {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }
        .status-badge {
            background: #22c55e;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }
        .hostname-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .hostname-tag {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1e3a8a;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 Contract Callback Manager</h1>
            <p style="color: rgba(255, 255, 255, 0.9); margin-top: 10px;">
                FCC-Compliant Hostname Callback System with Functional Structures
            </p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="btn" onclick="showNewContractForm()">➕ New Contract</button>
            <button class="btn" onclick="showNewCallbackForm()">🔗 New Callback</button>
        </div>

        <div class="section">
            <h2>📋 Active Contracts</h2>
            <div id="contractsList"></div>
        </div>

        <div class="section">
            <h2>✅ FCC Compliance Status</h2>
            <div id="complianceStatus"></div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        const API_BASE = window.location.origin;

        async function loadMetrics() {
            try {
                const response = await fetch(`${API_BASE}/contract-callbacks/metrics`);
                const data = await response.json();

                if (data.success) {
                    const statsHtml = `
                        <div class="stat-card">
                            <div class="stat-value">${data.metrics.totalContracts}</div>
                            <div class="stat-label">Total Contracts</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.metrics.activeContracts}</div>
                            <div class="stat-label">Active Contracts</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.metrics.totalCallbacks}</div>
                            <div class="stat-label">Total Callbacks</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.metrics.activeCallbacks}</div>
                            <div class="stat-label">Active Callbacks</div>
                        </div>
                    `;
                    document.getElementById('statsGrid').innerHTML = statsHtml;
                }
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        async function loadContracts() {
            try {
                const response = await fetch(`${API_BASE}/contract-callbacks/contracts`);
                const data = await response.json();

                if (data.success && data.contracts.length > 0) {
                    const contractsHtml = data.contracts.map(contract => `
                        <div class="contract-card">
                            <div class="contract-header">
                                <div class="contract-name">${contract.name}</div>
                                <div class="status-badge">${contract.status}</div>
                            </div>
                            <div style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 10px;">
                                Provider: ${contract.provider} | Structure: ${contract.structureId}
                            </div>
                            <div style="color: rgba(255,255,255,0.7); font-size: 12px; margin-bottom: 10px;">
                                Callback: ${contract.callbackEndpoint}
                            </div>
                            <div class="hostname-list">
                                ${contract.hostnames.map(h => 
                                    `<span class="hostname-tag">${h}</span>`
                                ).join('')}
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('contractsList').innerHTML = contractsHtml;
                } else {
                    document.getElementById('contractsList').innerHTML = 
                        '<p style="color: rgba(255,255,255,0.7);">No contracts available</p>';
                }
            } catch (error) {
                console.error('Error loading contracts:', error);
            }
        }

        async function loadCompliance() {
            try {
                const response = await fetch(`${API_BASE}/contract-callbacks/fcc-compliance`);
                const data = await response.json();

                if (data.success) {
                    const complianceHtml = `
                        <div style="background: rgba(34, 197, 94, 0.1); border: 2px solid #22c55e; padding: 20px; border-radius: 12px;">
                            <h3 style="color: #22c55e; margin-bottom: 15px;">✅ FCC Compliance Status</h3>
                            <div style="color: rgba(255,255,255,0.9); margin-bottom: 8px;">
                                <strong>FCC Entity:</strong> ${data.compliance.fccEntity}
                            </div>
                            <div style="color: rgba(255,255,255,0.9); margin-bottom: 8px;">
                                <strong>All Contracts Compliant:</strong> ${data.compliance.allContractsCompliant ? 'Yes' : 'No'}
                            </div>
                            <div style="color: rgba(255,255,255,0.9); margin-bottom: 8px;">
                                <strong>Compliant Callbacks:</strong> ${data.compliance.compliantCallbacks} / ${data.compliance.totalCallbacks}
                            </div>
                            <div style="color: rgba(255,255,255,0.9);">
                                <strong>Compliance Rate:</strong> ${data.compliance.compliancePercentage}%
                            </div>
                        </div>
                    `;
                    document.getElementById('complianceStatus').innerHTML = complianceHtml;
                }
            } catch (error) {
                console.error('Error loading compliance:', error);
            }
        }

        function showNewContractForm() {
            alert('Contract creation form would open here.\n\nFields:\n- Name\n- Provider\n- Structure ID\n- Hostnames\n- Callback Endpoint');
        }

        function showNewCallbackForm() {
            alert('Callback creation form would open here.\n\nFields:\n- Contract ID\n- Hostname\n- Callback URL');
        }

        async function refreshData() {
            await Promise.all([
                loadMetrics(),
                loadContracts(),
                loadCompliance()
            ]);
        }

        // Initial load
        refreshData();

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
