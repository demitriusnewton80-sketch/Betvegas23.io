
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Boxing & UFC Betting Hub - Young Meeat LLC</title>
    <link rel="stylesheet" href="/styles/unified-sportsbook.css">
    <style>
        .fight-card {
            background: var(--bg-card);
            border: 2px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            transition: all var(--transition-normal);
        }

        .fight-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
        }

        .fight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .fight-type {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 14px;
        }

        .fight-type.boxing {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--status-live);
            color: var(--status-live);
        }

        .fight-type.ufc {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid var(--status-warning);
            color: var(--status-warning);
        }

        .fighters {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--spacing-lg);
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }

        .fighter {
            text-align: center;
        }

        .fighter-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .fighter-record {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .vs-badge {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-color);
            padding: 12px 20px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: var(--radius-md);
        }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .odds-option {
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
        }

        .odds-option:hover {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.2);
        }

        .odds-option.selected {
            border-color: var(--secondary-color);
            background: rgba(34, 197, 94, 0.2);
        }

        .odds-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .odds-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--secondary-color);
        }

        .bet-input-section {
            display: none;
            margin-top: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: rgba(59, 130, 246, 0.05);
            border-radius: var(--radius-md);
        }

        .bet-input-section.active {
            display: block;
        }

        .fight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .category-tabs {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 2px solid var(--border-primary);
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .category-tab:hover {
            border-color: var(--primary-color);
        }

        .category-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="sportsbook-header">
        <h1>🥊 Boxing & UFC Betting Hub</h1>
        <p>Bet on the World's Best Fighters</p>
        <div>
            <span class="badge badge-fcc">FCC: 20130314143016</span>
            <span class="badge badge-live">
                <span class="pulse pulse-live"></span>
                <span id="liveCount">0</span> Live Fights
            </span>
        </div>
    </div>

    <div class="sportsbook-container">
        <div class="category-tabs">
            <div class="category-tab active" onclick="filterFights('all')">
                🏆 All Fights
            </div>
            <div class="category-tab" onclick="filterFights('boxing')">
                🥊 Boxing
            </div>
            <div class="category-tab" onclick="filterFights('ufc')">
                🥋 UFC/MMA
            </div>
            <div class="category-tab" onclick="filterFights('live')">
                🔴 Live Now
            </div>
        </div>

        <div id="fightsContainer">
            <!-- Fights will be loaded here -->
        </div>

        <div id="myBets" style="margin-top: 40px;">
            <h2 style="font-size: 28px; margin-bottom: 20px;">📊 My Fight Bets</h2>
            <div id="betsList">
                <p style="color: var(--text-secondary);">No bets placed yet</p>
            </div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        let currentFilter = 'all';
        let fights = [];
        let myBets = [];
        let selectedFights = new Map();

        const fightData = [
            {
                id: 'boxing-1',
                type: 'boxing',
                fighter1: { name: 'Tyson Fury', record: '34-0-1' },
                fighter2: { name: 'Oleksandr Usyk', record: '21-0' },
                title: 'Heavyweight Championship',
                rounds: 12,
                venue: 'Las Vegas, NV',
                date: new Date(Date.now() + 86400000 * 7).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -180, fighter2: +150 }
            },
            {
                id: 'ufc-1',
                type: 'ufc',
                fighter1: { name: 'Jon Jones', record: '27-1' },
                fighter2: { name: 'Stipe Miocic', record: '20-4' },
                title: 'UFC Heavyweight Title',
                rounds: 5,
                venue: 'UFC Apex',
                date: new Date(Date.now() + 86400000 * 3).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -200, fighter2: +170 }
            },
            {
                id: 'boxing-2',
                type: 'boxing',
                fighter1: { name: 'Canelo Alvarez', record: '60-2-2' },
                fighter2: { name: 'Jermall Charlo', record: '32-0' },
                title: 'Super Middleweight',
                rounds: 12,
                venue: 'T-Mobile Arena',
                date: new Date(Date.now() + 86400000 * 14).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -250, fighter2: +200 }
            },
            {
                id: 'ufc-2',
                type: 'ufc',
                fighter1: { name: 'Islam Makhachev', record: '25-1' },
                fighter2: { name: 'Charles Oliveira', record: '34-9' },
                title: 'UFC Lightweight Title',
                rounds: 5,
                venue: 'Abu Dhabi',
                date: new Date(Date.now() + 86400000 * 5).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -140, fighter2: +120 }
            },
            {
                id: 'boxing-3',
                type: 'boxing',
                fighter1: { name: 'Gervonta Davis', record: '29-0' },
                fighter2: { name: 'Ryan Garcia', record: '24-1' },
                title: 'Lightweight Showdown',
                rounds: 12,
                venue: 'MGM Grand',
                date: new Date(Date.now() + 86400000 * 21).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -160, fighter2: +135 }
            },
            {
                id: 'ufc-3',
                type: 'ufc',
                fighter1: { name: 'Alexander Volkanovski', record: '26-3' },
                fighter2: { name: 'Max Holloway', record: '25-7' },
                title: 'UFC Featherweight Title',
                rounds: 5,
                venue: 'Perth, Australia',
                date: new Date(Date.now() + 86400000 * 10).toISOString(),
                status: 'upcoming',
                odds: { fighter1: -130, fighter2: +110 }
            }
        ];

        function renderFights() {
            let filteredFights = fights;

            if (currentFilter === 'boxing') {
                filteredFights = fights.filter(f => f.type === 'boxing');
            } else if (currentFilter === 'ufc') {
                filteredFights = fights.filter(f => f.type === 'ufc');
            } else if (currentFilter === 'live') {
                filteredFights = fights.filter(f => f.status === 'live');
            }

            const container = document.getElementById('fightsContainer');
            
            if (filteredFights.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 40px;">No fights available in this category</p>';
                return;
            }

            container.innerHTML = filteredFights.map(fight => `
                <div class="fight-card">
                    <div class="fight-header">
                        <span class="fight-type ${fight.type}">
                            ${fight.type === 'boxing' ? '🥊' : '🥋'} ${fight.type.toUpperCase()}
                        </span>
                        ${fight.status === 'live' ? '<span class="badge badge-live"><span class="pulse pulse-live"></span> LIVE</span>' : ''}
                    </div>

                    <div class="fight-details">
                        <div class="detail-item">
                            <div class="detail-label">Title</div>
                            <div class="detail-value">${fight.title}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Rounds</div>
                            <div class="detail-value">${fight.rounds}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Venue</div>
                            <div class="detail-value">${fight.venue}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Date</div>
                            <div class="detail-value">${new Date(fight.date).toLocaleDateString()}</div>
                        </div>
                    </div>

                    <div class="fighters">
                        <div class="fighter">
                            <div class="fighter-name">${fight.fighter1.name}</div>
                            <div class="fighter-record">${fight.fighter1.record}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="fighter">
                            <div class="fighter-name">${fight.fighter2.name}</div>
                            <div class="fighter-record">${fight.fighter2.record}</div>
                        </div>
                    </div>

                    <div class="odds-grid">
                        <div class="odds-option" onclick="selectFighter('${fight.id}', 'fighter1', ${fight.odds.fighter1})">
                            <div class="odds-label">${fight.fighter1.name}</div>
                            <div class="odds-value">${fight.odds.fighter1 > 0 ? '+' : ''}${fight.odds.fighter1}</div>
                        </div>
                        <div class="odds-option" onclick="selectFighter('${fight.id}', 'fighter2', ${fight.odds.fighter2})">
                            <div class="odds-label">${fight.fighter2.name}</div>
                            <div class="odds-value">${fight.odds.fighter2 > 0 ? '+' : ''}${fight.odds.fighter2}</div>
                        </div>
                    </div>

                    <div class="bet-input-section" id="bet-${fight.id}">
                        <div class="form-group">
                            <label>Bet Amount:</label>
                            <input type="number" id="amount-${fight.id}" placeholder="Enter amount" min="1" step="1" class="form-control">
                        </div>
                        <button class="btn btn-success" style="width: 100%; margin-top: 12px;" onclick="placeBet('${fight.id}')">
                            Place Bet
                        </button>
                        <div id="payout-${fight.id}" style="margin-top: 12px; text-align: center; color: var(--secondary-color); font-weight: 700;"></div>
                    </div>
                </div>
            `).join('');
        }

        function filterFights(category) {
            currentFilter = category;
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderFights();
        }

        function selectFighter(fightId, fighter, odds) {
            selectedFights.set(fightId, { fighter, odds });
            
            const card = event.target.closest('.fight-card');
            card.querySelectorAll('.odds-option').forEach(opt => opt.classList.remove('selected'));
            event.target.closest('.odds-option').classList.add('selected');
            
            document.getElementById(`bet-${fightId}`).classList.add('active');
            
            const amountInput = document.getElementById(`amount-${fightId}`);
            amountInput.addEventListener('input', () => updatePayout(fightId, odds));
        }

        function updatePayout(fightId, odds) {
            const amount = parseFloat(document.getElementById(`amount-${fightId}`).value) || 0;
            const payout = calculatePayout(amount, odds);
            document.getElementById(`payout-${fightId}`).textContent = 
                amount > 0 ? `Potential Payout: $${payout.toFixed(2)}` : '';
        }

        function calculatePayout(amount, odds) {
            if (odds > 0) {
                return amount + (amount * (odds / 100));
            } else {
                return amount + (amount / (Math.abs(odds) / 100));
            }
        }

        async function placeBet(fightId) {
            const selection = selectedFights.get(fightId);
            if (!selection) {
                alert('Please select a fighter first');
                return;
            }

            const amount = parseFloat(document.getElementById(`amount-${fightId}`).value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            const fight = fights.find(f => f.id === fightId);
            const fighterName = selection.fighter === 'fighter1' ? fight.fighter1.name : fight.fighter2.name;
            const potentialPayout = calculatePayout(amount, selection.odds);

            const bet = {
                id: `bet-${Date.now()}`,
                fightId,
                fightType: fight.type,
                fightTitle: fight.title,
                fighter: fighterName,
                amount,
                odds: selection.odds,
                potentialPayout,
                status: 'pending',
                placedAt: new Date().toISOString()
            };

            myBets.push(bet);
            localStorage.setItem('fightBets', JSON.stringify(myBets));

            alert(`✅ Bet placed!\n\nFighter: ${fighterName}\nAmount: $${amount}\nPotential Payout: $${potentialPayout.toFixed(2)}`);

            document.getElementById(`amount-${fightId}`).value = '';
            document.getElementById(`bet-${fightId}`).classList.remove('active');
            selectedFights.delete(fightId);

            renderMyBets();
        }

        function renderMyBets() {
            const betsList = document.getElementById('betsList');
            
            if (myBets.length === 0) {
                betsList.innerHTML = '<p style="color: var(--text-secondary);">No bets placed yet</p>';
                return;
            }

            betsList.innerHTML = myBets.map(bet => `
                <div style="background: var(--bg-card); border: 2px solid var(--border-primary); border-radius: var(--radius-md); padding: var(--spacing-lg); margin-bottom: var(--spacing-md);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span style="font-weight: 700; font-size: 18px;">${bet.fightTitle}</span>
                        <span class="badge badge-${bet.fightType === 'boxing' ? 'danger' : 'warning'}">${bet.fightType.toUpperCase()}</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 14px;">
                        <div><strong>Fighter:</strong> ${bet.fighter}</div>
                        <div><strong>Amount:</strong> $${bet.amount.toFixed(2)}</div>
                        <div><strong>Odds:</strong> ${bet.odds > 0 ? '+' : ''}${bet.odds}</div>
                        <div><strong>Potential:</strong> $${bet.potentialPayout.toFixed(2)}</div>
                    </div>
                    <div style="margin-top: 12px; font-size: 12px; color: var(--text-muted);">
                        Placed: ${new Date(bet.placedAt).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }

        window.addEventListener('load', () => {
            fights = fightData;
            renderFights();

            const savedBets = localStorage.getItem('fightBets');
            if (savedBets) {
                myBets = JSON.parse(savedBets);
                renderMyBets();
            }

            const liveCount = fights.filter(f => f.status === 'live').length;
            document.getElementById('liveCount').textContent = liveCount;
        });
    </script>
</body>
</html>
