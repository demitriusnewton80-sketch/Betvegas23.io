
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Status - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1 {
            color: white;
            margin-bottom: 10px;
        }
        .status-badge {
            background: #22c55e;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-badge.warning {
            background: #f59e0b;
        }
        .status-badge.error {
            background: #ef4444;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 {
            color: #58a6ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .connection-item {
            background: #21262d;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #22c55e;
        }
        .connection-item.error {
            border-left-color: #ef4444;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        .status-indicator.error {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        .error-state {
            background: #3d1a1a;
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .retry-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .retry-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔌 Core Connection Status</h1>
        <p>Young Meeat LLC - Real-time System Monitor</p>
        <span class="status-badge" id="overallStatus">Loading...</span>
    </div>

    <div class="grid">
        <div class="card">
            <h3>
                <span class="status-indicator"></span>
                System Overview
            </h3>
            <div id="systemOverview">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📡 Active Connections</h3>
        <div id="connectionsList">
            <p>Loading connections...</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        let retryCount = 0;
        const maxRetries = 3;

        async function loadCoreStatus() {
            try {
                const response = await fetch(`${API_BASE}/core/status`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                retryCount = 0; // Reset on success
                
                // Update overall status
                const statusBadge = document.getElementById('overallStatus');
                if (data.active === data.total) {
                    statusBadge.textContent = 'All Systems Connected';
                    statusBadge.className = 'status-badge';
                } else {
                    statusBadge.textContent = `${data.active}/${data.total} Connected`;
                    statusBadge.className = 'status-badge warning';
                }
                
                // Update system overview
                document.getElementById('systemOverview').innerHTML = `
                    <div class="info-row">
                        <span>Total Connections:</span>
                        <strong>${data.total}</strong>
                    </div>
                    <div class="info-row">
                        <span>Active Connections:</span>
                        <strong>${data.active}</strong>
                    </div>
                    <div class="info-row">
                        <span>FCC Entity:</span>
                        <strong>${data.config.fccEntity}</strong>
                    </div>
                    <div class="info-row">
                        <span>Environment:</span>
                        <strong>${data.config.environment}</strong>
                    </div>
                `;
                
                // Update connections list
                const connectionsHtml = data.connections.map(conn => `
                    <div class="connection-item ${conn.status === 'error' ? 'error' : ''}">
                        <div class="info-row">
                            <strong>${conn.id}</strong>
                            <span style="color: ${conn.status === 'connected' ? '#22c55e' : '#ef4444'}">
                                ${conn.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="info-row">
                            <span>Type:</span>
                            <span>${conn.type}</span>
                        </div>
                        ${conn.metadata.endpoint ? `
                        <div class="info-row">
                            <span>Endpoint:</span>
                            <span>${conn.metadata.endpoint}</span>
                        </div>
                        ` : ''}
                    </div>
                `).join('');
                
                document.getElementById('connectionsList').innerHTML = connectionsHtml;
                
            } catch (error) {
                console.error('Error loading core status:', error);
                retryCount++;
                
                const statusBadge = document.getElementById('overallStatus');
                statusBadge.textContent = retryCount < maxRetries ? 'Retrying...' : 'Connection Error';
                statusBadge.className = 'status-badge error';
                
                document.getElementById('connectionsList').innerHTML = `
                    <div class="error-state">
                        <p style="color: #ef4444; margin-bottom: 10px;">⚠️ Connection Failed</p>
                        <p style="color: #8b949e; font-size: 14px;">${error.message}</p>
                        <button class="retry-btn" onclick="loadCoreStatus()">Retry Now</button>
                    </div>
                `;
                
                if (retryCount < maxRetries) {
                    setTimeout(loadCoreStatus, 2000);
                }
            }
        }

        // Load initial status with loading indicator
        document.getElementById('connectionsList').innerHTML = '<div class="loading-state">🔄 Loading system status...</div>';
        loadCoreStatus();
        
        // Auto-refresh every 5 seconds
        setInterval(loadCoreStatus, 5000);
    </script>
</body>
</html>
