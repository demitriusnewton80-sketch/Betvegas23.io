
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Status - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1 {
            color: white;
            margin-bottom: 10px;
        }
        .status-badge {
            background: #22c55e;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-badge.warning {
            background: #f59e0b;
        }
        .status-badge.error {
            background: #ef4444;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 {
            color: #58a6ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .connection-item {
            background: #21262d;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #22c55e;
        }
        .connection-item.error {
            border-left-color: #ef4444;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔌 Core Connection Status</h1>
        <p>Young Meeat LLC - Real-time System Monitor</p>
        <span class="status-badge" id="overallStatus">Loading...</span>
    </div>

    <div class="grid">
        <div class="card">
            <h3>
                <span class="status-indicator"></span>
                System Overview
            </h3>
            <div id="systemOverview">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📡 Active Connections</h3>
        <div id="connectionsList">
            <p>Loading connections...</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadCoreStatus() {
            try {
                const response = await fetch(`${API_BASE}/core/status`);
                const data = await response.json();
                
                // Update overall status
                const statusBadge = document.getElementById('overallStatus');
                if (data.active === data.total) {
                    statusBadge.textContent = 'All Systems Connected';
                    statusBadge.className = 'status-badge';
                } else {
                    statusBadge.textContent = `${data.active}/${data.total} Connected`;
                    statusBadge.className = 'status-badge warning';
                }
                
                // Update system overview
                document.getElementById('systemOverview').innerHTML = `
                    <div class="info-row">
                        <span>Total Connections:</span>
                        <strong>${data.total}</strong>
                    </div>
                    <div class="info-row">
                        <span>Active Connections:</span>
                        <strong>${data.active}</strong>
                    </div>
                    <div class="info-row">
                        <span>FCC Entity:</span>
                        <strong>${data.config.fccEntity}</strong>
                    </div>
                    <div class="info-row">
                        <span>Environment:</span>
                        <strong>${data.config.environment}</strong>
                    </div>
                `;
                
                // Update connections list
                const connectionsHtml = data.connections.map(conn => `
                    <div class="connection-item ${conn.status === 'error' ? 'error' : ''}">
                        <div class="info-row">
                            <strong>${conn.id}</strong>
                            <span style="color: ${conn.status === 'connected' ? '#22c55e' : '#ef4444'}">
                                ${conn.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="info-row">
                            <span>Type:</span>
                            <span>${conn.type}</span>
                        </div>
                        ${conn.metadata.endpoint ? `
                        <div class="info-row">
                            <span>Endpoint:</span>
                            <span>${conn.metadata.endpoint}</span>
                        </div>
                        ` : ''}
                    </div>
                `).join('');
                
                document.getElementById('connectionsList').innerHTML = connectionsHtml;
                
            } catch (error) {
                console.error('Error loading core status:', error);
                document.getElementById('overallStatus').textContent = 'Error Loading Status';
                document.getElementById('overallStatus').className = 'status-badge error';
            }
        }

        // Load initial status
        loadCoreStatus();
        
        // Auto-refresh every 5 seconds
        setInterval(loadCoreStatus, 5000);
    </script>
</body>
</html>
