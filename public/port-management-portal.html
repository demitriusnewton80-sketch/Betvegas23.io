
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Management Portal | Young Meeat LLC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0078d4 0%, #005a9e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1 { font-size: 36px; margin-bottom: 10px; }
        .microsoft-badge {
            background: rgba(0, 120, 212, 0.3);
            border: 2px solid #0078d4;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
            font-size: 13px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .stat-value {
            font-size: 42px;
            font-weight: 700;
            color: #00ff00;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 8px;
        }
        .port-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .port-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .port-card.active { border-color: #00ff00; }
        .port-card.bypassed { border-color: #ffa500; }
        .port-card.error { border-color: #ff0000; }
        .port-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .port-number {
            font-size: 28px;
            font-weight: 700;
        }
        .port-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-active { background: #00ff00; color: #000; }
        .status-bypassed { background: #ffa500; color: #000; }
        .status-error { background: #ff0000; color: #fff; }
        .status-inactive { background: #666; color: #fff; }
        .bypass-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .bypass-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #ffa500;
        }
        .btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
        }
        .btn:hover { background: #005a9e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 Port Management Portal</h1>
            <p>Microsoft-Style Port & Structure Management System</p>
            <div class="microsoft-badge">FCC Entity: 20130314143016</div>
            <div class="microsoft-badge">Auto-Bypass Enabled</div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn" onclick="loadPortLandscape()">🔄 Refresh Landscape</button>
            <button class="btn" onclick="loadStructures()">📊 View Structures</button>
        </div>

        <div class="bypass-section">
            <h2 style="margin-bottom: 15px;">🔀 Active Bypass Routes</h2>
            <div id="bypassList"></div>
        </div>

        <h2 style="margin-bottom: 15px;">📍 Port Landscape</h2>
        <div class="port-grid" id="portGrid"></div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        const API_BASE = window.location.origin;

        async function loadPortLandscape() {
            try {
                const response = await fetch(`${API_BASE}/port-management/landscape`);
                const data = await response.json();

                displayStats(data);
                displayPorts(data.ports);
                displayBypasses(data.bypasses);
            } catch (error) {
                console.error('Error loading port landscape:', error);
            }
        }

        function displayStats(data) {
            const stats = [
                { label: 'Total Ports', value: data.totalPorts },
                { label: 'Active Ports', value: data.activePorts },
                { label: 'Bypassed Ports', value: data.bypassedPorts },
                { label: 'Error Ports', value: data.errorPorts },
                { label: 'Bypass Routes', value: data.activeBypassRoutes }
            ];

            document.getElementById('statsGrid').innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }

        function displayPorts(ports) {
            document.getElementById('portGrid').innerHTML = ports.map(port => `
                <div class="port-card ${port.status}">
                    <div class="port-header">
                        <div class="port-number">:${port.port}</div>
                        <div class="port-status status-${port.status}">
                            ${port.status.toUpperCase()}
                        </div>
                    </div>
                    <div style="font-size: 14px; opacity: 0.9;">
                        ${port.boundStructure ? `📦 ${port.boundStructure}` : '⚪ Unbound'}
                    </div>
                    <div style="font-size: 12px; opacity: 0.8; margin-top: 8px;">
                        Response Time: ${port.responseTime}ms<br>
                        Errors: ${port.errorCount}
                    </div>
                </div>
            `).join('');
        }

        function displayBypasses(bypasses) {
            const bypassList = document.getElementById('bypassList');
            
            if (bypasses.length === 0) {
                bypassList.innerHTML = '<p style="opacity: 0.7;">No active bypass routes</p>';
                return;
            }

            bypassList.innerHTML = bypasses.map(bypass => `
                <div class="bypass-item">
                    <div style="font-size: 16px; font-weight: 700; margin-bottom: 5px;">
                        ${bypass.route}
                    </div>
                    <div style="font-size: 13px; opacity: 0.9;">
                        ${bypass.reason}
                    </div>
                    <div style="font-size: 11px; opacity: 0.7; margin-top: 5px;">
                        Active for ${bypass.age}s
                    </div>
                </div>
            `).join('');
        }

        async function loadStructures() {
            window.location.href = '/functional-structures-dashboard.html';
        }

        // Auto-refresh every 15 seconds
        window.addEventListener('load', () => {
            loadPortLandscape();
            setInterval(loadPortLandscape, 15000);
        });
    </script>
</body>
</html>
