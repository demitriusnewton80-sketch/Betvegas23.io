
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Mapping Dashboard | FCC 20130314143016</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
        }
        .header h1 { font-size: 48px; margin-bottom: 10px; }
        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 20px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        }
        .section {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #6366f1;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .mapping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .mapping-card {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .mapping-card:hover {
            border-color: #6366f1;
            transform: translateY(-5px);
        }
        .mapping-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .mapping-type {
            background: #6366f1;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .status-syncing {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        .health-bar {
            background: rgba(0, 0, 0, 0.3);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #6366f1);
            transition: width 0.5s;
        }
        .condition-list {
            display: grid;
            gap: 10px;
        }
        .condition-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid transparent;
        }
        .condition-item.optimal {
            border-left-color: #22c55e;
        }
        .condition-item.acceptable {
            border-left-color: #3b82f6;
        }
        .condition-item.degraded {
            border-left-color: #f59e0b;
        }
        .landscape-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Production Mapping Dashboard</h1>
            <p style="opacity: 0.9; margin-top: 10px;">
                Unified Functional Landscape & Environment Conditions
            </p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <button class="btn-primary" onclick="fuseAllProductions()">
            🔗 Fuse All Productions to Entity
        </button>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="section">
            <h2>📊 Production Mappings</h2>
            <div class="mapping-grid" id="mappingsGrid"></div>
        </div>

        <div class="section">
            <h2>🌍 Functional Landscapes</h2>
            <div class="landscape-grid" id="landscapesGrid"></div>
        </div>

        <div class="section">
            <h2>⚙️ Environment Conditions</h2>
            <div class="condition-list" id="conditionsGrid"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/production-mapping/status`);
                const data = await response.json();

                if (data.success) {
                    displayStats(data);
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadMappings() {
            try {
                const response = await fetch(`${API_BASE}/production-mapping/mappings`);
                const data = await response.json();

                if (data.success) {
                    displayMappings(data.mappings);
                }
            } catch (error) {
                console.error('Error loading mappings:', error);
            }
        }

        async function loadLandscapes() {
            try {
                const response = await fetch(`${API_BASE}/production-mapping/landscapes`);
                const data = await response.json();

                if (data.success) {
                    displayLandscapes(data.landscapes);
                }
            } catch (error) {
                console.error('Error loading landscapes:', error);
            }
        }

        async function loadConditions() {
            try {
                const response = await fetch(`${API_BASE}/production-mapping/conditions`);
                const data = await response.json();

                if (data.success) {
                    displayConditions(data.conditions);
                }
            } catch (error) {
                console.error('Error loading conditions:', error);
            }
        }

        function displayStats(data) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.mappings.total}</div>
                    <div class="stat-label">Total Mappings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.mappings.active}</div>
                    <div class="stat-label">Active Mappings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.landscapes.total}</div>
                    <div class="stat-label">Functional Landscapes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.environmentConditions.optimal}</div>
                    <div class="stat-label">Optimal Conditions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.mappings.deploymentReady}</div>
                    <div class="stat-label">Deployment Ready</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.fusionActive ? '✅' : '❌'}</div>
                    <div class="stat-label">Fusion Active</div>
                </div>
            `;
        }

        function displayMappings(mappings) {
            const grid = document.getElementById('mappingsGrid');
            grid.innerHTML = mappings.map(mapping => `
                <div class="mapping-card">
                    <div class="mapping-header">
                        <span class="mapping-type">${mapping.type.toUpperCase()}</span>
                        <span class="status-badge status-${mapping.status}">${mapping.status.toUpperCase()}</span>
                    </div>
                    <h3 style="margin-bottom: 10px;">${mapping.name}</h3>
                    <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                        Endpoints: ${mapping.endpoints.length} | Ports: ${mapping.ports.length} | Services: ${mapping.services.length}
                    </div>
                    <div class="health-bar">
                        <div class="health-fill" style="width: ${mapping.health}%"></div>
                    </div>
                    <div style="text-align: center; margin-top: 10px; font-size: 14px;">
                        Health: ${mapping.health}% | ${mapping.deploymentReady ? '✅ Ready' : '⏳ Pending'}
                    </div>
                </div>
            `).join('');
        }

        function displayLandscapes(landscapes) {
            const grid = document.getElementById('landscapesGrid');
            grid.innerHTML = landscapes.map(landscape => `
                <div class="mapping-card">
                    <h3 style="margin-bottom: 10px;">${landscape.name}</h3>
                    <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                        Environment: ${landscape.environment.toUpperCase()}
                    </div>
                    <div style="font-size: 14px; margin: 10px 0;">
                        Mappings: ${landscape.mappings.length}<br>
                        Active Services: ${landscape.activeServices}<br>
                        Capacity: ${landscape.totalCapacity.toLocaleString()}<br>
                        Sync: ${landscape.syncStatus.toUpperCase()}
                    </div>
                    <div class="health-bar">
                        <div class="health-fill" style="width: ${landscape.healthScore}%"></div>
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        Health Score: ${landscape.healthScore}%
                    </div>
                </div>
            `).join('');
        }

        function displayConditions(conditions) {
            const grid = document.getElementById('conditionsGrid');
            grid.innerHTML = conditions.map(condition => `
                <div class="condition-item ${condition.status}">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${condition.parameter}</strong><br>
                            <span style="font-size: 12px; opacity: 0.7;">
                                Impact: ${condition.impact.toUpperCase()} | 
                                Auto-Correct: ${condition.autoCorrect ? '✅' : '❌'}
                            </span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 18px; font-weight: 700;">
                                ${typeof condition.value === 'boolean' ? (condition.value ? '✅' : '❌') : condition.value}
                            </div>
                            <div style="font-size: 12px; text-transform: uppercase;">
                                ${condition.status}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function fuseAllProductions() {
            try {
                const response = await fetch(`${API_BASE}/production-mapping/fuse`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    alert(`✅ Fusion Complete!\n\nTotal Mappings: ${data.totalMappings}\nActive: ${data.activeMappings}\nLandscapes: ${data.landscapes}\nHealth: ${data.healthScore}%\nDeployment Ready: ${data.deploymentReady ? 'Yes' : 'No'}`);
                    loadAll();
                } else {
                    alert('❌ Fusion failed: ' + data.error);
                }
            } catch (error) {
                alert('❌ Fusion failed: ' + error.message);
            }
        }

        function loadAll() {
            loadStatus();
            loadMappings();
            loadLandscapes();
            loadConditions();
        }

        // Load on page load
        loadAll();

        // Auto-refresh every 5 seconds
        setInterval(loadAll, 5000);
    </script>
</body>
</html>
