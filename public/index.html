
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsBet Pro - Live Sports Betting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
        }
        
        .top-bar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0;
        }
        
        .top-bar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5em;
            font-weight: 700;
            color: #58a6ff;
        }
        
        .logo-icon {
            font-size: 1.3em;
        }
        
        .auth-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8b949e;
            font-size: 0.9em;
        }
        
        .user-email {
            color: #58a6ff;
        }
        
        .auth-btn {
            padding: 8px 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .auth-btn:hover {
            background: #2ea043;
        }
        
        .auth-btn.logout {
            background: #da3633;
        }
        
        .auth-btn.logout:hover {
            background: #f85149;
        }
        
        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        
        .nav-menu a {
            color: #8b949e;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #58a6ff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .wallet-section {
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(31, 111, 235, 0.2);
        }
        
        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .balance-display {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .balance-label {
            font-size: 0.9em;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .balance-amount {
            font-size: 2.5em;
            font-weight: 700;
            color: #fff;
        }
        
        .wallet-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .wallet-actions input {
            padding: 12px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            width: 140px;
            backdrop-filter: blur(10px);
        }
        
        .wallet-actions input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #2ea043;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #30363d;
        }
        
        .section-header h2 {
            font-size: 1.5em;
            font-weight: 600;
        }
        
        .live-badge {
            background: #da3633;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            animation: pulse 2s infinite;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .streams-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stream-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        
        .stream-card:hover {
            border-color: #58a6ff;
        }
        
        .stream-header {
            background: #0d1117;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        
        .stream-title {
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .stream-video {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
        }
        
        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .video-icon {
            font-size: 4em;
            opacity: 0.3;
            margin-bottom: 15px;
        }
        
        .stream-stats {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            min-width: 200px;
            backdrop-filter: blur(10px);
        }
        
        .stream-time {
            font-size: 0.85em;
            color: #8b949e;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .stream-score {
            font-size: 2.5em;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            color: #58a6ff;
        }
        
        .stream-teams {
            font-size: 0.9em;
            color: #8b949e;
            text-align: center;
        }
        
        .play-by-play {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(13, 17, 23, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            backdrop-filter: blur(10px);
        }
        
        .play-label {
            font-size: 0.8em;
            color: #8b949e;
            margin-bottom: 4px;
        }
        
        .play-text {
            font-size: 0.95em;
            color: #e6edf3;
        }
        
        .sport-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .sport-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        
        .sport-section-header:hover {
            background: rgba(88, 166, 255, 0.05);
        }
        
        .sport-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sport-icon {
            font-size: 1.5em;
        }
        
        .sport-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #e6edf3;
        }
        
        .game-count {
            background: #21262d;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            color: #8b949e;
            border: 1px solid #30363d;
        }
        
        .collapse-icon {
            font-size: 1.2em;
            color: #8b949e;
            transition: transform 0.3s;
        }
        
        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }
        
        .sport-section-content {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .sport-section-content.collapsed {
            max-height: 0;
        }
        
        .date-group {
            border-top: 1px solid #30363d;
            padding: 20px;
        }
        
        .date-header {
            font-size: 1em;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .date-icon {
            font-size: 0.9em;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .game-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }
        
        .game-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .sport-tag {
            background: #21262d;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #58a6ff;
            border: 1px solid #30363d;
        }
        
        .teams {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e6edf3;
        }
        
        .score-display {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        
        .score-main {
            font-size: 2em;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 5px;
        }
        
        .score-info {
            font-size: 0.85em;
            color: #8b949e;
        }
        
        .odds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        
        .odd-button {
            background: #21262d;
            border: 2px solid #30363d;
            padding: 15px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .odd-button:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }
        
        .odd-button.selected {
            border-color: #238636;
            background: rgba(35, 134, 54, 0.1);
        }
        
        .odd-team {
            font-size: 0.85em;
            color: #8b949e;
            font-weight: 500;
        }
        
        .odd-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #58a6ff;
        }
        
        .bet-input-section {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .bet-input-section input {
            flex: 1;
            padding: 12px 16px;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 1em;
        }
        
        .bet-input-section input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        .bets-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
        }
        
        .bet-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .bet-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .bet-game {
            font-size: 1.1em;
            font-weight: 600;
            color: #e6edf3;
        }
        
        .bet-info {
            font-size: 0.9em;
            color: #8b949e;
        }
        
        .bet-amount {
            color: #58a6ff;
            font-weight: 600;
        }
        
        .bet-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }
        
        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-badge.pending {
            background: rgba(187, 128, 9, 0.15);
            color: #f0b72f;
            border: 1px solid rgba(187, 128, 9, 0.3);
        }
        
        .status-badge.won {
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            border: 1px solid rgba(35, 134, 54, 0.3);
        }
        
        .status-badge.lost {
            background: rgba(218, 54, 51, 0.15);
            color: #f85149;
            border: 1px solid rgba(218, 54, 51, 0.3);
        }
        
        .status-badge.cashed_out {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }
        
        .cashout-btn {
            background: #f0b72f;
            color: #0d1117;
            padding: 10px 20px;
            font-size: 0.9em;
        }
        
        .cashout-btn:hover {
            background: #d89e28;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8b949e;
            font-size: 0.95em;
        }
        
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .wallet-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-menu {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span>SportsBet Pro</span>
            </div>
            <div style="display: flex; align-items: center; gap: 30px;">
                <ul class="nav-menu">
                    <li><a href="#" class="active">Live Betting</a></li>
                    <li><a href="#">My Bets</a></li>
                    <li><a href="#">Promotions</a></li>
                </ul>
                <div class="auth-section" id="authSection">
                    <button class="auth-btn" onclick="loginSSO()">SSO Login</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="wallet-section">
            <div class="wallet-grid">
                <div class="balance-display">
                    <div class="balance-label">Account Balance</div>
                    <div class="balance-amount" id="balance">$1,000.00</div>
                </div>
                <div class="wallet-actions">
                    <input type="number" id="depositAmount" placeholder="Amount" min="1">
                    <button onclick="deposit()">Deposit Funds</button>
                </div>
            </div>
        </div>
        
        <div class="section-header">
            <h2>Live Streams</h2>
            <div class="live-badge">
                <div class="live-dot"></div>
                <span>LIVE NOW</span>
            </div>
        </div>
        <div class="streams-grid" id="liveStreams"></div>
        
        <div class="section-header">
            <h2>Available Games</h2>
        </div>
        <div id="sportsSections"></div>
        
        <div class="bets-section">
            <div class="section-header" style="border: none; padding-bottom: 0;">
                <h2>My Active Bets</h2>
            </div>
            <div id="betsList"></div>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        const userId = 'demo-user';
        let games = [];
        let userBets = [];
        let selectedBets = new Map();
        
        // Check authentication status on load
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    updateAuthUI();
                }
            } catch (error) {
                console.log('Not authenticated');
            }
        }
        
        // Update authentication UI
        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            if (currentUser) {
                authSection.innerHTML = `
                    <div class="user-info">
                        <span>👤</span>
                        <span class="user-email">${currentUser.email}</span>
                    </div>
                    <button class="auth-btn logout" onclick="logoutSSO()">Logout</button>
                `;
            } else {
                authSection.innerHTML = `
                    <button class="auth-btn" onclick="loginSSO()">SSO Login</button>
                `;
            }
        }
        
        // SSO Login
        function loginSSO() {
            window.location.href = '/auth/login';
        }
        
        // SSO Logout
        async function logoutSSO() {
            await fetch('/auth/logout', { method: 'POST' });
            currentUser = null;
            updateAuthUI();
            alert('Logged out successfully');
        }
        
        async function loadGames() {
            const response = await fetch('/sportsbook/games');
            const data = await response.json();
            games = data.games;
            renderLiveStreams();
            renderGames();
        }
        
        async function loadWallet() {
            const response = await fetch(`/sportsbook/user/${userId}/wallet`);
            const data = await response.json();
            document.getElementById('balance').textContent = `$${data.balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }
        
        function getSportIcon(sport) {
            const icons = {
                'NFL': '🏈',
                'NBA': '🏀',
                'NHL': '🏒',
                'Soccer': '⚽',
                'MLB': '⚾',
                'Tennis': '🎾',
                'Boxing': '🥊',
                'MMA': '🥋'
            };
            return icons[sport] || '🎯';
        }
        
        function formatGameDate(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            today.setHours(0, 0, 0, 0);
            tomorrow.setHours(0, 0, 0, 0);
            const gameDate = new Date(date);
            gameDate.setHours(0, 0, 0, 0);
            
            if (gameDate.getTime() === today.getTime()) {
                return 'Today';
            } else if (gameDate.getTime() === tomorrow.getTime()) {
                return 'Tomorrow';
            } else {
                return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            }
        }
        
        function toggleSportSection(sport) {
            const content = document.getElementById(`sport-content-${sport}`);
            const icon = document.getElementById(`collapse-icon-${sport}`);
            
            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }
        
        async function loadBets() {
            const response = await fetch(`/sportsbook/user/${userId}/bets`);
            const data = await response.json();
            userBets = data.bets;
            renderBets();
        }
        
        function renderLiveStreams() {
            const liveGames = games.filter(g => g.status === 'live');
            const streamsContainer = document.getElementById('liveStreams');
            
            if (liveGames.length === 0) {
                streamsContainer.innerHTML = '<div class="empty-state">No live games at the moment. Check back soon!</div>';
                return;
            }
            
            streamsContainer.innerHTML = liveGames.map(game => `
                <div class="stream-card">
                    <div class="stream-header">
                        <div class="stream-title">${game.homeTeam} vs ${game.awayTeam}</div>
                        <div class="live-badge">
                            <div class="live-dot"></div>
                            <span>LIVE</span>
                        </div>
                    </div>
                    <div class="stream-video">
                        <div class="video-overlay">
                            <div class="video-icon">📺</div>
                            <div style="opacity: 0.5;">Live Game Broadcast</div>
                        </div>
                        <div class="stream-stats" id="stats-${game.id}">
                            <div class="stream-time">Loading...</div>
                            <div class="stream-score">-- : --</div>
                            <div class="stream-teams">${game.homeTeam} vs ${game.awayTeam}</div>
                        </div>
                        <div class="play-by-play">
                            <div class="play-label">Latest Play</div>
                            <div class="play-text" id="latest-play-${game.id}">Waiting for updates...</div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            liveGames.forEach(game => startLiveStreamStats(game.id));
        }
        
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map(game => {
                const hasDrawOdds = game.odds.draw !== undefined;
                return `
                    <div class="game-card">
                        <div class="game-header">
                            <div class="sport-tag">${game.sport}</div>
                            ${game.status === 'live' ? '<div class="live-badge"><div class="live-dot"></div><span>LIVE</span></div>' : ''}
                        </div>
                        <div class="teams">${game.homeTeam} vs ${game.awayTeam}</div>
                        ${game.status === 'live' ? `
                            <div class="score-display" id="score-${game.id}">
                                <div class="score-main">Loading...</div>
                                <div class="score-info">--</div>
                            </div>
                        ` : ''}
                        <div class="odds-grid">
                            <button class="odd-button" onclick="selectBet('${game.id}', 'home', ${game.odds.home})" id="odd-${game.id}-home">
                                <div class="odd-team">${game.homeTeam}</div>
                                <div class="odd-value">${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                            </button>
                            ${hasDrawOdds ? `
                                <button class="odd-button" onclick="selectBet('${game.id}', 'draw', ${game.odds.draw})" id="odd-${game.id}-draw">
                                    <div class="odd-team">Draw</div>
                                    <div class="odd-value">+${game.odds.draw}</div>
                                </button>
                            ` : ''}
                            <button class="odd-button" onclick="selectBet('${game.id}', 'away', ${game.odds.away})" id="odd-${game.id}-away">
                                <div class="odd-team">${game.awayTeam}</div>
                                <div class="odd-value">${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                            </button>
                        </div>
                        <div class="bet-input-section">
                            <input type="number" id="amount-${game.id}" placeholder="Enter bet amount" min="1">
                            <button onclick="placeBet('${game.id}')">Place Bet</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            games.filter(g => g.status === 'live').forEach(game => startLiveStream(game.id));
        }
        
        function startLiveStream(gameId) {
            const eventSource = new EventSource(`/streaming/stream/${gameId}`);
            
            eventSource.onerror = async (error) => {
                console.error(`Stream error for game ${gameId}`);
                
                // Report failure to activate stream sharing
                await fetch(`/streaming/stream/${gameId}/report-failure`, {
                    method: 'POST'
                });
                
                // Check sharing status
                const response = await fetch(`/streaming/stream/${gameId}/sharing`);
                const sharingStatus = await response.json();
                
                if (sharingStatus.isShared) {
                    const scoreDiv = document.getElementById(`score-${gameId}`);
                    if (scoreDiv) {
                        scoreDiv.innerHTML += `
                            <div style="font-size: 0.75em; color: #58a6ff; margin-top: 5px;">
                                📡 Stream shared with ${sharingStatus.sportsbooksCount} partners
                            </div>
                        `;
                    }
                }
            };
            
            eventSource.onmessage = (event) => {
                const update = JSON.parse(event.data);
                const scoreDiv = document.getElementById(`score-${gameId}`);
                if (scoreDiv) {
                    scoreDiv.innerHTML = `
                        <div class="score-main">${update.score.home} - ${update.score.away}</div>
                        <div class="score-info">${update.quarter || update.period} • ${update.timeRemaining}</div>
                    `;
                }
            };
        }
        
        function startLiveStreamStats(gameId) {
            const eventSource = new EventSource(`/streaming/stream/${gameId}`);
            const game = games.find(g => g.id === gameId);
            
            eventSource.onerror = async (error) => {
                console.error(`Stream error for game ${gameId}`);
                
                await fetch(`/streaming/stream/${gameId}/report-failure`, {
                    method: 'POST'
                });
                
                const response = await fetch(`/streaming/stream/${gameId}/sharing`);
                const sharingStatus = await response.json();
                
                if (sharingStatus.isShared) {
                    const statsDiv = document.getElementById(`stats-${gameId}`);
                    if (statsDiv) {
                        const sharingBadge = document.createElement('div');
                        sharingBadge.style.cssText = 'position: absolute; top: 10px; right: 10px; background: rgba(88, 166, 255, 0.2); color: #58a6ff; padding: 4px 12px; border-radius: 12px; font-size: 0.75em; border: 1px solid #58a6ff;';
                        sharingBadge.innerHTML = `📡 Shared with ${sharingStatus.sportsbooksCount} partners`;
                        statsDiv.parentElement.style.position = 'relative';
                        statsDiv.parentElement.appendChild(sharingBadge);
                    }
                }
            };
            
            eventSource.onmessage = (event) => {
                const update = JSON.parse(event.data);
                
                const statsDiv = document.getElementById(`stats-${gameId}`);
                if (statsDiv) {
                    statsDiv.innerHTML = `
                        <div class="stream-time">${update.quarter || update.period} • ${update.timeRemaining}</div>
                        <div class="stream-score">${update.score.home} - ${update.score.away}</div>
                        <div class="stream-teams">${game.homeTeam} vs ${game.awayTeam}</div>
                    `;
                }
                
                const playDiv = document.getElementById(`latest-play-${gameId}`);
                if (playDiv) {
                    playDiv.textContent = update.lastPlay;
                    playDiv.style.color = '#58a6ff';
                    setTimeout(() => { playDiv.style.color = '#e6edf3'; }, 500);
                }
            };
        }
        
        function selectBet(gameId, team, odds) {
            // Clear previous selections for this game
            ['home', 'away', 'draw'].forEach(t => {
                const btn = document.getElementById(`odd-${gameId}-${t}`);
                if (btn) btn.classList.remove('selected');
            });
            
            // Select the clicked button
            const selectedBtn = document.getElementById(`odd-${gameId}-${team}`);
            if (selectedBtn) selectedBtn.classList.add('selected');
            
            selectedBets.set(gameId, { team, odds });
        }
        
        async function placeBet(gameId) {
            const amount = parseFloat(document.getElementById(`amount-${gameId}`).value);
            const selection = selectedBets.get(gameId);
            
            if (!selection) {
                alert('Please select a team to bet on');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            
            const response = await fetch('/sportsbook/bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId,
                    gameId,
                    team: selection.team,
                    amount
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(`✓ Bet placed successfully!\nPotential win: $${data.bet.potentialWin.toFixed(2)}`);
                loadWallet();
                loadBets();
                document.getElementById(`amount-${gameId}`).value = '';
                selectedBets.delete(gameId);
                ['home', 'away', 'draw'].forEach(t => {
                    const btn = document.getElementById(`odd-${gameId}-${t}`);
                    if (btn) btn.classList.remove('selected');
                });
            } else {
                alert('Error: ' + data.error);
            }
        }
        
        async function deposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid deposit amount');
                return;
            }
            
            const response = await fetch(`/sportsbook/user/${userId}/deposit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(`✓ Deposit successful!\nNew balance: $${data.newBalance.toFixed(2)}`);
                loadWallet();
                document.getElementById('depositAmount').value = '';
            } else {
                alert('Error: ' + data.error);
            }
        }
        
        async function cashOut(betId) {
            if (!confirm('Are you sure you want to cash out this bet early?')) {
                return;
            }
            
            const response = await fetch(`/sportsbook/cashout/${betId}`, {
                method: 'POST'
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(`✓ Cash out successful!\nYou received: $${data.amount.toFixed(2)}`);
                loadWallet();
                loadBets();
            } else {
                alert('Error: ' + data.error);
            }
        }
        
        function renderGames() {
            const sportsSections = document.getElementById('sportsSections');
            
            // Group games by sport
            const gamesBySport = {};
            games.forEach(game => {
                if (!gamesBySport[game.sport]) {
                    gamesBySport[game.sport] = [];
                }
                gamesBySport[game.sport].push(game);
            });
            
            // Sort sports alphabetically
            const sortedSports = Object.keys(gamesBySport).sort();
            
            sportsSections.innerHTML = sortedSports.map(sport => {
                const sportGames = gamesBySport[sport];
                
                // Group games by date
                const gamesByDate = {};
                sportGames.forEach(game => {
                    const dateKey = formatGameDate(game.startTime);
                    if (!gamesByDate[dateKey]) {
                        gamesByDate[dateKey] = [];
                    }
                    gamesByDate[dateKey].push(game);
                });
                
                const dateGroupsHtml = Object.keys(gamesByDate).map(dateKey => {
                    const dateGames = gamesByDate[dateKey];
                    return `
                        <div class="date-group">
                            <div class="date-header">
                                <span class="date-icon">📅</span>
                                <span>${dateKey}</span>
                            </div>
                            <div class="games-grid">
                                ${dateGames.map(game => `
                                    <div class="game-card">
                                        <div class="game-header">
                                            <span class="sport-tag">${game.sport}</span>
                                            ${game.status === 'live' ? '<span class="live-badge"><div class="live-dot"></div>LIVE</span>' : ''}
                                        </div>
                                        <div class="teams">
                                            <div class="team">${game.awayTeam}</div>
                                            <div class="vs">@</div>
                                            <div class="team">${game.homeTeam}</div>
                                        </div>
                                        <div class="game-time">${new Date(game.startTime).toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'})}</div>
                                        <div class="odds-grid">
                                            <button class="odd-button" onclick="selectBet('${game.id}', 'away', ${game.odds.away})">
                                                <div class="odd-label">${game.awayTeam}</div>
                                                <div class="odd-value">${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                                            </button>
                                            ${game.odds.draw ? `
                                                <button class="odd-button" onclick="selectBet('${game.id}', 'draw', ${game.odds.draw})">
                                                    <div class="odd-label">Draw</div>
                                                    <div class="odd-value">+${game.odds.draw}</div>
                                                </button>
                                            ` : ''}
                                            <button class="odd-button" onclick="selectBet('${game.id}', 'home', ${game.odds.home})">
                                                <div class="odd-label">${game.homeTeam}</div>
                                                <div class="odd-value">${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                                            </button>
                                        </div>
                                        ${selectedBets.has(game.id) ? `
                                            <div class="bet-input-section">
                                                <input type="number" id="betAmount-${game.id}" placeholder="Bet amount" min="1">
                                                <button onclick="placeBet('${game.id}')">Place Bet</button>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
                
                return `
                    <div class="sport-section">
                        <div class="sport-section-header" onclick="toggleSportSection('${sport}')">
                            <div class="sport-section-title">
                                <span class="sport-icon">${getSportIcon(sport)}</span>
                                <span class="sport-name">${sport}</span>
                                <span class="game-count">${sportGames.length} ${sportGames.length === 1 ? 'game' : 'games'}</span>
                            </div>
                            <span class="collapse-icon" id="collapse-icon-${sport}">▼</span>
                        </div>
                        <div class="sport-section-content" id="sport-content-${sport}">
                            ${dateGroupsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderBets() {
            const betsList = document.getElementById('betsList');
            
            if (userBets.length === 0) {
                betsList.innerHTML = '<div class="empty-state">No active bets. Place your first bet to get started!</div>';
                return;
            }
            
            betsList.innerHTML = userBets.map(bet => {
                const game = games.find(g => g.id === bet.gameId);
                return `
                    <div class="bet-item">
                        <div class="bet-details">
                            <div class="bet-game">${game ? `${game.homeTeam} vs ${game.awayTeam}` : 'Game'}</div>
                            <div class="bet-info">
                                Bet on: <span class="bet-amount">${bet.team.toUpperCase()}</span> • 
                                Amount: <span class="bet-amount">$${bet.amount.toFixed(2)}</span>
                            </div>
                            <div class="bet-info">
                                Potential win: <span class="bet-amount">$${bet.potentialWin.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="bet-actions">
                            <span class="status-badge ${bet.status}">${bet.status.replace('_', ' ')}</span>
                            ${bet.status === 'pending' ? `<button class="cashout-btn" onclick="cashOut('${bet.id}')">Cash Out</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function initialize() {
            await checkAuth();
            await loadGames();
            await loadWallet();
            await loadBets();
            
            // Check if redirected from SSO
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('authenticated') === 'true') {
                window.history.replaceState({}, document.title, '/');
            }
        }
        
        initialize();
        setInterval(loadBets, 10000);
    </script>
</body>
</html>
