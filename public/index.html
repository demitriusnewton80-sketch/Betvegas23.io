<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>Betting Sites | Live Sports Betting - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --bg-secondary: rgba(30, 41, 59, 0.95);
            --bg-tertiary: rgba(51, 65, 85, 0.9);
            --border-color: rgba(59, 130, 246, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #22c55e;
            --fanduel-blue: #3b82f6;
            --fanduel-dark: #2563eb;
            --glow-color: rgba(59, 130, 246, 0.4);
        }

        body.light-mode {
            --bg-primary: linear-gradient(135deg, #e2f0ff 0%, #d1e8ff 100%);
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --bg-tertiary: rgba(240, 244, 248, 0.9);
            --border-color: rgba(25, 103, 210, 0.2);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent-color: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .header {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 12px;
            font-size: 12px;
            text-align: center;
            color: white;
            font-weight: 700;
        }

        .nav-container {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-toggle, .wallet-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .container {
            padding: 8px 8px 80px;
            min-height: 100vh;
            max-width: 800px;
            margin: 0 auto;
        }

        .sports-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0;
            margin-bottom: 16px;
        }

        .sport-chip {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sport-chip.active {
            background: var(--fanduel-blue);
            color: white;
        }

        .game-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .game-header {
            background: var(--bg-tertiary);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .teams-matchup {
            padding: 16px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            display: inline-block;
        }

        .betting-markets {
            padding: 0 16px 16px;
        }

        .money-line-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .bet-button {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 12px;
            cursor: pointer;
            text-align: center;
        }

        .bet-button:hover {
            border-color: var(--fanduel-blue);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--fanduel-blue);
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="top-bar">
            🏆 Young Meeat LLC - Professional Sports Betting Platform
        </div>
        <div class="nav-container">
            <div class="logo">
                <span>📊</span>
                <span>BETTING SITES</span>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="wallet-btn" onclick="openWalletModal()">
                    💰 <span id="headerBalance">$0.00</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sports-scroll">
            <div class="sport-chip active" onclick="filterBySport('all')">🏆 All</div>
            <div class="sport-chip" onclick="filterBySport('NFL')">🏈 NFL</div>
            <div class="sport-chip" onclick="filterBySport('NBA')">🏀 NBA</div>
            <div class="sport-chip" onclick="filterBySport('NHL')">🏒 NHL</div>
            <div class="sport-chip" onclick="filterBySport('Soccer')">⚽ Soccer</div>
        </div>

        <div id="sportsbookPage" class="page-view active">
            <div id="gamesContainer"></div>
        </div>

        <div id="myBetsPage" class="page-view">
            <div id="myBetsContainer">
                <p style="text-align: center; padding: 40px;">No bets placed yet</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('sportsbook')">
            <span>🏆</span>
            <span>Games</span>
        </div>
        <div class="nav-item" onclick="switchPage('myBets')">
            <span>📊</span>
            <span>My Bets</span>
        </div>
    </div>

    <div id="walletModal" class="modal">
        <div class="modal-content">
            <h2>Wallet</h2>
            <p>Balance: $<span id="modalBalance">0.00</span></p>
            <input type="number" id="depositAmount" placeholder="Amount">
            <button onclick="processDeposit()">Deposit</button>
            <button onclick="closeWalletModal()">Close</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = 'demo-user';
        let currentSport = 'all';

        function filterBySport(sport) {
            currentSport = sport;
            document.querySelectorAll('.sport-chip').forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');
            loadGames();
        }

        async function loadGames() {
            try {
                const url = currentSport === 'all' 
                    ? `${API_BASE}/sportsbook/games`
                    : `${API_BASE}/sportsbook/games?sport=${currentSport}`;

                const response = await fetch(url);
                const data = await response.json();

                displayGames(data.games);
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        function displayGames(games) {
            const container = document.getElementById('gamesContainer');

            if (!games || games.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px;">No games available</p>';
                return;
            }

            container.innerHTML = games.map(game => `
                <div class="game-card">
                    <div class="game-header">
                        <span>${game.sport}</span>
                        <span>${new Date(game.startTime).toLocaleString()}</span>
                    </div>
                    <div class="teams-matchup">
                        <div class="team-row">
                            <span>${game.awayTeam}</span>
                        </div>
                        <div class="team-row">
                            <span>${game.homeTeam}</span>
                        </div>
                    </div>
                    <div class="betting-markets">
                        <div class="money-line-grid">
                            <div class="bet-button">
                                <div>${game.awayTeam}</div>
                                <div>${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                            </div>
                            <div class="bet-button">
                                <div>${game.homeTeam}</div>
                                <div>${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function switchPage(page) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`${page}Page`).classList.add('active');
            event.target.closest('.nav-item').classList.add('active');

            if (page === 'myBets') loadUserBets();
        }

        async function loadUserBets() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${currentUser}/bets`);
                const data = await response.json();

                const container = document.getElementById('myBetsContainer');
                if (data.bets.length === 0) {
                    container.innerHTML = '<p style="text-align: center; padding: 40px;">No bets placed yet</p>';
                } else {
                    container.innerHTML = data.bets.map(bet => `
                        <div style="padding: 16px; background: var(--bg-secondary); margin-bottom: 8px; border-radius: 8px;">
                            <div>Game: ${bet.gameId}</div>
                            <div>Team: ${bet.team}</div>
                            <div>Amount: $${bet.amount.toFixed(2)}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading bets:', error);
            }
        }

        async function loadUserData() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${currentUser}/wallet`);
                const data = await response.json();

                document.getElementById('headerBalance').textContent = `$${data.balance.toFixed(2)}`;
                document.getElementById('modalBalance').textContent = `${data.balance.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.add('active');
        }

        function closeWalletModal() {
            document.getElementById('walletModal').classList.remove('active');
        }

        async function processDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);

            if (!amount || amount < 10) {
                alert('Minimum deposit is $10');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${currentUser}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Deposit successful!');
                    closeWalletModal();
                    loadUserData();
                } else {
                    alert(data.error || 'Deposit failed');
                }
            } catch (error) {
                alert('Error processing deposit');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeIcon');
            icon.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        window.addEventListener('load', () => {
            loadGames();
            loadUserData();
        });
    </script>
</body>
</html>
