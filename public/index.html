
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Public Sportsbook | Young Meeat LLC - Live Betting & Streaming</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
        }

        .top-banner {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .top-banner h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin: 5px;
            font-weight: 700;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin: 5px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-tab {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-tab:hover, .filter-tab.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .game-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }

        .game-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .sport-badge {
            background: #3b82f6;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
        }

        .game-time {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .team-name {
            font-weight: 700;
            font-size: 14px;
        }

        .vs {
            font-size: 16px;
            font-weight: 700;
            opacity: 0.6;
            padding: 0 10px;
        }

        .odds-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .odds-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.4);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .odds-btn:hover {
            background: rgba(59, 130, 246, 0.4);
        }

        .odds-btn.selected {
            background: #22c55e;
            border-color: #22c55e;
        }

        .odds-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .odds-value {
            font-size: 18px;
            font-weight: 700;
        }

        .bet-controls {
            margin-top: 12px;
            display: none;
        }

        .bet-controls.active {
            display: block;
        }

        .bet-input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .stream-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            margin-top: 8px;
        }

        .stream-btn:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .streams-section {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stream-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .stream-card:hover {
            border-color: #8b5cf6;
            transform: translateY(-3px);
        }

        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .league-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
        }

        .league-nfl { background: #ef4444; }
        .league-nba { background: #3b82f6; }
        .league-mlb { background: #22c55e; }
        .league-nhl { background: #a855f7; }

        .listeners {
            font-size: 12px;
            color: #22c55e;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="top-banner">
        <h1>🏆 Public Sportsbook</h1>
        <p style="font-size: 18px; margin: 10px 0;">Live Betting • Real-Time Streams • All Major Sports</p>
        <div>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
            <span class="live-indicator">
                <span class="pulse"></span>
                Live Now
            </span>
        </div>
    </div>

    <div class="container">
        <!-- Platform Statistics -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">Total Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="liveGames">0</div>
                <div class="stat-label">Live Now</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="liveStreams">0</div>
                <div class="stat-label">Live Streams</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalListeners">0</div>
                <div class="stat-label">Active Listeners</div>
            </div>
        </div>

        <!-- Live Radio Streams -->
        <div class="streams-section">
            <div class="section-header">
                <h2 class="section-title">📻 Live Radio Streams</h2>
            </div>
            <div class="streams-grid" id="streamsGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading streams...</p>
                </div>
            </div>
        </div>

        <!-- Live & Upcoming Games -->
        <div class="section-header">
            <h2 class="section-title">🎯 Live & Upcoming Games</h2>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterSport('all')">All Sports</button>
                <button class="filter-tab" onclick="filterSport('NFL')">🏈 NFL</button>
                <button class="filter-tab" onclick="filterSport('NBA')">🏀 NBA</button>
                <button class="filter-tab" onclick="filterSport('MLB')">⚾ MLB</button>
                <button class="filter-tab" onclick="filterSport('NHL')">🏒 NHL</button>
            </div>
        </div>

        <div class="games-grid" id="gamesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading games...</p>
            </div>
        </div>
    </div>

    <script>
        let allGames = [];
        let allStreams = [];
        let selectedBets = new Map();
        let currentSportFilter = 'all';
        let eventSource = null;

        // Load Games
        async function loadGames() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/games`);
                const data = await response.json();
                
                if (data.success && data.games) {
                    allGames = data.games;
                    displayGames();
                    updateGameStats();
                }
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesGrid').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: #ef4444; margin-bottom: 15px;">Failed to load games</p>
                        <button onclick="loadGames()" class="btn" style="max-width: 200px;">Retry</button>
                    </div>
                `;
            }
        }

        // Load Radio Streams
        async function loadStreams() {
            try {
                const response = await fetch(`${API_BASE}/sports-radio/streams`);
                const data = await response.json();
                
                if (data.success && data.streams) {
                    allStreams = data.streams;
                    displayStreams();
                    updateStreamStats();
                }
            } catch (error) {
                console.error('Error loading streams:', error);
            }
        }

        function displayStreams() {
            const grid = document.getElementById('streamsGrid');
            
            if (allStreams.length === 0) {
                grid.innerHTML = '<p style="text-align: center; opacity: 0.7;">No streams available</p>';
                return;
            }

            grid.innerHTML = allStreams.slice(0, 8).map(stream => `
                <div class="stream-card" onclick="openStream('${stream.streamUrl}')">
                    <div class="stream-header">
                        <span class="league-badge league-${stream.league.toLowerCase()}">${stream.league}</span>
                        <span class="listeners">👥 ${stream.listeners.toLocaleString()}</span>
                    </div>
                    <div style="font-weight: 700; margin: 10px 0; font-size: 14px;">
                        ${stream.awayTeam} @ ${stream.homeTeam}
                    </div>
                    <div style="font-size: 11px; opacity: 0.7;">
                        Quality: ${stream.quality.toUpperCase()} | ${stream.status === 'live' ? '🔴 LIVE' : 'Upcoming'}
                    </div>
                </div>
            `).join('');
        }

        function displayGames() {
            const grid = document.getElementById('gamesGrid');
            
            const filtered = currentSportFilter === 'all' 
                ? allGames 
                : allGames.filter(g => g.sport === currentSportFilter);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; opacity: 0.7;">No games available</p>';
                return;
            }

            grid.innerHTML = filtered.map((game, idx) => `
                <div class="game-card">
                    <span class="sport-badge">${game.sport}</span>
                    <div class="game-time">${new Date(game.startTime).toLocaleString()}</div>
                    
                    <div class="matchup">
                        <div class="team">
                            <div class="team-logo">
                                <img src="${API_BASE}/sports-radio/logo/${game.sport}/${encodeURIComponent(game.awayTeam)}" 
                                     alt="${game.awayTeam}" 
                                     style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px;"
                                     onerror="this.parentElement.innerHTML='🏆'">
                            </div>
                            <div class="team-name">${game.awayTeam}</div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <div class="team-logo">
                                <img src="${API_BASE}/sports-radio/logo/${game.sport}/${encodeURIComponent(game.homeTeam)}" 
                                     alt="${game.homeTeam}"
                                     style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px;"
                                     onerror="this.parentElement.innerHTML='🏆'">
                            </div>
                            <div class="team-name">${game.homeTeam}</div>
                        </div>
                    </div>

                    <div class="odds-container">
                        <div class="odds-btn" onclick="selectOdds('${idx}', 'away', ${game.odds.away})">
                            <div class="odds-label">Away</div>
                            <div class="odds-value">${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                        </div>
                        <div class="odds-btn" onclick="selectOdds('${idx}', 'home', ${game.odds.home})">
                            <div class="odds-label">Home</div>
                            <div class="odds-value">${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                        </div>
                    </div>

                    <div class="bet-controls" id="bet-${idx}">
                        <input type="number" class="bet-input" id="amount-${idx}" 
                               placeholder="Enter bet amount ($)" min="1">
                        <button class="btn" onclick="placeBet('${game.id}', '${idx}')">
                            💰 Place Bet
                        </button>
                    </div>

                    ${game.radioLink ? `
                        <button class="btn stream-btn" onclick="openStream('${game.radioLink}'); event.stopPropagation();">
                            📻 Listen Live
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function selectOdds(gameIdx, team, odds) {
            const card = event.target.closest('.game-card');
            card.querySelectorAll('.odds-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.odds-btn').classList.add('selected');
            
            selectedBets.set(gameIdx, { team, odds });
            document.getElementById(`bet-${gameIdx}`).classList.add('active');
        }

        async function placeBet(gameId, gameIdx) {
            const betInfo = selectedBets.get(gameIdx);
            if (!betInfo) {
                alert('Please select odds first');
                return;
            }

            const amount = parseFloat(document.getElementById(`amount-${gameIdx}`).value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sportsbook/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'public-user',
                        gameId,
                        team: betInfo.team,
                        amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Bet placed successfully!\nPotential win: $${data.bet.potentialWin}`);
                    document.getElementById(`amount-${gameIdx}`).value = '';
                    document.getElementById(`bet-${gameIdx}`).classList.remove('active');
                    selectedBets.delete(gameIdx);
                } else {
                    alert('❌ ' + (data.error || 'Failed to place bet'));
                }
            } catch (error) {
                console.error('Bet error:', error);
                alert('❌ Failed to place bet. Please try again.');
            }
        }

        function filterSport(sport) {
            currentSportFilter = sport;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            displayGames();
        }

        function openStream(url) {
            window.open(url, '_blank');
        }

        function updateGameStats() {
            document.getElementById('totalGames').textContent = allGames.length;
            document.getElementById('liveGames').textContent = 
                allGames.filter(g => g.status === 'live').length;
        }

        function updateStreamStats() {
            const liveStreams = allStreams.filter(s => s.status === 'live');
            document.getElementById('liveStreams').textContent = liveStreams.length;
            document.getElementById('totalListeners').textContent = 
                allStreams.reduce((sum, s) => sum + s.listeners, 0).toLocaleString();
        }

        function connectToLiveUpdates() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${API_BASE}/sports-radio/stream-updates`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'radioUpdate' || data.type === 'connected') {
                    loadStreams();
                }
            };

            eventSource.onerror = () => {
                console.error('EventSource error, reconnecting...');
                setTimeout(connectToLiveUpdates, 5000);
            };
        }

        // Initialize
        window.addEventListener('load', () => {
            loadGames();
            loadStreams();
            connectToLiveUpdates();
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadGames();
                loadStreams();
            }, 30000);
        });

        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
