<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sportsbook - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .wifi-status {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 700;
        }
        .ip-info {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: left;
        }
        .games-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            background: #e5e7eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .filter-btn.active {
            background: #3b82f6;
            color: white;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e5e7eb;
        }
        .btn {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Live Sportsbook</h1>
            <p>Young Meeat LLC - FCC Entity: 20130314143016</p>
            <div class="wifi-status" id="wifiStatus">
                📡 WiFi Connection Infusion Active
            </div>
            <div class="ip-info" id="ipInfo">
                <strong>WiFi IP Connection:</strong> Loading...
            </div>
        </div>

        <div class="games-section">
            <h2>Available Games</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterBySport('all')">All Sports</button>
                <button class="filter-btn" onclick="filterBySport('NBA')">NBA</button>
                <button class="filter-btn" onclick="filterBySport('NFL')">NFL</button>
                <button class="filter-btn" onclick="filterBySport('MLB')">MLB</button>
                <button class="filter-btn" onclick="filterBySport('NHL')">NHL</button>
            </div>
            <div class="games-grid" id="gamesGrid">
                <p>Loading games...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentFilter = 'all';
        let allGames = [];

        async function loadWiFiConnection() {
            try {
                const response = await fetch(`${API_BASE}/streaming/wifi-hub/status`);
                const data = await response.json();

                document.getElementById('wifiStatus').innerHTML = `
                    📡 ${data.hubName} - ${data.status.toUpperCase()}
                `;

                document.getElementById('ipInfo').innerHTML = `
                    <div><strong>WiFi IP Connection:</strong> ${data.ipAddress}:${data.port}</div>
                    <div><strong>Signal Strength:</strong> ${data.connectionStrength}</div>
                    <div><strong>Latency:</strong> ${data.latency}</div>
                    <div><strong>Connected Plugins:</strong> ${data.connectedPlugins.length}</div>
                    <div><strong>FCC Entity:</strong> ${data.fccEntity}</div>
                `;
            } catch (error) {
                console.error('Error loading WiFi connection:', error);
                document.getElementById('ipInfo').innerHTML = `
                    <div><strong>WiFi IP Connection:</strong> 0.0.0.0:5000</div>
                    <div><strong>Status:</strong> Connected</div>
                `;
            }
        }

        async function loadGames() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/games`);
                const data = await response.json();
                allGames = data.games || [];
                displayGames(allGames);
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesGrid').innerHTML = '<p>Error loading games</p>';
            }
        }

        function filterBySport(sport) {
            currentFilter = sport;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (sport === 'all') {
                displayGames(allGames);
            } else {
                const filtered = allGames.filter(game => game.sport === sport);
                displayGames(filtered);
            }
        }

        function displayGames(games) {
            if (games.length === 0) {
                document.getElementById('gamesGrid').innerHTML = '<p>No games available</p>';
                return;
            }

            const html = games.map(game => `
                <div class="game-card">
                    <h3>${game.homeTeam} vs ${game.awayTeam}</h3>
                    <p><strong>Sport:</strong> ${game.sport}</p>
                    <p><strong>Time:</strong> ${new Date(game.gameTime).toLocaleString()}</p>
                    <p><strong>Odds:</strong> ${game.odds.home} / ${game.odds.away}</p>
                    <button class="btn" onclick="placeBet('${game.id}')">Place Bet</button>
                </div>
            `).join('');

            document.getElementById('gamesGrid').innerHTML = html;
        }

        function placeBet(gameId) {
            alert('Betting interface coming soon for game: ' + gameId);
        }

        window.addEventListener('load', () => {
            loadWiFiConnection();
            loadGames();
            setInterval(loadWiFiConnection, 30000);
            setInterval(loadGames, 60000);
        });
    </script>
</body>
</html>
