
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>Betting Sites | Live Sports Betting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #ffffff;
            --text-secondary: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #53c451;
        }

        body.light-mode {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #57606a;
            --text-muted: #656d76;
            --accent-color: #2e7d32;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Mobile Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body.light-mode .header {
            background: var(--bg-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .top-bar {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            font-size: 11px;
            text-align: center;
            color: var(--text-muted);
        }

        .nav-container {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #53c451 0%, #2e7d32 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .wallet-btn {
            background: var(--accent-color);
            color: #000;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .wallet-btn:active {
            transform: scale(0.95);
        }

        /* Mobile Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 999;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Main Container */
        .container {
            padding: 12px 12px calc(70px + env(safe-area-inset-bottom));
            min-height: 100vh;
        }

        /* Sports Filter - Horizontal Scroll */
        .sports-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .sports-scroll::-webkit-scrollbar {
            display: none;
        }

        .sport-chip {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sport-chip:active {
            transform: scale(0.95);
        }

        .sport-chip.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
        }

        .live-badge {
            background: #f85149;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Game Cards - Mobile Optimized */
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sport-tag {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .game-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .teams-matchup {
            margin-bottom: 16px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            font-size: 28px;
        }

        .team-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .live-score {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Betting Markets - Mobile Grid */
        .betting-markets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
        }

        .bet-button {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .bet-button:active {
            transform: scale(0.95);
            background: var(--bg-tertiary);
            border-color: var(--accent-color);
        }

        .bet-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .bet-odds {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Wallet Modal - Mobile Full Screen */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            padding: 24px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 36px;
            height: 36px;
        }

        .balance-display {
            background: linear-gradient(135deg, #53c451 0%, #2e7d32 100%);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type="number"] {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Bet Slip - Mobile Bottom Sheet */
        .bet-slip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            border-radius: 16px 16px 0 0;
            padding: 20px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1500;
            max-height: 70vh;
            overflow-y: auto;
        }

        .bet-slip.active {
            transform: translateY(0);
        }

        .bet-slip-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .bet-slip-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        .bet-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .bet-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .bet-item-detail {
            font-size: 12px;
            color: var(--text-muted);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .quick-amount-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .quick-amount-btn:active {
            transform: scale(0.95);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Bet History */
        .bet-history {
            margin-top: 24px;
        }

        .bet-history-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .bet-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .bet-status.won {
            background: rgba(83, 196, 81, 0.2);
            color: #53c451;
        }

        .bet-status.lost {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        .bet-status.pending {
            background: rgba(139, 148, 158, 0.2);
            color: #8b949e;
        }

        /* Page Views */
        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="top-bar">
            📊 Betting Sites | Professional Sports Betting Platform
        </div>
        <div class="nav-container">
            <div class="logo">
                <span>📊</span>
                <span>BETTING SITES</span>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <button class="wallet-btn" onclick="openWalletModal()">
                    💰 <span id="headerBalance">$0.00</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sports Filter -->
        <div class="sports-scroll">
            <div class="sport-chip active" onclick="filterBySport('all')">
                <span>🏆</span>
                <span>All</span>
            </div>
            <div class="sport-chip" onclick="filterBySport('NFL')">
                <span>🏈</span>
                <span>NFL</span>
            </div>
            <div class="sport-chip" onclick="filterBySport('NBA')">
                <span>🏀</span>
                <span>NBA</span>
            </div>
            <div class="sport-chip" onclick="filterBySport('NHL')">
                <span>🏒</span>
                <span>NHL</span>
            </div>
            <div class="sport-chip" onclick="filterBySport('Soccer')">
                <span>⚽</span>
                <span>Soccer</span>
            </div>
            <div class="sport-chip" onclick="filterBySport('MLB')">
                <span>⚾</span>
                <span>MLB</span>
            </div>
        </div>

        <!-- Sportsbook Page -->
        <div id="sportsbookPage" class="page-view active">
            <div class="section-header">
                <h1 class="section-title">Live & Upcoming</h1>
            </div>
            <div class="games-grid" id="gamesContainer">
                <!-- Games will be loaded here -->
            </div>
        </div>

        <!-- My Bets Page -->
        <div id="myBetsPage" class="page-view">
            <div class="section-header">
                <h1 class="section-title">My Bets</h1>
            </div>
            <div id="betHistoryContainer"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('sportsbook')">
            <span class="nav-icon">🏆</span>
            <span>Sportsbook</span>
        </div>
        <div class="nav-item" onclick="showPage('myBets')">
            <span class="nav-icon">📋</span>
            <span>My Bets</span>
        </div>
    </div>

    <!-- Wallet Modal -->
    <div class="modal" id="walletModal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">My Wallet</h2>
                <button class="close-btn" onclick="closeWalletModal()">×</button>
            </div>
            <div class="balance-display">
                <div class="balance-label">Available Balance</div>
                <div class="balance-amount" id="modalBalance">$0.00</div>
            </div>
            <div class="input-group">
                <label class="input-label">Deposit Amount</label>
                <input type="number" id="depositAmount" placeholder="Enter amount" min="1" step="0.01">
            </div>
            <div class="quick-amounts">
                <button class="quick-amount-btn" onclick="setDepositAmount(50)">$50</button>
                <button class="quick-amount-btn" onclick="setDepositAmount(100)">$100</button>
                <button class="quick-amount-btn" onclick="setDepositAmount(250)">$250</button>
            </div>
            <button class="btn-primary" onclick="deposit()">Deposit Funds</button>
        </div>
    </div>

    <!-- Bet Slip -->
    <div class="bet-slip" id="betSlip">
        <div class="bet-slip-header">Bet Slip</div>
        <div id="betSlipContent" class="bet-slip-empty">
            Click on odds to add bets
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const userId = 'demo-user';
        let currentFilter = 'all';
        let currentBetSlip = null;
        let activeStreams = new Set();
        let currentPage = 'sportsbook';

        // Page Navigation
        function showPage(page) {
            currentPage = page;
            
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (page === 'sportsbook') {
                document.getElementById('sportsbookPage').classList.add('active');
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
            } else if (page === 'myBets') {
                document.getElementById('myBetsPage').classList.add('active');
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
                loadBetHistory();
            }
        }

        // Wallet Functions
        async function loadWallet() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${userId}/wallet`);
                const data = await response.json();
                const balance = data.balance.toFixed(2);
                document.getElementById('headerBalance').textContent = `$${balance}`;
                document.getElementById('modalBalance').textContent = `$${balance}`;
            } catch (error) {
                console.error('Error loading wallet:', error);
            }
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.add('active');
        }

        function closeWalletModal() {
            document.getElementById('walletModal').classList.remove('active');
        }

        function closeModalOnBackdrop(event) {
            if (event.target === event.currentTarget) {
                closeWalletModal();
            }
        }

        function setDepositAmount(amount) {
            document.getElementById('depositAmount').value = amount;
        }

        async function deposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${userId}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });
                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Deposited $${amount.toFixed(2)}`);
                    loadWallet();
                    document.getElementById('depositAmount').value = '';
                    closeWalletModal();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Error depositing:', error);
                alert('Failed to deposit funds');
            }
        }

        // Game Functions
        async function loadGames() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/games`);
                const data = await response.json();

                renderGames(data.games);

                data.games.forEach(game => {
                    if (game.status === 'live') {
                        startLiveStream(game.id);
                    }
                });
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        function renderGames(games) {
            const container = document.getElementById('gamesContainer');
            
            let filteredGames = games;
            if (currentFilter !== 'all') {
                filteredGames = games.filter(g => g.sport === currentFilter);
            }

            if (filteredGames.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">No games available</p>';
                return;
            }

            container.innerHTML = filteredGames.map(game => createGameCard(game)).join('');
        }

        function createGameCard(game) {
            const isLive = game.status === 'live';
            const statusBadge = isLive ? '<span class="live-badge">● LIVE</span>' : '';
            
            return `
                <div class="game-card" id="game-${game.id}">
                    <div class="game-meta">
                        <span class="sport-tag">${game.sport}</span>
                        ${statusBadge}
                        <span class="game-time">${formatGameTime(game.startTime)}</span>
                    </div>
                    
                    <div class="teams-matchup">
                        <div class="team-row">
                            <div class="team-info">
                                <span class="team-logo">${getTeamLogo(game.sport)}</span>
                                <span class="team-name">${game.awayTeam}</span>
                            </div>
                            <span class="live-score" id="score-away-${game.id}"></span>
                        </div>
                        <div class="team-row">
                            <div class="team-info">
                                <span class="team-logo">${getTeamLogo(game.sport)}</span>
                                <span class="team-name">${game.homeTeam}</span>
                            </div>
                            <span class="live-score" id="score-home-${game.id}"></span>
                        </div>
                    </div>
                    
                    <div class="betting-markets">
                        <div class="bet-button" onclick="addToBetSlip('${game.id}', '${game.awayTeam}', 'away', ${game.odds.away})">
                            <div class="bet-label">${game.awayTeam}</div>
                            <div class="bet-odds">${formatOdds(game.odds.away)}</div>
                        </div>
                        ${game.odds.draw ? `
                            <div class="bet-button" onclick="addToBetSlip('${game.id}', 'Draw', 'draw', ${game.odds.draw})">
                                <div class="bet-label">Draw</div>
                                <div class="bet-odds">${formatOdds(game.odds.draw)}</div>
                            </div>
                        ` : ''}
                        <div class="bet-button" onclick="addToBetSlip('${game.id}', '${game.homeTeam}', 'home', ${game.odds.home})">
                            <div class="bet-label">${game.homeTeam}</div>
                            <div class="bet-odds">${formatOdds(game.odds.home)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getTeamLogo(sport) {
            const logos = {
                'NFL': '🏈',
                'NBA': '🏀',
                'MLB': '⚾',
                'NHL': '🏒',
                'Soccer': '⚽',
                'MMA': '🥊'
            };
            return logos[sport] || '🏆';
        }

        function formatOdds(odds) {
            return odds > 0 ? `+${odds}` : odds;
        }

        function formatGameTime(timeString) {
            const date = new Date(timeString);
            return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function filterBySport(sport) {
            currentFilter = sport;
            
            document.querySelectorAll('.sport-chip').forEach(chip => {
                chip.classList.remove('active');
            });
            event.target.closest('.sport-chip').classList.add('active');
            
            loadGames();
        }

        // Live Streaming
        function startLiveStream(gameId) {
            if (activeStreams.has(gameId)) return;

            activeStreams.add(gameId);
            const eventSource = new EventSource(`${API_BASE}/streaming/stream/${gameId}`);

            eventSource.onmessage = (event) => {
                try {
                    const update = JSON.parse(event.data);
                    updateGameScore(update);
                } catch (error) {
                    console.error('Stream error for game', gameId);
                }
            };

            eventSource.onerror = () => {
                activeStreams.delete(gameId);
                eventSource.close();
            };
        }

        function updateGameScore(update) {
            const awayScore = document.getElementById(`score-away-${update.gameId}`);
            const homeScore = document.getElementById(`score-home-${update.gameId}`);
            
            if (awayScore && homeScore) {
                awayScore.textContent = update.score.away;
                homeScore.textContent = update.score.home;
            }
        }

        // Bet Slip
        function addToBetSlip(gameId, teamName, team, odds) {
            currentBetSlip = { gameId, teamName, team, odds };
            
            const betSlip = document.getElementById('betSlip');
            betSlip.classList.add('active');
            
            document.getElementById('betSlipContent').innerHTML = `
                <div class="bet-item">
                    <div class="bet-item-header">
                        <span>${teamName}</span>
                        <span>${formatOdds(odds)}</span>
                    </div>
                    <div class="bet-item-detail">Game ${gameId}</div>
                </div>
                <div class="input-group">
                    <label class="input-label">Bet Amount</label>
                    <input type="number" id="betAmount" placeholder="Enter amount" min="1" step="0.01">
                </div>
                <div class="quick-amounts">
                    <button class="quick-amount-btn" onclick="setBetAmount(10)">$10</button>
                    <button class="quick-amount-btn" onclick="setBetAmount(25)">$25</button>
                    <button class="quick-amount-btn" onclick="setBetAmount(50)">$50</button>
                </div>
                <button class="btn-primary" onclick="placeBet()">Place Bet</button>
                <button class="btn-primary" style="background: var(--bg-tertiary); color: var(--text-primary); margin-top: 8px;" onclick="closeBetSlip()">Cancel</button>
            `;
        }

        function closeBetSlip() {
            document.getElementById('betSlip').classList.remove('active');
            currentBetSlip = null;
        }

        function setBetAmount(amount) {
            document.getElementById('betAmount').value = amount;
        }

        async function placeBet() {
            if (!currentBetSlip) return;
            
            const amount = parseFloat(document.getElementById('betAmount').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sportsbook/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId,
                        gameId: currentBetSlip.gameId,
                        team: currentBetSlip.team,
                        amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Bet placed! Potential win: $${data.bet.potentialWin.toFixed(2)}`);
                    closeBetSlip();
                    loadWallet();
                    loadBetHistory();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Error placing bet:', error);
                alert('Failed to place bet');
            }
        }

        // Bet History
        async function loadBetHistory() {
            try {
                const response = await fetch(`${API_BASE}/sportsbook/user/${userId}/bets`);
                const data = await response.json();

                const container = document.getElementById('betHistoryContainer');

                if (data.bets.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">No bets yet</p>';
                    return;
                }

                container.innerHTML = data.bets.map(bet => `
                    <div class="bet-history-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: 600; font-size: 14px;">Game ${bet.gameId} - ${bet.team}</span>
                            <span class="bet-status ${bet.status}">${bet.status}</span>
                        </div>
                        <div style="font-size: 13px; color: var(--text-muted);">
                            Amount: $${bet.amount.toFixed(2)} | Potential Win: $${bet.potentialWin.toFixed(2)}
                        </div>
                        ${bet.status === 'pending' ? `
                            <button class="btn-primary" style="margin-top: 12px; padding: 12px; font-size: 14px;" onclick="cashOut('${bet.id}')">
                                💸 Cash Out
                            </button>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading bet history:', error);
            }
        }

        async function cashOut(betId) {
            if (!confirm('Are you sure you want to cash out this bet?')) return;

            try {
                const response = await fetch(`${API_BASE}/sportsbook/cashout/${betId}`, { method: 'POST' });
                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Cashed out for $${data.amount.toFixed(2)}`);
                    loadWallet();
                    loadBetHistory();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Error cashing out:', error);
                alert('Failed to cash out');
            }
        }

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadWallet();
            loadGames();
            loadBetHistory();

            setInterval(() => {
                loadWallet();
                if (currentPage === 'myBets') {
                    loadBetHistory();
                }
            }, 30000);
        });
    </script>
</body>
</html>
