<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mobile Contract Manager | Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #22c55e;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
            border: 1px solid #22c55e;
        }
        .status-bar {
            padding: 12px 16px;
            background: rgba(34, 197, 94, 0.1);
            margin: 16px;
            border-radius: 12px;
            border-left: 3px solid #22c55e;
            font-size: 14px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .section {
            margin: 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
        }
        .contract-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .contract-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .contract-name {
            font-size: 16px;
            font-weight: 600;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #475569;
            transition: 0.3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #22c55e;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .contract-info {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .contract-info:last-child {
            border-bottom: none;
        }
        .info-label {
            color: rgba(255, 255, 255, 0.6);
        }
        .info-value {
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }
        .control-panel {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .control-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #818cf8;
        }
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .control-btn {
            padding: 10px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .control-btn:active {
            background: rgba(99, 102, 241, 0.4);
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #6366f1;
        }
        .nav-icon {
            font-size: 22px;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34, 197, 94, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }
        .toast.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { top: 60px; opacity: 0; }
            to { top: 80px; opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="header">
        <h1>📱 Mobile Contract Manager</h1>
        <p style="font-size: 12px; color: rgba(255,255,255,0.7); margin: 4px 0;">Streaming Contract Control System</p>
        <span class="fcc-badge">FCC Entity: 20130314143016</span>
    </div>

    <div class="status-bar">
        <span class="status-dot"></span>
        <span id="statusText">System Ready</span>
    </div>

    <div class="section">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="activeContracts">0</div>
                <div class="stat-label">Active Contracts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalStreams">0</div>
                <div class="stat-label">Total Streams</div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="control-panel">
            <div class="control-title">🎛️ Master Controls</div>
            <div class="control-buttons">
                <button class="control-btn" onclick="toggleAllContracts(true)">Enable All</button>
                <button class="control-btn" onclick="toggleAllContracts(false)">Disable All</button>
                <button class="control-btn" onclick="refreshContracts()">🔄 Refresh</button>
                <button class="control-btn" onclick="syncContracts()">🔗 Sync</button>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Streaming Contracts</div>
        <div id="contractsList"></div>
    </div>

    <div class="section">
        <div class="section-title">Quick Actions</div>
        <button class="btn btn-success" onclick="addNewContract()">➕ Add New Contract</button>
        <button class="btn" onclick="viewAnalytics()">📊 View Analytics</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('contracts')">
            <div class="nav-icon">📝</div>
            <div>Contracts</div>
        </div>
        <div class="nav-item" onclick="switchTab('streams')">
            <div class="nav-icon">📺</div>
            <div>Streams</div>
        </div>
        <div class="nav-item" onclick="switchTab('analytics')">
            <div class="nav-icon">📊</div>
            <div>Analytics</div>
        </div>
        <div class="nav-item" onclick="switchTab('settings')">
            <div class="nav-icon">⚙️</div>
            <div>Settings</div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        let contracts = [];

        async function loadContracts() {
            try {
                document.getElementById('statusText').textContent = 'Loading contracts...';

                const response = await fetch(`${API_BASE}/streaming/partners`);
                const data = await response.json();

                contracts = data.partners || [];
                displayContracts();
                updateStats();

                document.getElementById('statusText').textContent = 'System Ready';
            } catch (error) {
                console.error('Error loading contracts:', error);
                document.getElementById('statusText').textContent = 'Error loading contracts';
                showToast('Failed to load contracts', 'error');
            }
        }

        function displayContracts() {
            const container = document.getElementById('contractsList');

            if (contracts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">No contracts found</div>';
                return;
            }

            container.innerHTML = contracts.map((contract, index) => `
                <div class="contract-card">
                    <div class="contract-header">
                        <div class="contract-name">${contract.name}</div>
                        <label class="toggle-switch">
                            <input type="checkbox" ${contract.active ? 'checked' : ''} onchange="toggleContract('${contract.id}', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="contract-info">
                        <span class="info-label">Contract ID</span>
                        <span class="info-value">${contract.id}</span>
                    </div>
                    <div class="contract-info">
                        <span class="info-label">Webhook URL</span>
                        <span class="info-value" style="font-size: 11px; word-break: break-all;">${contract.webhookUrl}</span>
                    </div>
                    <div class="contract-info">
                        <span class="info-label">Status</span>
                        <span class="info-value" style="color: ${contract.active ? '#22c55e' : '#ef4444'}">
                            ${contract.active ? '● Active' : '○ Inactive'}
                        </span>
                    </div>
                    <div class="contract-info">
                        <span class="info-label">Registered</span>
                        <span class="info-value">${new Date(contract.registeredAt).toLocaleDateString()}</span>
                    </div>
                    <button class="btn" onclick="viewContractDetails('${contract.id}')">View Details</button>
                </div>
            `).join('');
        }

        async function toggleContract(id, currentStatus) {
            try {
                showToast(`${currentStatus ? 'Enabling' : 'Disabling'} contract...`);

                const response = await fetch(`${API_BASE}/streaming/partners/${id}/toggle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ active: currentStatus }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Update local state
                const contract = contracts.find(c => c.id === id);
                if (contract) {
                    contract.active = currentStatus;
                }

                displayContracts(); // Re-render to update status color and text
                updateStats();
                showToast(`Contract ${currentStatus ? 'enabled' : 'disabled'} successfully`, 'success');
            } catch (error) {
                console.error('Error toggling contract:', error);
                showToast('Failed to update contract', 'error');
            }
        }

        async function toggleAllContracts(active) {
            try {
                showToast(`Applying to all contracts...`);
                const response = await fetch(`${API_BASE}/streaming/partners/toggle-all`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ active: active }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                contracts.forEach(contract => {
                    contract.active = active;
                });
                displayContracts();
                updateStats();
                showToast(`All contracts ${active ? 'enabled' : 'disabled'}`, 'success');
            } catch (error) {
                console.error('Error toggling all contracts:', error);
                showToast('Failed to update all contracts', 'error');
            }
        }

        function updateStats() {
            const activeCount = contracts.filter(c => c.active).length;
            document.getElementById('activeContracts').textContent = activeCount;
            document.getElementById('totalStreams').textContent = contracts.length;
        }

        async function refreshContracts() {
            showToast('Refreshing contracts...');
            await loadContracts();
            showToast('Contracts refreshed', 'success');
        }

        async function syncContracts() {
            showToast('Syncing contracts...');
            try {
                const response = await fetch(`${API_BASE}/streaming/partners/sync`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                showToast('Contracts synced successfully', 'success');
            } catch (error) {
                console.error('Error syncing contracts:', error);
                showToast('Failed to sync contracts', 'error');
            }
        }

        function addNewContract() {
            const name = prompt('Enter contract name:');
            const webhookUrl = prompt('Enter webhook URL:');

            if (name && webhookUrl) {
                const newContract = {
                    id: `contract-${Date.now()}`,
                    name: name,
                    webhookUrl: webhookUrl,
                    active: true,
                    registeredAt: new Date().toISOString()
                };

                contracts.push(newContract);
                displayContracts();
                updateStats();
                showToast('New contract added', 'success');
            }
        }

        function viewContractDetails(contractId) {
            const contract = contracts.find(c => c.id === contractId);
            if (contract) {
                alert(`Contract Details:\n\nName: ${contract.name}\nID: ${contract.id}\nStatus: ${contract.active ? 'Active' : 'Inactive'}\nWebhook: ${contract.webhookUrl}`);
            }
        }

        function viewAnalytics() {
            window.location.href = '/traffic-analytics.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');

            switch(tab) {
                case 'streams':
                    window.location.href = '/all-sports-streams.html';
                    break;
                case 'analytics':
                    window.location.href = '/traffic-analytics.html';
                    break;
                case 'settings':
                    window.location.href = '/wifi-plugin-hub.html';
                    break;
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'rgba(34, 197, 94, 0.95)' : 
                                      type === 'error' ? 'rgba(239, 68, 68, 0.95)' : 
                                      'rgba(99, 102, 241, 0.95)';
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize
        window.addEventListener('load', () => {
            loadContracts();
            setInterval(updateStats, 10000);
        });
    </script>
</body>
</html>
