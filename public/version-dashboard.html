
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Dashboard - Young Meaat LLC</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        .version-display {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0;
            color: white;
        }

        .build-date {
            opacity: 0.8;
            font-size: 14px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .changelog-section {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 30px;
        }

        .changelog-version {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        .changelog-version:last-child {
            border-bottom: none;
        }

        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .version-number {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
        }

        .version-date {
            font-size: 12px;
            opacity: 0.7;
        }

        .changes-list {
            list-style: none;
            padding: 0;
        }

        .changes-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .changes-list li:before {
            content: '→';
            position: absolute;
            left: 0;
            color: #22c55e;
            font-weight: 700;
        }

        .back-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Version Dashboard</h1>
        <div class="version-display" id="currentVersion">Loading...</div>
        <div class="build-date" id="buildDate"></div>
    </div>

    <h2 style="margin-bottom: 20px;">🚀 Features</h2>
    <div class="features-grid" id="featuresGrid"></div>

    <h2 style="margin: 30px 0 20px 0;">📝 Changelog</h2>
    <div class="changelog-section" id="changelogSection"></div>

    <button class="back-btn" onclick="window.location.href='/sportsbook-landing.html'">
        ← Back to Sportsbook Hub
    </button>

    <script>
        async function loadVersionData() {
            try {
                const response = await fetch(`${API_BASE}/version`);
                const data = await response.json();
                
                // Display version
                document.getElementById('currentVersion').textContent = `v${data.version}`;
                document.getElementById('buildDate').textContent = 
                    `Built: ${new Date(data.buildDate).toLocaleString()}`;
                
                // Display features
                const featuresGrid = document.getElementById('featuresGrid');
                featuresGrid.innerHTML = data.features.map(feature => `
                    <div class="feature-card">
                        <span style="font-size: 24px;">✓</span>
                        <span>${feature}</span>
                    </div>
                `).join('');
                
                // Display changelog
                const changelogSection = document.getElementById('changelogSection');
                changelogSection.innerHTML = Object.entries(data.changelog)
                    .sort((a, b) => b[0].localeCompare(a[0]))
                    .map(([version, info]) => `
                        <div class="changelog-version">
                            <div class="version-header">
                                <div class="version-number">v${version}</div>
                                <div class="version-date">${info.date}</div>
                            </div>
                            <ul class="changes-list">
                                ${info.changes.map(change => `<li>${change}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('');
                
            } catch (error) {
                console.error('Error loading version data:', error);
                document.getElementById('currentVersion').textContent = 'Error loading version';
            }
        }

        window.addEventListener('load', loadVersionData);
    </script>
</body>
</html>
