
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Port Launcher | Young Meeat LLC</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .google-logo {
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-right: 10px;
        }
        .auth-section {
            background: rgba(255, 255, 255, 0.95);
            color: #202124;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .google-btn {
            background: white;
            color: #1a73e8;
            border: 2px solid #1a73e8;
            padding: 14px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .google-btn:hover {
            background: #1a73e8;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
        }
        .user-info {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .user-info.active { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .app-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            border-color: #4ade80;
            box-shadow: 0 12px 32px rgba(74, 222, 128, 0.3);
        }
        .app-card.active { border-color: #22c55e; }
        .app-card.inactive { opacity: 0.6; border-color: #ef4444; }
        .app-icon {
            font-size: 48px;
            margin-bottom: 15px;
            text-align: center;
        }
        .app-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .app-desc {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .port-badge {
            background: rgba(26, 115, 232, 0.3);
            border: 2px solid #1a73e8;
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin: 5px;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-top: 10px;
        }
        .status-active { background: #22c55e; color: #000; }
        .status-inactive { background: #ef4444; color: #fff; }
        .launch-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .launch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }
        .launch-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="google-logo" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google Port Launcher
            </h1>
            <p style="font-size: 18px; margin: 10px 0;">Launch Apps from Any Port with Google Authentication</p>
            <div>
                <span class="port-badge">FCC: 20130314143016</span>
                <span class="port-badge">Google Connected</span>
                <span class="port-badge">Multi-Port Access</span>
            </div>
        </div>

        <div class="auth-section" id="authSection">
            <h2 style="margin-bottom: 15px; color: #202124;">Sign in with Google</h2>
            <p style="margin-bottom: 20px; color: #5f6368;">Authenticate to access all port-based applications</p>
            <button class="google-btn" onclick="handleGoogleSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <div class="user-info" id="userInfo">
                <h3 style="color: #16a34a; margin-bottom: 10px;">✓ Authenticated</h3>
                <p id="userEmail" style="color: #202124; font-weight: 600;"></p>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <h2 style="margin: 30px 0 20px; font-size: 28px; text-align: center;">🚀 Available Applications</h2>
        <div class="apps-grid" id="appsGrid">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let googleToken = null;
        let userEmail = null;

        function handleGoogleSignIn() {
            // Simulate Google OAuth (in production, use real Google Sign-In)
            googleToken = 'demo-google-token-' + Date.now();
            userEmail = 'user@gmail.com';
            
            document.getElementById('userInfo').classList.add('active');
            document.getElementById('userEmail').textContent = userEmail;
            
            loadApps();
        }

        async function loadApps() {
            try {
                const response = await fetch(`${API_BASE}/google-port-launcher/apps`);
                const data = await response.json();

                if (data.success) {
                    displayStats(data);
                    displayApps(data.apps);
                }
            } catch (error) {
                console.error('Error loading apps:', error);
            }
        }

        function displayStats(data) {
            const stats = [
                { label: 'Total Apps', value: data.totalApps },
                { label: 'Active Apps', value: data.activeApps },
                { label: 'Authenticated', value: googleToken ? 'Yes' : 'No' },
                { label: 'Port Range', value: '3000-5000' }
            ];

            document.getElementById('statsGrid').innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }

        function displayApps(apps) {
            document.getElementById('appsGrid').innerHTML = apps.map(app => `
                <div class="app-card ${app.status}">
                    <div class="app-icon">${app.icon}</div>
                    <div class="app-name">${app.name}</div>
                    <div class="app-desc">${app.description}</div>
                    <div>
                        <span class="port-badge">Port ${app.port}</span>
                        <span class="status-badge status-${app.status}">
                            ${app.status.toUpperCase()}
                        </span>
                    </div>
                    ${app.responseTime ? `
                        <p style="font-size: 12px; opacity: 0.8; margin-top: 8px;">
                            Response: ${app.responseTime}ms
                        </p>
                    ` : ''}
                    <button 
                        class="launch-btn" 
                        onclick="launchApp(${app.port})"
                        ${app.status !== 'active' || !googleToken ? 'disabled' : ''}
                    >
                        ${app.status === 'active' ? '🚀 Launch App' : '❌ Unavailable'}
                    </button>
                </div>
            `).join('');
        }

        async function launchApp(port) {
            if (!googleToken) {
                alert('Please sign in with Google first');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/google-port-launcher/launch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port, googleToken })
                });

                const data = await response.json();

                if (data.success) {
                    window.open(data.app.publicUrl, '_blank');
                } else {
                    alert('Error launching app: ' + data.error);
                }
            } catch (error) {
                console.error('Launch error:', error);
                alert('Failed to launch app');
            }
        }

        // Auto-load on page load
        window.addEventListener('load', () => {
            // Check for auth success from OAuth callback
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth') === 'success') {
                handleGoogleSignIn();
            }
        });
    </script>
</body>
</html>
