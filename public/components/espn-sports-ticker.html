
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPN Sports Ticker</title>
    <style>
        .espn-ticker-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            z-index: 9999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
            border-top: 3px solid #c8102e;
        }

        .ticker-header {
            background: rgba(200, 16, 46, 0.15);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(200, 16, 46, 0.3);
        }

        .ticker-logo {
            font-weight: 700;
            font-size: 13px;
            color: #c8102e;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticker-tabs {
            display: flex;
            gap: 12px;
        }

        .ticker-tab {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .ticker-tab:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .ticker-tab.active {
            color: white;
            background: #c8102e;
        }

        .ticker-content {
            overflow: hidden;
            height: 50px;
            position: relative;
            background: #0d0d0d;
        }

        .ticker-scroll {
            display: flex;
            gap: 20px;
            padding: 10px 16px;
            animation: scroll-left 90s linear infinite;
            white-space: nowrap;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .ticker-scroll:hover {
            animation-play-state: paused;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: fit-content;
        }

        .ticker-item:hover {
            background: rgba(200,16,46,0.2);
            border-color: #c8102e;
            transform: translateY(-2px);
        }

        .ticker-item.live {
            border-color: #ff4444;
            background: rgba(255,68,68,0.1);
            animation: live-pulse 2s ease-in-out infinite;
        }

        @keyframes live-pulse {
            0%, 100% { 
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4);
            }
            50% { 
                box-shadow: 0 0 0 4px rgba(255, 68, 68, 0);
            }
        }

        .live-indicator {
            background: #ff4444;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 800;
            animation: blink 1.5s infinite;
            letter-spacing: 0.5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .league-badge {
            background: #c8102e;
            color: white;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .score-display {
            font-weight: 800;
            font-size: 16px;
            color: #22c55e;
        }

        .team-name {
            font-size: 11px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .vs-separator {
            color: #6b7280;
            font-weight: 800;
            font-size: 10px;
        }

        .game-time {
            font-size: 9px;
            color: #9ca3af;
            font-weight: 600;
        }

        .news-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
        }

        .news-icon {
            font-size: 14px;
        }

        .news-headline {
            font-size: 11px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .ticker-toggle {
            position: fixed;
            bottom: 70px;
            right: 20px;
            background: #c8102e;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            z-index: 10000;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .ticker-toggle:hover {
            background: #a00d25;
            transform: translateY(-2px);
        }

        .ticker-container.collapsed .ticker-content {
            display: none;
        }

        .ticker-container.collapsed .ticker-header {
            padding: 6px 16px;
        }

        .ticker-container.collapsed {
            border-top-width: 2px;
        }

        .ticker-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .collapse-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .ticker-header {
                padding: 6px 12px;
            }

            .ticker-tabs {
                gap: 6px;
            }

            .ticker-tab {
                padding: 4px 8px;
                font-size: 10px;
            }

            .ticker-content {
                height: 45px;
            }

            .ticker-item {
                padding: 5px 10px;
                gap: 6px;
            }

            .team-name {
                font-size: 10px;
            }

            .score-display {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="espn-ticker-container" id="espnTicker">
        <div class="ticker-header">
            <div class="ticker-logo">
                <span>🏆</span>
                <span>Live Sports Tracker</span>
            </div>
            <div class="ticker-controls">
                <div class="ticker-tabs">
                    <button class="ticker-tab active" data-view="live">Live</button>
                    <button class="ticker-tab" data-view="upcoming">Upcoming</button>
                    <button class="ticker-tab" data-view="news">News</button>
                    <button class="ticker-tab" data-view="scores">All Scores</button>
                </div>
                <button class="collapse-btn" onclick="toggleTicker()">▼</button>
            </div>
        </div>
        <div class="ticker-content">
            <div class="ticker-scroll" id="tickerScroll"></div>
        </div>
    </div>

    <script>
        const ESPN_API_BASE_TICKER = window.location.origin;
        let currentView = 'live';
        let eventSource = null;
        let isCollapsed = false;

        function initializeTicker() {
            document.querySelectorAll('.ticker-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.ticker-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    loadTickerData();
                });
            });

            connectToLiveStream();
            loadTickerData();
            setInterval(loadTickerData, 30000);
        }

        function toggleTicker() {
            const ticker = document.getElementById('espnTicker');
            const btn = document.querySelector('.collapse-btn');
            isCollapsed = !isCollapsed;
            
            if (isCollapsed) {
                ticker.classList.add('collapsed');
                btn.textContent = '▲';
            } else {
                ticker.classList.remove('collapsed');
                btn.textContent = '▼';
            }
        }

        function connectToLiveStream() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${ESPN_API_BASE_TICKER}/espn-tracker/stream`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'scoreUpdate' || data.type === 'refresh') {
                    if (currentView === 'live') {
                        loadTickerData();
                    }
                }
            };

            eventSource.onerror = () => {
                console.error('EventSource error, reconnecting...');
                setTimeout(connectToLiveStream, 5000);
            };
        }

        async function loadTickerData() {
            const tickerScroll = document.getElementById('tickerScroll');
            
            try {
                let data;
                switch(currentView) {
                    case 'live':
                        const liveResponse = await fetch(`${ESPN_API_BASE_TICKER}/espn-tracker/live`);
                        data = await liveResponse.json();
                        displayLiveGames(data.liveGames);
                        break;
                    case 'upcoming':
                        const upcomingResponse = await fetch(`${ESPN_API_BASE_TICKER}/espn-tracker/upcoming?limit=25`);
                        data = await upcomingResponse.json();
                        displayUpcomingGames(data.upcomingGames);
                        break;
                    case 'news':
                        const newsResponse = await fetch(`${ESPN_API_BASE_TICKER}/espn-tracker/news?limit=25`);
                        data = await newsResponse.json();
                        displayNews(data.news);
                        break;
                    case 'scores':
                        const scoresResponse = await fetch(`${ESPN_API_BASE_TICKER}/espn-tracker/games`);
                        data = await scoresResponse.json();
                        displayAllScores(data.games);
                        break;
                }
            } catch (error) {
                console.error('Error loading ticker data:', error);
            }
        }

        function displayLiveGames(games) {
            const tickerScroll = document.getElementById('tickerScroll');
            
            if (games.length === 0) {
                tickerScroll.innerHTML = `
                    <div class="ticker-item">
                        <span style="color: #9ca3af;">No live games at the moment</span>
                    </div>
                `;
                return;
            }

            const itemsHtml = games.map(game => `
                <div class="ticker-item live" onclick="openGame('${game.gameId}')">
                    <span class="live-indicator">LIVE</span>
                    <span class="league-badge">${game.league}</span>
                    <span class="team-name">${game.awayTeam}</span>
                    <span class="score-display">${game.score?.away || 0}</span>
                    <span class="vs-separator">@</span>
                    <span class="team-name">${game.homeTeam}</span>
                    <span class="score-display">${game.score?.home || 0}</span>
                    <span class="game-time">${game.quarter || ''} ${game.timeRemaining || ''}</span>
                </div>
            `).join('');

            tickerScroll.innerHTML = itemsHtml + itemsHtml;
        }

        function displayUpcomingGames(games) {
            const tickerScroll = document.getElementById('tickerScroll');
            
            const itemsHtml = games.map(game => {
                const startTime = new Date(game.scheduledStartTime);
                const timeStr = startTime.toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true 
                });
                
                return `
                    <div class="ticker-item" onclick="openGame('${game.gameId}')">
                        <span class="league-badge">${game.league}</span>
                        <span class="team-name">${game.awayTeam}</span>
                        <span class="vs-separator">@</span>
                        <span class="team-name">${game.homeTeam}</span>
                        <span class="game-time">${timeStr}</span>
                    </div>
                `;
            }).join('');

            tickerScroll.innerHTML = itemsHtml + itemsHtml;
        }

        function displayNews(newsItems) {
            const tickerScroll = document.getElementById('tickerScroll');
            
            const itemsHtml = newsItems.map(news => {
                const icon = getNewsIcon(news.category);
                return `
                    <div class="news-item">
                        <span class="news-icon">${icon}</span>
                        <span class="league-badge">${news.league}</span>
                        <span class="news-headline">${news.headline}</span>
                    </div>
                `;
            }).join('');

            tickerScroll.innerHTML = itemsHtml + itemsHtml;
        }

        function displayAllScores(games) {
            const tickerScroll = document.getElementById('tickerScroll');
            
            const itemsHtml = games.map(game => {
                const isLive = game.status === 'live';
                return `
                    <div class="ticker-item ${isLive ? 'live' : ''}" onclick="openGame('${game.gameId}')">
                        ${isLive ? '<span class="live-indicator">LIVE</span>' : ''}
                        <span class="league-badge">${game.league}</span>
                        <span class="team-name">${game.awayTeam}</span>
                        <span class="score-display">${game.score?.away || '-'}</span>
                        <span class="vs-separator">@</span>
                        <span class="team-name">${game.homeTeam}</span>
                        <span class="score-display">${game.score?.home || '-'}</span>
                        ${isLive ? `<span class="game-time">${game.quarter || ''}</span>` : ''}
                    </div>
                `;
            }).join('');

            tickerScroll.innerHTML = itemsHtml + itemsHtml;
        }

        function getNewsIcon(category) {
            const icons = {
                'breaking': '🚨',
                'injury': '🏥',
                'trade': '🔄',
                'game-recap': '📊',
                'general': '📰'
            };
            return icons[category] || '📰';
        }

        function openGame(gameId) {
            window.location.href = `/index.html?gameId=${gameId}`;
        }

        window.addEventListener('load', initializeTicker);

        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
