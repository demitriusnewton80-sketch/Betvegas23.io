
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Alliance Hub - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .launch-form {
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        .btn {
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .alliance-list {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
        }
        .alliance-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-disconnected { background: #6b7280; }
        .fcc-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Port Alliance Hub</h1>
            <p>Launch and manage server port connections</p>
            <div>
                <span class="fcc-badge">FCC: 20130314143016</span>
                <span class="fcc-badge">Troubleshooting Core: Active</span>
            </div>
        </div>

        <div class="status-grid">
            <div class="status-card">
                <h3>📊 Port Landscape</h3>
                <div id="portStats">Loading...</div>
            </div>
            <div class="status-card">
                <h3>🔧 Troubleshooting</h3>
                <div id="troubleshootingStats">Loading...</div>
            </div>
            <div class="status-card">
                <h3>🔗 Active Alliances</h3>
                <div id="allianceCount">0</div>
            </div>
        </div>

        <div class="launch-form">
            <h2>🚀 Launch New Alliance</h2>
            <div class="form-group">
                <label>App Name</label>
                <input type="text" id="appName" placeholder="My Application">
            </div>
            <div class="form-group">
                <label>Target Port</label>
                <select id="targetPort">
                    <option value="5000">5000 (Recommended)</option>
                    <option value="3000">3000</option>
                    <option value="3001">3001</option>
                    <option value="4200">4200</option>
                    <option value="8000">8000</option>
                    <option value="8080">8080</option>
                </select>
            </div>
            <div class="form-group">
                <label>Server Address</label>
                <input type="text" id="serverAddress" value="0.0.0.0" readonly>
            </div>
            <button class="btn" onclick="launchAlliance()">🚀 Launch Alliance</button>
        </div>

        <div class="alliance-list">
            <h2>📋 Active Alliances</h2>
            <div id="alliancesList">No alliances launched yet</div>
        </div>
    </div>

    <script>
        let eventSource = null;

        async function launchAlliance() {
            const appName = document.getElementById('appName').value;
            const targetPort = parseInt(document.getElementById('targetPort').value);
            const serverAddress = document.getElementById('serverAddress').value;

            if (!appName) {
                alert('Please enter an app name');
                return;
            }

            try {
                const response = await fetch('/port-alliance/launch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appName, targetPort, serverAddress })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert(`Alliance launched successfully!\nConnection URL: ${data.connectionUrl}`);
                    loadAlliances();
                    startStreaming(data.alliance.id);
                } else {
                    alert('Failed to launch alliance: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Launch error:', error);
                alert('Failed to launch alliance');
            }
        }

        async function loadAlliances() {
            try {
                const response = await fetch('/port-alliance/list');
                const data = await response.json();

                const alliancesList = document.getElementById('alliancesList');
                const allianceCount = document.getElementById('allianceCount');

                if (data.alliances && data.alliances.length > 0) {
                    alliancesList.innerHTML = data.alliances.map(alliance => `
                        <div class="alliance-item">
                            <div>
                                <span class="status-indicator status-${alliance.status}"></span>
                                <strong>${alliance.appName}</strong> - Port ${alliance.port}
                                <br>
                                <small>${alliance.serverAddress}</small>
                            </div>
                            <button class="btn" onclick="testAlliance('${alliance.id}')">Test</button>
                        </div>
                    `).join('');
                    
                    allianceCount.textContent = data.alliances.length;
                } else {
                    alliancesList.innerHTML = 'No alliances launched yet';
                    allianceCount.textContent = '0';
                }

                if (data.portLandscape) {
                    document.getElementById('portStats').innerHTML = `
                        Active: ${data.portLandscape.activePorts}<br>
                        Bypassed: ${data.portLandscape.bypassedPorts}<br>
                        Errors: ${data.portLandscape.errorPorts}
                    `;
                }
            } catch (error) {
                console.error('Load error:', error);
            }
        }

        async function testAlliance(allianceId) {
            try {
                const response = await fetch(`/port-alliance/test/${allianceId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    alert(`Connection successful!\nLatency: ${data.latency}ms`);
                } else {
                    alert('Connection test failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Test failed: ' + error.message);
            }
        }

        function startStreaming(allianceId) {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`/port-alliance/stream/${allianceId}`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.troubleshooting) {
                    document.getElementById('troubleshootingStats').innerHTML = `
                        Auto-Fix: ${data.troubleshooting.autoFixEnabled ? 'Enabled' : 'Disabled'}<br>
                        Session: ${data.troubleshooting.sessionActive ? 'Active' : 'Inactive'}<br>
                        Issues: ${data.troubleshooting.issuesDetected}
                    `;
                }
            };

            eventSource.onerror = () => {
                console.log('Stream connection lost');
            };
        }

        // Load initial data
        loadAlliances();
        setInterval(loadAlliances, 5000);
    </script>
</body>
</html>
