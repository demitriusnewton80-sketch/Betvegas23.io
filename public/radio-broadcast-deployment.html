
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Broadcast Deployment | Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: #ef4444;
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #ef4444;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .deploy-controls {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
        }

        .btn-league {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .deployments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .deployment-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }

        .deployment-card.active {
            border-color: #22c55e;
        }

        .deployment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-deploying {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .listeners {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            .deployments-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📻 Radio Broadcast Deployment</h1>
            <p style="opacity: 0.9; margin-top: 10px;">Deploy Live Radio to All Sportsbooks</p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDeployments">0</div>
                <div class="stat-label">Total Deployments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeDeployments">0</div>
                <div class="stat-label">Active Deployments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalListeners">0</div>
                <div class="stat-label">Total Listeners</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sportsbooksReached">0</div>
                <div class="stat-label">Sportsbooks Reached</div>
            </div>
        </div>

        <div class="deploy-controls">
            <h2 style="margin-bottom: 20px; color: #ef4444;">🚀 Deployment Controls</h2>
            <button class="btn" onclick="deployToAll()">📡 Deploy to All Sportsbooks</button>
            <button class="btn btn-league" onclick="deployByLeague('NFL')">🏈 Deploy NFL Radio</button>
            <button class="btn btn-league" onclick="deployByLeague('NBA')">🏀 Deploy NBA Radio</button>
            <button class="btn btn-league" onclick="deployByLeague('MLB')">⚾ Deploy MLB Radio</button>
            <button class="btn btn-league" onclick="deployByLeague('NHL')">🏒 Deploy NHL Radio</button>
        </div>

        <h2 style="margin-bottom: 20px; color: #ef4444;">📊 Active Deployments</h2>
        <div class="deployments-grid" id="deploymentsGrid"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/radio-broadcast-deployment/status`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalDeployments').textContent = data.totalDeployments;
                    document.getElementById('activeDeployments').textContent = data.activeDeployments;
                    document.getElementById('totalListeners').textContent = data.totalListeners.toLocaleString();
                    document.getElementById('sportsbooksReached').textContent = new Set(data.deployments.map(d => d.sportsbookId)).size;
                    
                    displayDeployments(data.deployments);
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        function displayDeployments(deployments) {
            const container = document.getElementById('deploymentsGrid');

            if (!deployments || deployments.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; opacity: 0.7;">No deployments yet. Click "Deploy to All Sportsbooks" to start.</p>';
                return;
            }

            container.innerHTML = deployments.map(d => `
                <div class="deployment-card ${d.status === 'active' ? 'active' : ''}">
                    <div class="deployment-header">
                        <strong>${d.sportsbookName}</strong>
                        <span class="status-badge status-${d.status}">${d.status.toUpperCase()}</span>
                    </div>
                    <div style="font-size: 13px; opacity: 0.8; margin-bottom: 8px;">
                        Radio Streams: ${d.radioStreams.length}
                    </div>
                    ${d.status === 'active' ? `
                        <div class="listeners">👥 ${d.listeners.toLocaleString()} listeners</div>
                        <div style="font-size: 12px; opacity: 0.6; margin-top: 8px;">
                            Deployed: ${new Date(d.deployedAt).toLocaleString()}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function deployToAll() {
            if (!confirm('Deploy radio broadcast to all sportsbooks?')) return;

            try {
                const response = await fetch(`${API_BASE}/radio-broadcast-deployment/deploy/all`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Deployment Complete!\n\nSportsbooks: ${data.summary.successfulDeployments}/${data.summary.totalSportsbooks}\nRadio Streams: ${data.summary.totalRadioStreams}\nTotal Listeners: ${data.summary.totalListeners.toLocaleString()}`);
                    loadStatus();
                } else {
                    alert('❌ Deployment failed: ' + data.error);
                }
            } catch (error) {
                console.error('Deployment error:', error);
                alert('❌ Deployment failed');
            }
        }

        async function deployByLeague(league) {
            if (!confirm(`Deploy ${league} radio to all sportsbooks?`)) return;

            try {
                const response = await fetch(`${API_BASE}/radio-broadcast-deployment/deploy/league/${league}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ ${league} Radio Deployed!\n\nSportsbooks: ${data.summary.successfulDeployments}/${data.summary.totalSportsbooks}\nStreams: ${data.summary.totalRadioStreams}`);
                    loadStatus();
                } else {
                    alert('❌ Deployment failed: ' + data.error);
                }
            } catch (error) {
                console.error('Deployment error:', error);
                alert('❌ Deployment failed');
            }
        }

        // Auto-refresh
        setInterval(loadStatus, 5000);

        // Initial load
        window.addEventListener('load', loadStatus);
    </script>
</body>
</html>
