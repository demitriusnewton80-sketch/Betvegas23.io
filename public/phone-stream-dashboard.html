
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Stream Sync Dashboard | Young Meeat LLC</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .stat-value {
            font-size: 42px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .section {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        .subscription-card {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .phone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .phone-number {
            font-size: 18px;
            font-weight: 700;
        }

        .signal-badge {
            background: #22c55e;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .signal-badge.disconnected {
            background: #ef4444;
        }

        .prefs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .pref-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .update-log {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
        }

        .update-item {
            padding: 10px;
            border-left: 3px solid #22c55e;
            margin-bottom: 10px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 4px;
        }

        .update-time {
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 Phone Stream Sync</h1>
        <p>Real-time Sports Updates via Signal</p>
        <span class="fcc-badge">FCC Entity: 20130314143016</span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalSubscriptions">0</div>
            <div class="stat-label">Active Subscriptions</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="signalConnections">0</div>
            <div class="stat-label">Signal Connected</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="liveGames">0</div>
            <div class="stat-label">Live Games</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="updatesSent">0</div>
            <div class="stat-label">Updates Sent</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📲 Active Subscriptions</div>
        <div id="subscriptionsList"></div>
    </div>

    <div class="section">
        <div class="section-title">📊 Recent Updates</div>
        <div class="update-log" id="updateLog"></div>
    </div>

    <script>
        let eventSource = null;
        let updateCount = 0;

        async function loadSubscriptions() {
            try {
                const response = await fetch(`${API_BASE}/phone-stream/subscriptions`);
                const data = await response.json();

                if (data.success) {
                    displaySubscriptions(data.subscriptions);
                    updateStats(data.subscriptions, data.signalConnections);
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
            }
        }

        function displaySubscriptions(subscriptions) {
            const container = document.getElementById('subscriptionsList');

            if (subscriptions.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No active subscriptions</p>';
                return;
            }

            container.innerHTML = subscriptions.map(sub => `
                <div class="subscription-card">
                    <div class="phone-header">
                        <div class="phone-number">📱 ${sub.phoneNumber}</div>
                        <div class="signal-badge ${sub.signalConnected ? '' : 'disconnected'}">
                            ${sub.signalConnected ? '✓ Signal Connected' : '✗ Signal Offline'}
                        </div>
                    </div>
                    <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                        Last Sync: ${new Date(sub.lastSync).toLocaleString()}
                    </div>
                    <div><strong>Sports:</strong> ${sub.sports.length > 0 ? sub.sports.join(', ') : 'All'}</div>
                    <div class="prefs-grid">
                        <div class="pref-item">
                            ${sub.notificationPreferences.scoreUpdates ? '✓' : '✗'} Score Updates
                        </div>
                        <div class="pref-item">
                            ${sub.notificationPreferences.gameStart ? '✓' : '✗'} Game Start
                        </div>
                        <div class="pref-item">
                            ${sub.notificationPreferences.gameEnd ? '✓' : '✗'} Game End
                        </div>
                        <div class="pref-item">
                            ${sub.notificationPreferences.breakingNews ? '✓' : '✗'} Breaking News
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="unsubscribe('${sub.phoneId}')" style="margin-top: 15px; width: 100%;">
                        Unsubscribe
                    </button>
                </div>
            `).join('');
        }

        function updateStats(subscriptions, signalConnections) {
            document.getElementById('totalSubscriptions').textContent = subscriptions.length;
            document.getElementById('signalConnections').textContent = signalConnections.length;
        }

        async function loadLiveGames() {
            try {
                const response = await fetch(`${API_BASE}/phone-stream/live-games`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('liveGames').textContent = data.count;
                }
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        function addUpdateToLog(update) {
            const log = document.getElementById('updateLog');
            const item = document.createElement('div');
            item.className = 'update-item';
            item.innerHTML = `
                <div>${update.message}</div>
                <div class="update-time">${new Date(update.timestamp).toLocaleString()}</div>
            `;
            log.insertBefore(item, log.firstChild);

            updateCount++;
            document.getElementById('updatesSent').textContent = updateCount;

            // Keep only last 50 updates
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }

        async function unsubscribe(phoneId) {
            if (!confirm('Unsubscribe this phone?')) return;

            try {
                const response = await fetch(`${API_BASE}/phone-stream/unsubscribe/${phoneId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    alert('Phone unsubscribed successfully');
                    loadSubscriptions();
                }
            } catch (error) {
                console.error('Error unsubscribing:', error);
                alert('Failed to unsubscribe');
            }
        }

        window.addEventListener('load', () => {
            loadSubscriptions();
            loadLiveGames();

            setInterval(() => {
                loadSubscriptions();
                loadLiveGames();
            }, 10000);
        });
    </script>
</body>
</html>
