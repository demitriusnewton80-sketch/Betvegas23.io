
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge-Port Fusion Control | Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .status-value {
            font-size: 2em;
            font-weight: bold;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1em;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s;
            margin-right: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .mapping-list, .position-list, .control-list {
            margin-top: 20px;
        }

        .item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-id {
            font-weight: bold;
            font-family: monospace;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-active {
            background: #10b981;
        }

        .badge-syncing {
            background: #f59e0b;
        }

        .badge-inactive {
            background: #ef4444;
        }

        .badge-synced {
            background: #10b981;
        }

        .badge-pending {
            background: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Bridge-Port Fusion Control</h1>
            <p>Think or Swim Core Position Programming</p>
            <p style="font-size: 0.9em; margin-top: 10px;">FCC Entity: 20130314143016</p>
        </div>

        <div class="status-grid">
            <div class="status-card">
                <div class="status-label">Fusion Status</div>
                <div class="status-value" id="fusionActive">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">Active Mappings</div>
                <div class="status-value" id="activeMappings">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">Core Positions</div>
                <div class="status-value" id="totalPositions">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">Deployment Controls</div>
                <div class="status-value" id="totalControls">0</div>
            </div>
        </div>

        <div class="section">
            <h2>🎯 Create Bridge-Port Mapping</h2>
            <div class="form-group">
                <label>Bridge Command:</label>
                <input type="text" id="bridgeCommand" placeholder="npm run build">
            </div>
            <div class="form-group">
                <label>Port Number:</label>
                <input type="number" id="portNumber" placeholder="5000">
            </div>
            <div class="form-group">
                <label>Deployment Command:</label>
                <input type="text" id="deploymentCommand" placeholder="node dist/index.js">
            </div>
            <button class="btn" onclick="createMapping()">Create Mapping</button>
        </div>

        <div class="section">
            <h2>📊 Build Think or Swim Position</h2>
            <div class="form-group">
                <label>Strategy:</label>
                <input type="text" id="tosStrategy" placeholder="iron-condor">
            </div>
            <div class="form-group">
                <label>Parameters (JSON):</label>
                <textarea id="tosParameters" rows="3" placeholder='{"strike": 100, "width": 5}'></textarea>
            </div>
            <button class="btn" onclick="buildTOSPosition()">Build Position</button>
        </div>

        <div class="section">
            <h2>🔗 Active Mappings</h2>
            <div id="mappingsList" class="mapping-list"></div>
        </div>

        <div class="section">
            <h2>📊 Core Positions</h2>
            <div id="positionsList" class="position-list"></div>
        </div>

        <div class="section">
            <h2>🚀 Deployment Controls</h2>
            <div id="controlsList" class="control-list"></div>
        </div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('/bridge-port-fusion/status');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('fusionActive').textContent = data.fusionActive ? 'Active' : 'Inactive';
                    document.getElementById('activeMappings').textContent = data.mappings.active;
                    document.getElementById('totalPositions').textContent = data.corePositions.total;
                    document.getElementById('totalControls').textContent = data.deploymentControls.total;
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function createMapping() {
            const bridgeCommand = document.getElementById('bridgeCommand').value;
            const portNumber = document.getElementById('portNumber').value;
            const deploymentCommand = document.getElementById('deploymentCommand').value;

            if (!bridgeCommand || !portNumber || !deploymentCommand) {
                alert('Please fill all fields');
                return;
            }

            try {
                const response = await fetch('/bridge-port-fusion/map', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bridgeCommand, portNumber, deploymentCommand })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Mapping created: ${data.mappingId}`);
                    loadMappings();
                    loadStatus();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function buildTOSPosition() {
            const strategy = document.getElementById('tosStrategy').value;
            const parametersText = document.getElementById('tosParameters').value;

            if (!strategy) {
                alert('Please enter a strategy');
                return;
            }

            let parameters = {};
            if (parametersText) {
                try {
                    parameters = JSON.parse(parametersText);
                } catch (e) {
                    alert('Invalid JSON parameters');
                    return;
                }
            }

            try {
                const response = await fetch('/bridge-port-fusion/think-or-swim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ strategy, parameters })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Position built: ${data.positionId}`);
                    loadPositions();
                    loadStatus();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadMappings() {
            try {
                const response = await fetch('/bridge-port-fusion/mappings');
                const data = await response.json();

                if (data.success) {
                    const list = document.getElementById('mappingsList');
                    list.innerHTML = data.mappings.map(m => `
                        <div class="item">
                            <div class="item-header">
                                <span class="item-id">${m.id}</span>
                                <span class="badge badge-${m.fusionStatus}">${m.fusionStatus}</span>
                            </div>
                            <div>Bridge: ${m.bridgeCommand}</div>
                            <div>Port: ${m.portNumber}</div>
                            <div>Deployment: ${m.deploymentControl}</div>
                        </div>
                    `).join('') || '<p>No mappings created yet</p>';
                }
            } catch (error) {
                console.error('Error loading mappings:', error);
            }
        }

        async function loadPositions() {
            try {
                const response = await fetch('/bridge-port-fusion/positions');
                const data = await response.json();

                if (data.success) {
                    const list = document.getElementById('positionsList');
                    list.innerHTML = data.positions.map(p => `
                        <div class="item">
                            <div class="item-header">
                                <span class="item-id">${p.id}</span>
                                <span class="badge badge-${p.syncStatus}">${p.syncStatus}</span>
                            </div>
                            <div>Type: ${p.type}</div>
                            <div>Mapping: ${p.mappingId || 'None'}</div>
                        </div>
                    `).join('') || '<p>No positions created yet</p>';
                }
            } catch (error) {
                console.error('Error loading positions:', error);
            }
        }

        async function loadControls() {
            try {
                const response = await fetch('/bridge-port-fusion/controls');
                const data = await response.json();

                if (data.success) {
                    const list = document.getElementById('controlsList');
                    list.innerHTML = data.controls.map(c => `
                        <div class="item">
                            <div class="item-header">
                                <span class="item-id">${c.id}</span>
                                <span class="badge ${c.mappingComplete ? 'badge-synced' : 'badge-pending'}">
                                    ${c.mappingComplete ? 'Complete' : 'Pending'}
                                </span>
                            </div>
                            <div>Command: ${c.command}</div>
                            <div>Port: ${c.targetPort}</div>
                            <div>Bridge Linked: ${c.bridgeLinked ? 'Yes' : 'No'}</div>
                        </div>
                    `).join('') || '<p>No controls created yet</p>';
                }
            } catch (error) {
                console.error('Error loading controls:', error);
            }
        }

        // Initialize
        loadStatus();
        loadMappings();
        loadPositions();
        loadControls();

        // Auto-refresh
        setInterval(loadStatus, 5000);
        setInterval(loadMappings, 10000);
        setInterval(loadPositions, 10000);
        setInterval(loadControls, 10000);
    </script>
</body>
</html>
