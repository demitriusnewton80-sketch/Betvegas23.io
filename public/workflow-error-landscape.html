
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Error Landscape | 20130314143016 Inc.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .stat-value {
            font-size: 42px;
            font-weight: 800;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-transform: uppercase;
        }

        .landscape-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }

        .landscape-section h2 {
            color: #f59e0b;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .landscape-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .landscape-card.optimal {
            border-color: #22c55e;
        }

        .landscape-card.degraded {
            border-color: #f59e0b;
        }

        .landscape-card.critical {
            border-color: #ef4444;
        }

        .health-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .health-optimal {
            background: #22c55e;
            color: white;
        }

        .health-degraded {
            background: #f59e0b;
            color: white;
        }

        .health-critical {
            background: #ef4444;
            color: white;
        }

        .zone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .zone-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .strategy-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .strategy-tag {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #3b82f6;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .strategy-tag:hover {
            background: rgba(59, 130, 246, 0.4);
        }

        .error-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .error-recovered {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Workflow Error Landscape</h1>
            <p style="color: rgba(255, 255, 255, 0.9); margin-top: 10px;">
                Automated Error Detection & Recovery System
            </p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn" onclick="refreshData()">🔄 Refresh Status</button>
            <button class="btn" onclick="viewAllErrors()">📋 View All Errors</button>
        </div>

        <div class="landscape-section">
            <h2>🗺️ Error Landscapes</h2>
            <div id="landscapesContainer"></div>
        </div>

        <div class="landscape-section">
            <h2>⚠️ Recent Errors</h2>
            <div class="error-list" id="errorsContainer"></div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        const API_BASE = window.location.origin;

        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/workflow-landscape/status`);
                const data = await response.json();

                if (data.success) {
                    displayStats(data.summary);
                    displayLandscapes(data.landscapes);
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadErrors() {
            try {
                const response = await fetch(`${API_BASE}/workflow-landscape/errors`);
                const data = await response.json();

                if (data.success) {
                    displayErrors(data.errors);
                }
            } catch (error) {
                console.error('Error loading errors:', error);
            }
        }

        function displayStats(summary) {
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${summary.totalErrors}</div>
                    <div class="stat-label">Total Errors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.recoveredErrors}</div>
                    <div class="stat-label">Recovered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.unresolvedErrors}</div>
                    <div class="stat-label">Unresolved</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${summary.queueLength}</div>
                    <div class="stat-label">In Queue</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHtml;
        }

        function displayLandscapes(landscapes) {
            const landscapesHtml = landscapes.map(landscape => `
                <div class="landscape-card ${landscape.health}">
                    <h3 style="margin-bottom: 10px;">
                        ${landscape.name}
                        <span class="health-badge health-${landscape.health}">${landscape.health}</span>
                    </h3>
                    <div style="margin-bottom: 15px; color: rgba(255,255,255,0.8);">
                        Workflows: ${landscape.workflows.join(', ')}
                    </div>
                    <div class="zone-grid">
                        ${landscape.errorZones.map(zone => `
                            <div class="zone-card">
                                <strong>${zone.type.toUpperCase()} Zone</strong>
                                <div style="margin: 10px 0; color: rgba(255,255,255,0.8);">
                                    Errors: ${zone.errorCount} | Priority: ${zone.priority}
                                </div>
                                <div class="strategy-list">
                                    ${zone.strategies.map(strategy => 
                                        `<span class="strategy-tag" onclick="executeStrategy('${zone.id}', '${strategy}')">${strategy}</span>`
                                    ).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('landscapesContainer').innerHTML = landscapesHtml;
        }

        function displayErrors(errors) {
            if (errors.length === 0) {
                document.getElementById('errorsContainer').innerHTML = 
                    '<p style="color: rgba(255,255,255,0.7);">No errors detected</p>';
                return;
            }

            const errorsHtml = errors.slice(-10).reverse().map(error => `
                <div class="error-card ${error.recovered ? 'error-recovered' : ''}">
                    <div style="font-weight: 700; font-size: 18px; margin-bottom: 8px;">
                        ${error.workflowName}
                    </div>
                    <div style="margin-bottom: 8px;">
                        <strong>Stage:</strong> ${error.stage} | 
                        <strong>Type:</strong> ${error.errorType} |
                        <strong>Attempts:</strong> ${error.attempts}
                    </div>
                    <div style="color: rgba(255,255,255,0.9);">
                        ${error.message}
                    </div>
                    <div style="margin-top: 8px; font-size: 12px; opacity: 0.7;">
                        ${new Date(error.timestamp).toLocaleString()}
                        ${error.recovered ? ' | ✅ RECOVERED' : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('errorsContainer').innerHTML = errorsHtml;
        }

        async function executeStrategy(zoneId, strategyName) {
            try {
                const response = await fetch(`${API_BASE}/workflow-landscape/execute-strategy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zoneId, strategyName })
                });
                const data = await response.json();

                if (data.success) {
                    alert(`Strategy executed: ${strategyName}\n\n${data.message}`);
                    refreshData();
                }
            } catch (error) {
                alert('Failed to execute strategy: ' + error.message);
            }
        }

        function viewAllErrors() {
            window.open('/workflow-landscape/errors', '_blank');
        }

        async function refreshData() {
            await Promise.all([loadStatus(), loadErrors()]);
        }

        // Initial load
        refreshData();

        // Auto-refresh every 10 seconds
        setInterval(refreshData, 10000);
    </script>
</body>
</html>
