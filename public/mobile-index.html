
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Young Meeat LLC - Mobile Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
        }

        .mobile-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .mobile-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .fcc-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin: 4px;
            font-weight: 600;
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
            background: rgba(30, 41, 59, 0.5);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .section {
            padding: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .service-card:active {
            transform: scale(0.95);
            border-color: #3b82f6;
        }

        .service-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .service-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .service-status {
            font-size: 11px;
            color: #22c55e;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            padding: 8px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #6366f1;
        }

        .nav-icon {
            font-size: 24px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="mobile-header">
        <h1>🎯 Young Meeat LLC</h1>
        <p style="font-size: 14px; margin: 8px 0;">Mobile Sports Betting Hub</p>
        <div>
            <span class="fcc-badge">FCC: 20130314143016</span>
            <span class="fcc-badge">Mobile Optimized</span>
        </div>
    </div>

    <div class="quick-stats">
        <div class="stat-card">
            <div class="stat-value" id="liveGames">0</div>
            <div class="stat-label">Live Games</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalGames">0</div>
            <div class="stat-label">Total Games</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="sports">0</div>
            <div class="stat-label">Sports</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="streaming">0</div>
            <div class="stat-label">Streams</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            🎮 Quick Access
        </div>
        <div class="service-grid">
            <div class="service-card" onclick="navigate('/mobile-sportsbook-app.html')">
                <div class="service-icon">🏆</div>
                <div class="service-name">Sportsbook</div>
                <div class="service-status">● Live</div>
            </div>
            <div class="service-card" onclick="navigate('/ps5-betting.html')">
                <div class="service-icon">🎮</div>
                <div class="service-name">PS5 Games</div>
                <div class="service-status">● Active</div>
            </div>
            <div class="service-card" onclick="navigate('/mobile-sportsbook-hub.html')">
                <div class="service-icon">📺</div>
                <div class="service-name">Streaming</div>
                <div class="service-status">● Online</div>
            </div>
            <div class="service-card" onclick="navigate('/mobile-contract-manager.html')">
                <div class="service-icon">📱</div>
                <div class="service-name">Contracts</div>
                <div class="service-status">● Ready</div>
            </div>
            <div class="service-card" onclick="navigate('/parlay-builder.html')">
                <div class="service-icon">🎯</div>
                <div class="service-name">Parlays</div>
                <div class="service-status">● Active</div>
            </div>
            <div class="service-card" onclick="navigate('/web3-bridge.html')">
                <div class="service-icon">💎</div>
                <div class="service-name">Web3</div>
                <div class="service-status">● Connected</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <div class="nav-icon">🏠</div>
            <div>Home</div>
        </div>
        <div class="nav-item" onclick="switchTab('games')">
            <div class="nav-icon">🎮</div>
            <div>Games</div>
        </div>
        <div class="nav-item" onclick="switchTab('bets')">
            <div class="nav-icon">🎯</div>
            <div>Bets</div>
        </div>
        <div class="nav-item" onclick="switchTab('menu')">
            <div class="nav-icon">☰</div>
            <div>Menu</div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/mobile/stats`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('liveGames').textContent = data.stats.liveGames;
                    document.getElementById('totalGames').textContent = data.stats.totalGames;
                    document.getElementById('sports').textContent = data.stats.sports;
                }

                const streamResponse = await fetch(`${API_BASE}/mobile/streaming/status`);
                const streamData = await streamResponse.json();

                if (streamData.success) {
                    document.getElementById('streaming').textContent = streamData.streaming.active;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function navigate(url) {
            window.location.href = url;
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');

            switch(tab) {
                case 'games':
                    navigate('/mobile-sportsbook-app.html');
                    break;
                case 'bets':
                    navigate('/parlay-builder.html');
                    break;
                case 'menu':
                    navigate('/services-index.html');
                    break;
            }
        }

        // Load stats on page load
        window.addEventListener('load', () => {
            loadStats();
            setInterval(loadStats, 30000);
        });

        // Detect if running as PWA
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('Running as PWA');
        }
    </script>
</body>
</html>
