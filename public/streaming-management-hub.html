
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Management Hub | Young Meeat LLC</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 20px;
            border-radius: 25px;
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }

        .status-card:hover {
            border-color: #6366f1;
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .status-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .status-value {
            font-size: 36px;
            font-weight: 700;
            color: #22c55e;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s;
        }

        .service-card:hover {
            border-color: #6366f1;
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .service-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .service-icon {
            font-size: 48px;
            margin-right: 15px;
        }

        .service-info h3 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #6366f1;
        }

        .service-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 5px;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .service-description {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .service-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .metrics-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .metrics-section h2 {
            color: #6366f1;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .metric-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #6366f1;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .status-grid,
            .service-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 Streaming Management Hub</h1>
        <p>Comprehensive Streaming & Management Services Platform</p>
        <span class="fcc-badge">FCC Entity: 20130314143016</span>
        <div style="margin-top: 15px;">
            <span class="live-indicator">
                <span class="pulse-dot"></span>
                All Systems Live
            </span>
        </div>
    </div>

    <div class="container">
        <!-- Status Overview -->
        <div class="status-grid">
            <div class="status-card">
                <div class="status-label">Active Streams</div>
                <div class="status-value" id="activeStreams">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">Total Services</div>
                <div class="status-value" id="totalServices">12</div>
            </div>
            <div class="status-card">
                <div class="status-label">Connected Users</div>
                <div class="status-value" id="connectedUsers">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">System Health</div>
                <div class="status-value" style="font-size: 28px;" id="systemHealth">100%</div>
            </div>
        </div>

        <!-- Streaming Services -->
        <div class="metrics-section">
            <h2>🎬 Streaming Services</h2>
            <div class="service-grid" id="streamingServices"></div>
        </div>

        <!-- Management Services -->
        <div class="metrics-section">
            <h2>⚙️ Management Services</h2>
            <div class="service-grid" id="managementServices"></div>
        </div>
    </div>

    <script>
        const streamingServicesData = [
            {
                icon: '📺',
                name: 'Live Sportsbook Streaming',
                description: 'Real-time sports betting with live stream integration',
                endpoint: '/index.html',
                features: ['NFL', 'NBA', 'MLB', 'NHL']
            },
            {
                icon: '🏈',
                name: 'PS5 Gaming Streams',
                description: 'Madden, NBA 2K, UFC gaming integration',
                endpoint: '/ps5-betting.html',
                features: ['Madden NFL', 'NBA 2K', 'UFC 5']
            },
            {
                icon: '📻',
                name: 'Sports Radio Hub',
                description: 'Live audio broadcasts for all major sports',
                endpoint: '/sports-radio-hub.html',
                features: ['All Teams', 'All Leagues', 'Live Commentary']
            },
            {
                icon: '🎮',
                name: 'Amazon Prime Integration',
                description: 'Video streaming with bet-to-watch access',
                endpoint: '/streaming/partners',
                features: ['NFL', 'NBA', 'On-Demand']
            },
            {
                icon: '🏀',
                name: 'NBA Direct Streams',
                description: 'Official NBA.com integration',
                endpoint: '/streaming/nba/direct',
                features: ['Live Games', 'Replays', 'Highlights']
            },
            {
                icon: '📡',
                name: 'All Sports Streams',
                description: 'Comprehensive multi-sport streaming',
                endpoint: '/all-sports-streams.html',
                features: ['4 Major Leagues', 'Live Updates']
            }
        ];

        const managementServicesData = [
            {
                icon: '📱',
                name: 'Phone Control Network',
                description: 'Remote management via authorized devices',
                endpoint: '/phone-network-control.html',
                features: ['Remote Access', 'WiFi Control']
            },
            {
                icon: '🔐',
                name: 'SSO Plugin Manager',
                description: 'Multi-provider authentication system',
                endpoint: '/sso-plugin-dashboard.html',
                features: ['6 Providers', 'Secure Auth']
            },
            {
                icon: '☁️',
                name: 'AWS Backup System',
                description: 'Cloud backup and data management',
                endpoint: '/backup-dashboard.html',
                features: ['S3 Storage', 'Auto Sync']
            },
            {
                icon: '📊',
                name: 'Traffic Analytics',
                description: 'Real-time traffic monitoring',
                endpoint: '/traffic-analytics.html',
                features: ['Live Metrics', 'Visitor Tracking']
            },
            {
                icon: '🌐',
                name: 'Web3 Bridge',
                description: 'Blockchain integration services',
                endpoint: '/web3-bridge.html',
                features: ['Crypto Wallets', 'Transactions']
            },
            {
                icon: '🔒',
                name: 'VPN Service',
                description: 'Secure connection management',
                endpoint: '/vpn-dashboard.html',
                features: ['IP Management', 'Secure Routing']
            }
        ];

        function renderServices(services, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = services.map(service => `
                <div class="service-card">
                    <div class="service-header">
                        <div class="service-icon">${service.icon}</div>
                        <div class="service-info">
                            <h3>${service.name}</h3>
                            <span class="service-status status-active">● Active</span>
                        </div>
                    </div>
                    <div class="service-description">${service.description}</div>
                    <div style="margin-bottom: 15px;">
                        ${service.features.map(f => `<span style="background: rgba(99, 102, 241, 0.2); color: #a5b4fc; padding: 4px 10px; border-radius: 12px; font-size: 11px; margin-right: 5px; display: inline-block; margin-bottom: 5px;">${f}</span>`).join('')}
                    </div>
                    <div class="service-actions">
                        <button class="btn btn-success" onclick="openService('${service.endpoint}')">Launch</button>
                        <button class="btn btn-info" onclick="viewMetrics('${service.name}')">Metrics</button>
                    </div>
                </div>
            `).join('');
        }

        function openService(endpoint) {
            window.open(window.API_BASE + endpoint, '_blank');
        }

        function viewMetrics(serviceName) {
            alert(`Viewing metrics for ${serviceName}`);
        }

        async function loadSystemMetrics() {
            try {
                const [coreRes, partnersRes] = await Promise.all([
                    fetch(`${window.API_BASE}/api/core/status`),
                    fetch(`${window.API_BASE}/streaming/partners`)
                ]);

                const coreData = await coreRes.json();
                const partnersData = await partnersRes.json();

                document.getElementById('activeStreams').textContent = partnersData.count || 0;
                document.getElementById('connectedUsers').textContent = coreData.core?.active || 0;

                const healthPercent = coreData.core 
                    ? Math.round((coreData.core.active / coreData.core.total) * 100)
                    : 100;
                document.getElementById('systemHealth').textContent = `${healthPercent}%`;
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        // Initialize
        renderServices(streamingServicesData, 'streamingServices');
        renderServices(managementServicesData, 'managementServices');
        loadSystemMetrics();

        // Auto-refresh metrics
        setInterval(loadSystemMetrics, 10000);
    </script>
</body>
</html>
