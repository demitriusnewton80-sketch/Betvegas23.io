
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Relationships Workflow | 20130314143016 Inc.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .status-value {
            font-size: 42px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .status-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .workflow-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }

        .workflow-section h2 {
            color: #fbbf24;
            font-size: 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mapping-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #22c55e;
        }

        .mapping-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .structure-name {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }

        .power-badge {
            background: #22c55e;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        .relationship-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .relationship-tag {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1e3a8a;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }

        .recommendations {
            max-height: 400px;
            overflow-y: auto;
        }

        .recommendation-card {
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .rec-title {
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 8px;
        }

        .rec-action {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Functional Relationships Workflow</h1>
            <p style="color: rgba(255, 255, 255, 0.9); margin-top: 10px;">
                Bridging Functional Structures with Business Relationships
            </p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <div class="status-grid" id="statusGrid"></div>

        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="btn" onclick="createOpportunity()">💼 Create Opportunity</button>
        </div>

        <div class="workflow-section">
            <h2>🗺️ Relationship Mappings</h2>
            <div id="mappingsContainer"></div>
        </div>

        <div class="workflow-section">
            <h2>💡 Workflow Recommendations</h2>
            <div class="recommendations" id="recommendationsContainer"></div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        const API_BASE = window.location.origin;

        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/functional-relationships-bridge/status`);
                const data = await response.json();

                if (data.success) {
                    const statusHtml = `
                        <div class="status-card">
                            <div class="status-value">${data.functionalStructures.total}</div>
                            <div class="status-label">Functional Structures</div>
                        </div>
                        <div class="status-card">
                            <div class="status-value">${data.functionalStructures.operational}</div>
                            <div class="status-label">Operational</div>
                        </div>
                        <div class="status-card">
                            <div class="status-value">${data.businessRelationships.contacts}</div>
                            <div class="status-label">Business Contacts</div>
                        </div>
                        <div class="status-card">
                            <div class="status-value">${data.businessRelationships.opportunities}</div>
                            <div class="status-label">Opportunities</div>
                        </div>
                    `;
                    document.getElementById('statusGrid').innerHTML = statusHtml;
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadMappings() {
            try {
                const response = await fetch(`${API_BASE}/functional-relationships-bridge/relationship-mapping`);
                const data = await response.json();

                if (data.success && data.mapping.length > 0) {
                    const mappingsHtml = data.mapping.map(map => `
                        <div class="mapping-card">
                            <div class="mapping-header">
                                <div class="structure-name">${map.structure.name}</div>
                                <div class="power-badge">${map.structure.powerLevel}% Power</div>
                            </div>
                            <div style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 10px;">
                                ${map.structure.modules} modules
                            </div>
                            <div class="relationship-list">
                                ${map.relatedContacts.map(c => 
                                    `<span class="relationship-tag">${c.name} - ${c.company}</span>`
                                ).join('')}
                                ${map.relatedContacts.length === 0 ? 
                                    '<span class="relationship-tag">No direct relationships</span>' : ''}
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('mappingsContainer').innerHTML = mappingsHtml;
                } else {
                    document.getElementById('mappingsContainer').innerHTML = 
                        '<p style="color: rgba(255,255,255,0.7);">No mappings available</p>';
                }
            } catch (error) {
                console.error('Error loading mappings:', error);
            }
        }

        async function loadRecommendations() {
            try {
                const response = await fetch(`${API_BASE}/functional-relationships-bridge/recommendations`);
                const data = await response.json();

                if (data.success && data.recommendations.length > 0) {
                    const recsHtml = data.recommendations.map(rec => `
                        <div class="recommendation-card">
                            <div class="rec-title">${rec.structure}</div>
                            <div class="rec-action">
                                <strong>💡 ${rec.recommendation}</strong><br>
                                Suggested Action: ${rec.suggestedAction}<br>
                                Power Level: ${rec.powerLevel}%
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('recommendationsContainer').innerHTML = recsHtml;
                } else {
                    document.getElementById('recommendationsContainer').innerHTML = 
                        '<p style="color: rgba(255,255,255,0.7);">No recommendations at this time</p>';
                }
            } catch (error) {
                console.error('Error loading recommendations:', error);
            }
        }

        function createOpportunity() {
            alert('Opportunity creation dialog would open here.\n\nIn production, this would allow you to:\n- Select a functional structure\n- Choose a business contact\n- Set opportunity value and details');
        }

        async function refreshData() {
            await Promise.all([
                loadStatus(),
                loadMappings(),
                loadRecommendations()
            ]);
        }

        // Initial load
        refreshData();

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
