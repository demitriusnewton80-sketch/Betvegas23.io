
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Sports Betting - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #003087 0%, #0070cc 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            color: #003087;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .ps-icon {
            font-size: 48px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-badge {
            background: #f3f4f6;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            color: #1f2937;
        }
        .wallet-display {
            background: #22c55e;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
        }
        .points-badge {
            background: #f59e0b;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
        }
        .enrollment-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .enrollment-section h2 {
            color: #003087;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #1f2937;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn {
            background: #003087;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #0070cc;
            transform: translateY(-2px);
        }
        .btn-deposit {
            background: #22c55e;
        }
        .btn-deposit:hover {
            background: #16a34a;
        }
        .game-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .game-type-btn {
            background: white;
            border: 3px solid transparent;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .game-type-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .game-type-btn.active {
            border-color: #003087;
            background: #eff6ff;
        }
        .game-type-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .game-type-name {
            font-weight: 600;
            color: #1f2937;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .game-title {
            color: #003087;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .team {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }
        .vs {
            color: #6b7280;
            font-weight: 600;
        }
        .odds-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .odds-btn {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .odds-btn:hover {
            background: #e5e7eb;
        }
        .odds-btn.selected {
            background: #003087;
            color: white;
            border-color: #003087;
        }
        .odds-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }
        .odds-value {
            font-size: 20px;
            font-weight: bold;
        }
        .bet-amount {
            margin-bottom: 15px;
        }
        .bet-amount input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
            margin-top: 10px;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-upcoming {
            background: #fef3c7;
            color: #92400e;
        }
        .status-live {
            background: #dcfce7;
            color: #166534;
        }
        .my-bets {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .my-bets h2 {
            color: #003087;
            margin-bottom: 20px;
        }
        .bet-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #003087;
        }
        .hidden {
            display: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="ps-icon">🎮</span>
                PlayStation 5 Sports Betting
            </h1>
            <p>Bet on Madden, NBA 2K, UFC, Undisputed & 5v5 Basketball</p>
            <div class="header-info" id="userInfo" style="display: none;">
                <span class="user-badge" id="userDisplay"></span>
                <span class="wallet-display">💰 $<span id="walletBalance">0.00</span></span>
                <span class="points-badge">⭐ <span id="enrollmentPoints">0</span> Points</span>
                <button class="btn btn-deposit" onclick="showDepositModal()">Deposit Funds</button>
            </div>
        </div>

        <div class="enrollment-section" id="enrollmentSection">
            <h2>🎯 Enroll to Start Betting</h2>
            <div class="form-group">
                <label>PSN ID:</label>
                <input type="text" id="psnId" placeholder="Enter your PlayStation Network ID">
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <button class="btn" onclick="enrollUser()">Enroll Now - Get 100 Points!</button>
        </div>

        <div id="bettingSection" class="hidden">
            <div class="game-types">
                <div class="game-type-btn active" onclick="filterGames('all')">
                    <div class="game-type-icon">🏆</div>
                    <div class="game-type-name">All Games</div>
                </div>
                <div class="game-type-btn" onclick="filterGames('madden')">
                    <div class="game-type-icon">🏈</div>
                    <div class="game-type-name">Madden NFL</div>
                </div>
                <div class="game-type-btn" onclick="filterGames('nba2k')">
                    <div class="game-type-icon">🏀</div>
                    <div class="game-type-name">NBA 2K</div>
                </div>
                <div class="game-type-btn" onclick="filterGames('ufc')">
                    <div class="game-type-icon">🥋</div>
                    <div class="game-type-name">UFC</div>
                </div>
                <div class="game-type-btn" onclick="filterGames('undisputed')">
                    <div class="game-type-icon">🥊</div>
                    <div class="game-type-name">Undisputed</div>
                </div>
                <div class="game-type-btn" onclick="filterGames('5v5-basketball')">
                    <div class="game-type-icon">⛹️</div>
                    <div class="game-type-name">5v5 Basketball</div>
                </div>
            </div>

            <div class="games-grid" id="gamesGrid">
                <!-- Games will be loaded here -->
            </div>

            <div class="my-bets">
                <h2>📊 My Bets</h2>
                <div id="myBetsList">
                    <p style="color: #6b7280;">No bets placed yet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <h2 style="color: #003087; margin-bottom: 20px;">💰 Deposit Funds</h2>
            <div class="form-group">
                <label>Amount:</label>
                <input type="number" id="depositAmount" placeholder="Enter amount" min="10" step="10">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" onclick="processDeposit()">Deposit</button>
                <button class="btn" style="background: #6b7280;" onclick="closeDepositModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;
        let currentFilter = 'all';
        let selectedBets = new Map();

        async function enrollUser() {
            const psnId = document.getElementById('psnId').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            if (!psnId || !username || !email) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/ps5/enroll`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ psnId, username, email })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('ps5UserId', currentUser.id);
                    showBettingInterface();
                    loadGames();
                    alert(`Welcome ${username}! You've been enrolled with 100 points!`);
                } else {
                    alert(data.error || 'Enrollment failed');
                }
            } catch (error) {
                alert('Error enrolling user: ' + error.message);
            }
        }

        function showBettingInterface() {
            document.getElementById('enrollmentSection').classList.add('hidden');
            document.getElementById('bettingSection').classList.remove('hidden');
            document.getElementById('userInfo').style.display = 'flex';
            updateUserDisplay();
        }

        function updateUserDisplay() {
            if (!currentUser) return;
            document.getElementById('userDisplay').textContent = `🎮 ${currentUser.username}`;
            document.getElementById('walletBalance').textContent = currentUser.walletBalance.toFixed(2);
            loadUserData();
        }

        async function loadUserData() {
            try {
                const response = await fetch(`${API_BASE}/ps5/user/${currentUser.id}`);
                const data = await response.json();
                
                currentUser = data.user;
                document.getElementById('walletBalance').textContent = currentUser.walletBalance.toFixed(2);
                document.getElementById('enrollmentPoints').textContent = data.enrollmentPoints;
                
                loadUserBets();
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        async function loadGames() {
            try {
                const url = currentFilter === 'all' 
                    ? `${API_BASE}/ps5/games`
                    : `${API_BASE}/ps5/games?type=${currentFilter}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                displayGames(data.games);
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        function displayGames(games) {
            const grid = document.getElementById('gamesGrid');
            
            if (games.length === 0) {
                grid.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No games available for this category</p>';
                return;
            }

            grid.innerHTML = games.map(game => `
                <div class="game-card">
                    <div class="game-title">${game.title}</div>
                    <div class="matchup">
                        <span class="team">${game.homeTeam}</span>
                        <span class="vs">VS</span>
                        <span class="team">${game.awayTeam}</span>
                    </div>
                    <div class="odds-row">
                        <div class="odds-btn" onclick="selectTeam('${game.id}', 'home', ${game.odds.home})">
                            <div class="odds-label">${game.homeTeam}</div>
                            <div class="odds-value">${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                        </div>
                        <div class="odds-btn" onclick="selectTeam('${game.id}', 'away', ${game.odds.away})">
                            <div class="odds-label">${game.awayTeam}</div>
                            <div class="odds-value">${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                        </div>
                    </div>
                    <div class="bet-amount" id="bet-${game.id}" style="display: none;">
                        <input type="number" placeholder="Bet amount" min="1" step="1" id="amount-${game.id}">
                        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="placeBet('${game.id}')">Place Bet</button>
                    </div>
                    <div class="game-info">
                        <span>${new Date(game.startTime).toLocaleString()}</span>
                        <span class="status-badge status-${game.status}">${game.status}</span>
                    </div>
                    ${game.streamUrl ? `<div style="margin-top: 10px;"><a href="${game.streamUrl}" target="_blank" style="color: #003087; font-size: 12px;">📺 Watch Stream</a></div>` : ''}
                </div>
            `).join('');
        }

        function selectTeam(gameId, team, odds) {
            selectedBets.set(gameId, { team, odds });
            document.getElementById(`bet-${gameId}`).style.display = 'block';
            
            // Update button states
            const card = event.target.closest('.game-card');
            card.querySelectorAll('.odds-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.odds-btn').classList.add('selected');
        }

        async function placeBet(gameId) {
            if (!currentUser) {
                alert('Please enroll first');
                return;
            }

            const betInfo = selectedBets.get(gameId);
            if (!betInfo) {
                alert('Please select a team first');
                return;
            }

            const amount = parseFloat(document.getElementById(`amount-${gameId}`).value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/ps5/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        gameId,
                        team: betInfo.team,
                        amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`Bet placed! You earned 10 points. Potential payout: $${data.bet.potentialPayout.toFixed(2)}`);
                    document.getElementById(`amount-${gameId}`).value = '';
                    document.getElementById(`bet-${gameId}`).style.display = 'none';
                    selectedBets.delete(gameId);
                    loadUserData();
                } else {
                    alert(data.error || 'Failed to place bet');
                }
            } catch (error) {
                alert('Error placing bet: ' + error.message);
            }
        }

        async function loadUserBets() {
            try {
                const response = await fetch(`${API_BASE}/ps5/user/${currentUser.id}/bets`);
                const data = await response.json();
                
                const betsList = document.getElementById('myBetsList');
                
                if (data.bets.length === 0) {
                    betsList.innerHTML = '<p style="color: #6b7280;">No bets placed yet</p>';
                    return;
                }

                betsList.innerHTML = data.bets.map(bet => `
                    <div class="bet-item">
                        <div><strong>Game:</strong> ${bet.gameId}</div>
                        <div><strong>Team:</strong> ${bet.team}</div>
                        <div><strong>Amount:</strong> $${bet.amount.toFixed(2)}</div>
                        <div><strong>Odds:</strong> ${bet.odds > 0 ? '+' : ''}${bet.odds}</div>
                        <div><strong>Potential Payout:</strong> $${bet.potentialPayout.toFixed(2)}</div>
                        <div><strong>Status:</strong> ${bet.status}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading bets:', error);
            }
        }

        function filterGames(type) {
            currentFilter = type;
            document.querySelectorAll('.game-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.game-type-btn').classList.add('active');
            loadGames();
        }

        function showDepositModal() {
            document.getElementById('depositModal').classList.add('active');
        }

        function closeDepositModal() {
            document.getElementById('depositModal').classList.remove('active');
        }

        async function processDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            
            if (!amount || amount < 10) {
                alert('Minimum deposit is $10');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/ps5/user/${currentUser.id}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`Deposit successful! New balance: $${data.newBalance.toFixed(2)}`);
                    closeDepositModal();
                    loadUserData();
                } else {
                    alert(data.error || 'Deposit failed');
                }
            } catch (error) {
                alert('Error processing deposit: ' + error.message);
            }
        }

        // Check for existing user on load
        window.addEventListener('load', async () => {
            const savedUserId = localStorage.getItem('ps5UserId');
            if (savedUserId) {
                try {
                    const response = await fetch(`${API_BASE}/ps5/user/${savedUserId}`);
                    const data = await response.json();
                    
                    if (response.ok) {
                        currentUser = data.user;
                        showBettingInterface();
                        loadGames();
                    }
                } catch (error) {
                    console.log('No existing user found');
                }
            }
        });
    </script>
</body>
</html>
