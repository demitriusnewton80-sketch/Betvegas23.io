
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PlayStation 5 Game Betting | WiFi Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #003087 0%, #0070cc 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .wifi-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            z-index: 100;
        }

        .wifi-icon {
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-section {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .auth-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-btn {
            background: #00d9ff;
            color: #003087;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #00c4e6;
            transform: scale(1.05);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .platform-badge {
            background: #00d9ff;
            color: #003087;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .game-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .game-status.live {
            background: rgba(255, 0, 0, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .odds-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }

        .odds-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .odds-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        .odds-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .odds-value {
            font-size: 20px;
            font-weight: 700;
            color: #00d9ff;
        }

        .watch-btn {
            background: #00d9ff;
            color: #003087;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
        }

        .fcc-badge {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid rgba(0, 255, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #003087 0%, #0070cc 100%);
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .btn-primary {
            width: 100%;
            background: #00d9ff;
            color: #003087;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }

        .btn-cancel {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="wifi-status" id="wifiStatus">
        <span class="wifi-icon">📶</span>
        <span>WiFi Core Active</span>
    </div>

    <div class="header">
        <div class="logo">
            <span>🎮</span>
            <span>PlayStation 5 Game Betting</span>
        </div>
    </div>

    <div class="container">
        <div class="auth-section">
            <div class="auth-status">
                <div>
                    <div style="font-size: 14px; opacity: 0.9;">Authentication Status</div>
                    <div id="authStatus" style="font-size: 18px; font-weight: 700; margin-top: 4px;">Not Logged In</div>
                </div>
                <button class="login-btn" id="loginBtn" onclick="login()">
                    🔐 SSO Login
                </button>
            </div>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Games will be loaded here -->
        </div>
    </div>

    <div class="modal" id="betModal">
        <div class="modal-content">
            <h2 class="modal-title">Place Your Bet</h2>
            <div id="betDetails"></div>
            <div class="input-group">
                <label class="input-label">Bet Amount ($)</label>
                <input type="number" id="betAmount" placeholder="Enter amount" min="1" step="0.01">
            </div>
            <button class="btn-primary" onclick="placeBet()">Place Bet</button>
            <button class="btn-cancel" onclick="closeBetModal()">Cancel</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;
        let currentBet = null;

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`);
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    document.getElementById('authStatus').textContent = `Logged in as ${data.user.email}`;
                    document.getElementById('loginBtn').textContent = '✓ Logged In';
                    document.getElementById('loginBtn').onclick = logout;
                } else {
                    currentUser = null;
                }
            } catch (error) {
                currentUser = null;
            }
        }

        async function checkWiFi() {
            try {
                const response = await fetch(`${API_BASE}/playstation/wifi/status`);
                const data = await response.json();
                document.getElementById('wifiStatus').innerHTML = `
                    <span class="wifi-icon">📶</span>
                    <span>${data.protocol} - ${data.bandwidth}</span>
                `;
            } catch (error) {
                console.error('WiFi check failed:', error);
            }
        }

        async function loadGames() {
            try {
                const response = await fetch(`${API_BASE}/playstation/games`);
                const data = await response.json();
                renderGames(data.games);
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map(game => `
                <div class="game-card">
                    <div class="platform-badge">🎮 ${game.platform}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="game-status ${game.status}">
                        ${game.status === 'live' ? '<span class="live-dot"></span>' : ''}
                        <span>${game.status.toUpperCase()}</span>
                    </div>
                    <div class="odds-container">
                        <div class="odds-btn" onclick="selectBet('${game.id}', 'team1', ${game.odds.team1})">
                            <div class="odds-label">Team 1</div>
                            <div class="odds-value">${formatOdds(game.odds.team1)}</div>
                        </div>
                        <div class="odds-btn" onclick="selectBet('${game.id}', 'team2', ${game.odds.team2})">
                            <div class="odds-label">Team 2</div>
                            <div class="odds-value">${formatOdds(game.odds.team2)}</div>
                        </div>
                    </div>
                    ${game.status === 'live' ? `<button class="watch-btn" onclick="watchStream('${game.streamUrl}')">📺 Watch Live Stream</button>` : ''}
                    <div class="fcc-badge">
                        ✓ FCC Compliant Streaming • WiFi Core Enabled
                    </div>
                </div>
            `).join('');
        }

        function formatOdds(odds) {
            return odds > 0 ? `+${odds}` : odds;
        }

        function selectBet(gameId, team, odds) {
            if (!currentUser) {
                alert('Please log in with SSO to place bets');
                login();
                return;
            }

            currentBet = { gameId, team, odds };
            document.getElementById('betDetails').innerHTML = `
                <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 4px;">Game ID: ${gameId}</div>
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 4px;">Selection: ${team}</div>
                    <div style="font-size: 18px; font-weight: 700; color: #00d9ff;">Odds: ${formatOdds(odds)}</div>
                </div>
            `;
            document.getElementById('betModal').classList.add('active');
        }

        function closeBetModal() {
            document.getElementById('betModal').classList.remove('active');
            currentBet = null;
        }

        async function placeBet() {
            if (!currentBet) return;

            const amount = parseFloat(document.getElementById('betAmount').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/playstation/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameId: currentBet.gameId,
                        team: currentBet.team,
                        amount: amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Bet placed successfully!\n\nBet ID: ${data.betId}\nStream Access: Granted`);
                    closeBetModal();
                    if (data.streamAccess.ps5DirectStream) {
                        watchStream(data.streamAccess.ps5DirectStream);
                    }
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Bet placement error:', error);
                alert('Failed to place bet');
            }
        }

        function watchStream(streamUrl) {
            window.open(`/stream-viewer.html?gameId=${streamUrl.split('/').pop()}&userId=${currentUser?.id || 'guest'}`, '_blank');
        }

        function login() {
            window.location.href = `${API_BASE}/auth/login`;
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/auth/logout`, { method: 'POST' });
                window.location.reload();
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            checkWiFi();
            loadGames();
            setInterval(checkWiFi, 5000);
        });
    </script>
</body>
</html>
