
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Sports Intelligence - ESPN Data & Mapping</title>
    <script src="/js/api-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
            margin: 5px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        #map {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }
        .game-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
        }
        .league-badge {
            background: #3b82f6;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
        }
        .venue-btn {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
        }
        .venue-btn:hover {
            background: #22c55e;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌎 Public Sports Intelligence</h1>
        <p style="font-size: 16px; margin: 10px 0;">ESPN Data • Google Maps • Live Tracking</p>
        <div>
            <span class="badge">PUBLIC ACCESS</span>
            <span class="badge">FCC: 20130314143016</span>
            <span class="badge">PORT: 5000</span>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">Total Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="liveGames">0</div>
                <div class="stat-label">Live Now</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="upcomingGames">0</div>
                <div class="stat-label">Upcoming</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="venues">0</div>
                <div class="stat-label">Venues Tracked</div>
            </div>
        </div>

        <h2 style="margin-bottom: 20px; font-size: 24px;">📍 Live Venue Map</h2>
        <div id="map"></div>

        <h2 style="margin: 30px 0 20px; font-size: 24px;">🏆 Live & Upcoming Games</h2>
        <div id="gamesContainer" class="games-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading ESPN data...</p>
            </div>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFw0Qbyq9zTrrZINs7qkS8VwGQrAqWXP0"></script>
    <script>
        let map;
        let markers = [];

        async function loadSportsIntel() {
            try {
                const response = await fetch(`${API_BASE}/public-sports-intel/dashboard`);
                const data = await response.json();

                if (data.success) {
                    updateStats(data.intelligence);
                    displayGames(data.intelligence.live, data.intelligence.upcoming);
                    initMap(data.intelligence.live);
                }
            } catch (error) {
                console.error('Error loading sports intel:', error);
            }
        }

        async function loadVenueMap() {
            try {
                const response = await fetch(`${API_BASE}/public-sports-intel/venues/map`);
                const data = await response.json();

                if (data.success && data.venues) {
                    updateMapMarkers(data.venues);
                }
            } catch (error) {
                console.error('Error loading venue map:', error);
            }
        }

        function initMap(games) {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 39.8283, lng: -98.5795 },
                zoom: 4,
                styles: [
                    { elementType: 'geometry', stylers: [{ color: '#1e293b' }] },
                    { elementType: 'labels.text.stroke', stylers: [{ color: '#0f172a' }] },
                    { elementType: 'labels.text.fill', stylers: [{ color: '#3b82f6' }] }
                ]
            });

            games.forEach(game => {
                if (game.location) {
                    const marker = new google.maps.Marker({
                        position: game.location,
                        map: map,
                        title: `${game.matchup} - ${game.venue}`,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 10,
                            fillColor: '#ef4444',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 2
                        }
                    });

                    const infoWindow = new google.maps.InfoWindow({
                        content: `
                            <div style="color: #000; padding: 10px;">
                                <h3>${game.league}</h3>
                                <p><strong>${game.matchup}</strong></p>
                                <p>${game.venue}</p>
                                <p>Status: ${game.status}</p>
                            </div>
                        `
                    });

                    marker.addListener('click', () => {
                        infoWindow.open(map, marker);
                    });

                    markers.push(marker);
                }
            });
        }

        function updateMapMarkers(venues) {
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            venues.forEach(venue => {
                if (venue.coordinates) {
                    const marker = new google.maps.Marker({
                        position: venue.coordinates,
                        map: map,
                        title: `${venue.matchup} - ${venue.venue}`,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: venue.status === 'live' ? '#ef4444' : '#3b82f6',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 2
                        }
                    });

                    markers.push(marker);
                }
            });
        }

        function updateStats(intelligence) {
            document.getElementById('totalGames').textContent = 
                intelligence.live.length + intelligence.upcoming.length;
            document.getElementById('liveGames').textContent = intelligence.live.length;
            document.getElementById('upcomingGames').textContent = intelligence.upcoming.length;
            document.getElementById('venues').textContent = 
                [...new Set([...intelligence.live, ...intelligence.upcoming].map(g => g.venue))].length;
        }

        function displayGames(liveGames, upcomingGames) {
            const container = document.getElementById('gamesContainer');
            const allGames = [...liveGames, ...upcomingGames];

            container.innerHTML = allGames.map(game => `
                <div class="game-card">
                    <span class="league-badge">${game.league}</span>
                    <h3 style="margin: 10px 0;">${game.matchup}</h3>
                    <p style="opacity: 0.8; font-size: 14px; margin-bottom: 10px;">
                        📍 ${game.venue}
                    </p>
                    ${game.score ? `
                        <div style="font-size: 24px; font-weight: 700; margin: 10px 0;">
                            ${game.score.away} - ${game.score.home}
                        </div>
                    ` : `
                        <div style="opacity: 0.7; font-size: 13px;">
                            ${new Date(game.scheduledTime).toLocaleString()}
                        </div>
                    `}
                    <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                        <strong>Status:</strong> ${game.status.toUpperCase()}
                    </div>
                    <button class="venue-btn" onclick="focusVenue(${game.location?.lat}, ${game.location?.lng})">
                        View on Map
                    </button>
                </div>
            `).join('');
        }

        function focusVenue(lat, lng) {
            if (lat && lng && map) {
                map.setCenter({ lat, lng });
                map.setZoom(12);
            }
        }

        window.addEventListener('load', () => {
            loadSportsIntel();
            setInterval(loadSportsIntel, 30000);
        });
    </script>
</body>
</html>
