
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mobile Sportsbook App - Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(59, 130, 246, 0.05) 35px, rgba(59, 130, 246, 0.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(139, 92, 246, 0.05) 35px, rgba(139, 92, 246, 0.05) 70px);
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Mobile App Header */
        .mobile-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .mobile-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .mobile-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(30, 41, 59, 0.8);
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content-section {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Game Cards */
        .games-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .game-card:active {
            transform: scale(0.98);
            border-color: #3b82f6;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .sport-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .matchup {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-weight: 700;
            font-size: 14px;
            margin-top: 8px;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .vs-text {
            font-size: 16px;
            font-weight: 700;
            opacity: 0.6;
            padding: 0 15px;
        }

        .odds-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .odds-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.4);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .odds-btn:active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .odds-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .odds-value {
            font-size: 18px;
            font-weight: 700;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 480px;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(59, 130, 246, 0.3);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px 0;
        }

        .nav-item {
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 15px;
            margin: 20px;
            text-align: center;
        }

        .retry-btn {
            background: #3b82f6;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .retry-btn:active {
            background: #2563eb;
        }

        /* FCC Badge */
        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mobile-header">
            <h1>🏆 Sportsbook</h1>
            <p>Young Meeat LLC • Live Betting</p>
            <div style="margin-top: 10px;">
                <span class="fcc-badge">FCC: 20130314143016</span>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">Online</span>
            </div>
            <div class="status-indicator">
                <span id="connectionType">HTTPS</span>
            </div>
        </div>

        <div class="content-section">
            <div class="section-title">
                🔥 Live Games
            </div>

            <div id="gamesContainer" class="games-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading games...</p>
                </div>
            </div>
        </div>

        <div style="height: 80px;"></div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="showSection('games')">
                <div class="nav-icon">🏈</div>
                <div class="nav-label">Games</div>
            </div>
            <div class="nav-item" onclick="showSection('bets')">
                <div class="nav-icon">🎯</div>
                <div class="nav-label">My Bets</div>
            </div>
            <div class="nav-item" onclick="showSection('wallet')">
                <div class="nav-icon">💰</div>
                <div class="nav-label">Wallet</div>
            </div>
            <div class="nav-item" onclick="showSection('menu')">
                <div class="nav-icon">☰</div>
                <div class="nav-label">Menu</div>
            </div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        let isLoading = false;
        let retryCount = 0;
        const MAX_RETRIES = 3;

        async function loadGames() {
            const container = document.getElementById('gamesContainer');
            
            if (isLoading) return;
            isLoading = true;

            try {
                updateStatus('Loading...', 'warning');
                
                console.log('🔄 Fetching games from:', `${API_BASE}/sportsbook/games`);
                
                const response = await fetch(`${API_BASE}/mobile/games`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Response error:', errorText);
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('✅ Data received:', data);
                
                if (data.success && data.games && data.games.length > 0) {
                    displayGames(data.games);
                    updateStatus('Online', 'success');
                    retryCount = 0;
                } else {
                    throw new Error('No games available');
                }
            } catch (error) {
                console.error('❌ Error loading games:', error);
                showError(error.message);
                updateStatus('Error', 'error');
            } finally {
                isLoading = false;
            }
        }

        function displayGames(games) {
            const container = document.getElementById('gamesContainer');
            
            container.innerHTML = games.slice(0, 10).map(game => `
                <div class="game-card">
                    <div class="game-header">
                        <span class="sport-badge">${game.sport}</span>
                        <span style="font-size: 11px; opacity: 0.7;">${formatTime(game.startTime)}</span>
                    </div>
                    
                    <div class="matchup">
                        <div class="team">
                            <div class="team-logo">🏈</div>
                            <div class="team-name">${game.homeTeam}</div>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="team">
                            <div class="team-logo">🏈</div>
                            <div class="team-name">${game.awayTeam}</div>
                        </div>
                    </div>

                    <div class="odds-container">
                        <div class="odds-btn" onclick="selectBet('${game.id}', 'home')">
                            <div class="odds-label">Home</div>
                            <div class="odds-value">${game.odds.home > 0 ? '+' : ''}${game.odds.home}</div>
                        </div>
                        <div class="odds-btn" onclick="selectBet('${game.id}', 'away')">
                            <div class="odds-label">Away</div>
                            <div class="odds-value">${game.odds.away > 0 ? '+' : ''}${game.odds.away}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            const container = document.getElementById('gamesContainer');
            
            container.innerHTML = `
                <div class="error-message">
                    <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
                    <div style="font-weight: 700; margin-bottom: 8px;">Connection Error</div>
                    <div style="font-size: 12px; opacity: 0.8; margin-bottom: 15px;">${message}</div>
                    <button class="retry-btn" onclick="retryLoad()">
                        Retry (${retryCount}/${MAX_RETRIES})
                    </button>
                </div>
            `;
        }

        function retryLoad() {
            if (retryCount < MAX_RETRIES) {
                retryCount++;
                loadGames();
            } else {
                showError('Maximum retries reached. Please check your connection.');
            }
        }

        function updateStatus(text, type) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.querySelector('.status-dot');
            
            statusText.textContent = text;
            
            if (type === 'success') {
                statusDot.style.background = '#22c55e';
            } else if (type === 'warning') {
                statusDot.style.background = '#f59e0b';
            } else if (type === 'error') {
                statusDot.style.background = '#ef4444';
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function selectBet(gameId, team) {
            console.log(`Selected: Game ${gameId}, Team ${team}`);
            alert(`Bet selected! Game: ${gameId}, Team: ${team}\n\nLogin to place bets.`);
        }

        function showSection(section) {
            console.log(`Navigate to: ${section}`);
            
            if (section === 'games') {
                loadGames();
            } else {
                alert(`${section.charAt(0).toUpperCase() + section.slice(1)} section - Coming soon!`);
            }
        }

        // Auto-load on page load
        window.addEventListener('load', () => {
            setTimeout(loadGames, 500);
        });

        // Auto-refresh every 30 seconds
        setInterval(() => {
            if (!isLoading) {
                loadGames();
            }
        }, 30000);

        // Detect connection type
        if (window.location.protocol === 'https:') {
            document.getElementById('connectionType').textContent = 'HTTPS ✓';
        } else {
            document.getElementById('connectionType').textContent = 'HTTP';
        }
    </script>
</body>
</html>
