
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Structures | Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .stat-value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .structures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .structure-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .structure-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.3);
        }

        .structure-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(99, 102, 241, 0.2);
        }

        .structure-name {
            font-size: 22px;
            font-weight: 700;
        }

        .power-level {
            font-size: 28px;
            font-weight: 700;
            color: #22c55e;
        }

        .modules-list {
            list-style: none;
        }

        .module-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .module-name {
            font-weight: 600;
            color: #60a5fa;
        }

        .module-status {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: #22c55e;
            color: white;
        }

        .module-functions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .function-tag {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        .execute-section {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #a78bfa;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Functional Structures</h1>
            <p>Microsoft-Style Enterprise Architecture</p>
            <div class="fcc-badge">FCC Entity: 20130314143016</div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>
        <div class="structures-grid" id="structuresGrid"></div>

        <div class="execute-section">
            <h2 style="margin-bottom: 20px;">Execute Module Function</h2>
            
            <div class="form-group">
                <label>Module</label>
                <select id="moduleSelect"></select>
            </div>

            <div class="form-group">
                <label>Function</label>
                <select id="functionSelect"></select>
            </div>

            <div class="form-group">
                <label>Parameters (JSON)</label>
                <input type="text" id="params" placeholder='{"key": "value"}'>
            </div>

            <button class="btn" onclick="executeFunction()">Execute Function</button>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script>
        let allModules = [];

        async function loadStructures() {
            try {
                const [statusRes, structuresRes, modulesRes] = await Promise.all([
                    fetch(`${API_BASE}/functional-structures/status`),
                    fetch(`${API_BASE}/functional-structures/structures`),
                    fetch(`${API_BASE}/functional-structures/modules`)
                ]);

                const status = await statusRes.json();
                const structures = await structuresRes.json();
                const modules = await modulesRes.json();

                allModules = modules.modules;

                displayStats(status);
                displayStructures(structures.structures);
                populateModuleSelect();
            } catch (error) {
                console.error('Error loading structures:', error);
            }
        }

        function displayStats(status) {
            const stats = [
                { label: 'Total Structures', value: status.totalStructures },
                { label: 'Operational', value: status.operational },
                { label: 'Avg Power Level', value: status.averagePowerLevel + '%' }
            ];

            document.getElementById('statsGrid').innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }

        function displayStructures(structures) {
            document.getElementById('structuresGrid').innerHTML = structures.map(s => `
                <div class="structure-card">
                    <div class="structure-header">
                        <div class="structure-name">${s.name}</div>
                        <div class="power-level">${s.powerLevel}%</div>
                    </div>
                    <ul class="modules-list">
                        ${s.modules.map(m => `
                            <li class="module-item">
                                <div class="module-header">
                                    <span class="module-name">${m.name}</span>
                                    <span class="module-status status-${m.status}">${m.status}</span>
                                </div>
                                <div class="module-functions">
                                    ${m.functions.map(f => `<span class="function-tag">${f}</span>`).join('')}
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function populateModuleSelect() {
            const select = document.getElementById('moduleSelect');
            select.innerHTML = '<option value="">Select a module</option>' + 
                allModules.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        }

        document.getElementById('moduleSelect').addEventListener('change', (e) => {
            const module = allModules.find(m => m.id === e.target.value);
            if (module) {
                const functionSelect = document.getElementById('functionSelect');
                functionSelect.innerHTML = '<option value="">Select a function</option>' +
                    module.functions.map(f => `<option value="${f}">${f}</option>`).join('');
            }
        });

        async function executeFunction() {
            const moduleId = document.getElementById('moduleSelect').value;
            const functionName = document.getElementById('functionSelect').value;
            const params = document.getElementById('params').value;

            if (!moduleId || !functionName) {
                alert('Please select a module and function');
                return;
            }

            let parsedParams = {};
            if (params) {
                try {
                    parsedParams = JSON.parse(params);
                } catch {
                    parsedParams = { raw: params };
                }
            }

            try {
                const response = await fetch(`${API_BASE}/functional-structures/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ moduleId, functionName, params: parsedParams })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Function executed successfully!\nModule: ${data.module}\nFunction: ${data.function}`);
                } else {
                    alert('❌ ' + (data.error || 'Execution failed'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        loadStructures();
        setInterval(loadStructures, 30000);
    </script>
</body>
</html>
