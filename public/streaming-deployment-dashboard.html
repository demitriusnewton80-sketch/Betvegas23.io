<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Deployment Dashboard | Young Meeat LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        .fcc-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
        }
        .control-panel {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .btn-deploy {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        .btn-deploy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .deployments-list {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 30px;
        }
        .deployment-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #22c55e;
        }
        .deployment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .deployment-name {
            font-size: 20px;
            font-weight: 700;
        }
        .status-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .deployment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            font-size: 13px;
        }
        .detail-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        .detail-label {
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .detail-value {
            font-weight: 700;
            color: #3b82f6;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .checkbox-group {
            margin: 15px 0;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📡 Streaming Deployment Dashboard</h1>
            <p>Deploy streaming services to all sportsbooks with PS5 & Pickup Games</p>
            <span class="fcc-badge">FCC Entity: 20130314143016</span>
        </div>

        <div class="control-panel">
            <h2 style="margin-bottom: 20px;">🚀 Deployment Controls</h2>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="includePS5" checked>
                    <span>Include PlayStation 5 Game Integration</span>
                </label>
                <label>
                    <input type="checkbox" id="includePickupGames" checked>
                    <span>Include 5v5 Pickup Games (Get Out & Play Assignment)</span>
                </label>
            </div>
            <button class="btn-deploy" onclick="deployToAllSportsbooks()">
                🎯 Deploy to All Sportsbooks
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalSportsbooks">0</div>
                <div class="stat-label">Total Sportsbooks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ps5Games">0</div>
                <div class="stat-label">PS5 Games Available</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pickupGames">0</div>
                <div class="stat-label">Pickup Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="relationships">0</div>
                <div class="stat-label">Relationships Established</div>
            </div>
        </div>

        <div class="deployments-list">
            <h2 style="margin-bottom: 25px;">📊 Active Deployments</h2>
            <div id="deploymentsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading deployment status...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/smart-error-recovery.js"></script>
    <script>
        const smartRecovery = window.SmartErrorRecovery;
        let eventSource = null;

        async function deployToAllSportsbooks() {
            const includePS5 = document.getElementById('includePS5').checked;
            const includePickupGames = document.getElementById('includePickupGames').checked;

            try {
                const response = await fetch(`${API_BASE}/streaming/deploy/all-sportsbooks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        includePS5,
                        includePickupGames,
                        deploymentMode: 'production'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Successfully deployed to ${data.deployment.summary.sportsbooksDeployed} sportsbooks!\n\n` +
                          `PS5 Games: ${data.deployment.summary.ps5GamesAvailable}\n` +
                          `Pickup Games: ${data.deployment.summary.pickupGamesAvailable}\n` +
                          `Relationships: ${data.deployment.summary.relationshipsEstablished}`);
                    loadDeploymentStatus();
                } else {
                    alert('❌ Deployment failed: ' + data.error);
                }
            } catch (error) {
                console.error('Deployment error:', error);
                alert('❌ Deployment failed. Check console for details.');
            }
        }

        async function loadDeploymentStatus() {
            const data = await smartRecovery.fetchWithRetry(`${API_BASE}/streaming/deploy/status`);

            if (data && data.success) {
                document.getElementById('totalSportsbooks').textContent = data.deploymentStatus.totalSportsbooks || 0;
                document.getElementById('ps5Games').textContent = data.deploymentStatus.ps5Integration?.totalGames || 0;
                document.getElementById('pickupGames').textContent = data.deploymentStatus.pickupGames?.available || 0;
                document.getElementById('relationships').textContent = data.deploymentStatus.relationships?.established || 0;

                displayDeployments(data.deploymentStatus);
            } else {
                console.log('Failed to load deployment status, will retry automatically');
            }
        }

        function displayDeployments(status) {
            const container = document.getElementById('deploymentsList');

            container.innerHTML = `
                <div class="deployment-item">
                    <div class="deployment-header">
                        <div class="deployment-name">🌐 All Sportsbooks Deployment</div>
                        <span class="status-badge">● ACTIVE</span>
                    </div>
                    <div class="deployment-details">
                        <div class="detail-item">
                            <div class="detail-label">Total Sportsbooks</div>
                            <div class="detail-value">${status.totalSportsbooks}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Active Connections</div>
                            <div class="detail-value">${status.activeSportsbooks}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">PS5 Games</div>
                            <div class="detail-value">${status.ps5Integration.totalGames}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Pickup Games</div>
                            <div class="detail-value">${status.pickupGames.available}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Get Out & Play</div>
                            <div class="detail-value">${status.pickupGames.getOutAndPlay ? 'ENABLED' : 'DISABLED'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Relationships</div>
                            <div class="detail-value">${status.relationships.established}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function connectEventSource() {
            eventSource = smartRecovery.createSmartEventSource(
                `${API_BASE}/streaming/events`,
                (data) => {
                    console.log('Received event data:', data);
                    if (data.type === 'update' && data.deploymentStatus) {
                        loadDeploymentStatus();
                    }
                },
                (error) => {
                    console.log('Stream connection issue, auto-recovering...');
                }
            );
        }

        window.addEventListener('load', () => {
            loadDeploymentStatus();
            setInterval(loadDeploymentStatus, 30000);
            connectEventSource(); // Connect to EventSource on page load
        });

        // Visibility handling is now managed by SmartErrorRecovery
    </script>
</body>
</html>
